name: PipSight Pro — adaptive optimizer shadow verification

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: pipsight-adaptive-optimizer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  optimize:
    name: Run and verify adaptive optimizer
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify required files
        run: |
          set -euo pipefail

          required_files=(
            "adaptive-optimizer.js"
            "data/ai-memory.json"
            "data/ai-memory-state.json"
          )

          for file in "${required_files[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "::error file=$file::Required file is missing: $file"
              exit 1
            fi
          done

          echo "Adaptive optimizer source files are available."

      - name: Validate optimizer syntax
        run: |
          set -euo pipefail

          node --check adaptive-optimizer.js

          echo "Adaptive optimizer JavaScript syntax is valid."

      - name: Run adaptive optimizer in shadow mode
        run: |
          set -euo pipefail

          node adaptive-optimizer.js

      - name: Validate optimizer outputs
        run: |
          set -euo pipefail

          node <<'NODE'
          "use strict";

          const fs = require("fs");

          const files = [
            "data/adaptive-optimization.json",
            "data/adaptive-optimization-state.json"
          ];

          for (const filePath of files) {
            if (!fs.existsSync(filePath)) {
              throw new Error(
                `Required optimizer output was not created: ${filePath}`
              );
            }

            const raw =
              fs.readFileSync(
                filePath,
                "utf8"
              ).trim();

            if (!raw) {
              throw new Error(
                `Optimizer output is empty: ${filePath}`
              );
            }

            let parsed;

            try {
              parsed =
                JSON.parse(raw);
            } catch (error) {
              throw new Error(
                `${filePath} contains invalid JSON: ${error.message}`
              );
            }

            if (
              parsed === null ||
              typeof parsed !== "object" ||
              Array.isArray(parsed)
            ) {
              throw new Error(
                `${filePath} must contain a JSON object.`
              );
            }

            console.log(
              `Validated ${filePath}`
            );
          }

          const optimization =
            JSON.parse(
              fs.readFileSync(
                "data/adaptive-optimization.json",
                "utf8"
              )
            );

          if (optimization.mode !== "shadow") {
            throw new Error(
              "Adaptive optimizer must remain in shadow mode."
            );
          }

          if (
            optimization.activeParameters?.applied !==
            false
          ) {
            throw new Error(
              "Shadow optimizer must not apply active parameters."
            );
          }

          if (
            optimization.safety?.shadowOnly !==
            true
          ) {
            throw new Error(
              "Optimizer shadow safety flag is not enabled."
            );
          }

          if (
            optimization.safety?.minimumResolvedTrades !==
            50
          ) {
            throw new Error(
              "Optimizer minimum resolved-trade threshold must be 50."
            );
          }

          if (
            optimization.safety?.decisionModification !==
            false ||
            optimization.safety?.tradePlanModification !==
            false ||
            optimization.safety?.telegramModification !==
            false
          ) {
            throw new Error(
              "Optimizer safety guarantees are invalid."
            );
          }

          if (
            optimization.validation?.valid !==
            true
          ) {
            throw new Error(
              "Generated optimization document failed internal validation."
            );
          }

          console.log(
            "Adaptive optimizer shadow-safety validation passed."
          );

          console.log(
            `Total scopes: ${optimization.summary?.totalScopes ?? 0}`
          );

          console.log(
            `Eligible scopes: ${optimization.summary?.eligibleScopes ?? 0}`
          );

          console.log(
            `Insufficient-data scopes: ` +
            `${optimization.summary?.insufficientDataScopes ?? 0}`
          );
          NODE

      - name: Show optimizer changes
        run: |
          set -euo pipefail

          echo "Files changed by adaptive optimizer:"
          git status --short

      - name: Commit and push optimizer shadow outputs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          git config user.name "pipsight-robot"
          git config user.email "actions@users.noreply.github.com"

          # Strictly stage only files owned by the adaptive optimizer.
          git add -- \
            data/adaptive-optimization.json \
            data/adaptive-optimization-state.json

          if git diff --cached --quiet; then
            echo "No adaptive optimizer changes to commit."
            exit 0
          fi

          git commit -m "robot: refresh adaptive optimizer shadow state"

          push_succeeded=false

          for attempt in 1 2 3 4 5; do
            echo "Push attempt ${attempt} of 5..."

            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              push_succeeded=true
              break
            fi

            if [[ "$attempt" -eq 5 ]]; then
              break
            fi

            echo "Push was rejected. Fetching and rebasing..."

            git fetch origin "${GITHUB_REF_NAME}"

            if ! git rebase "origin/${GITHUB_REF_NAME}"; then
              echo "::error::Rebase failed while synchronizing optimizer state."
              git rebase --abort || true
              exit 1
            fi

            sleep $((attempt * 2))
          done

          if [[ "$push_succeeded" != "true" ]]; then
            echo "::error::Unable to push optimizer state after 5 attempts."
            exit 1
          fi

          echo "Adaptive optimizer shadow state committed successfully."

      - name: Log execution
        if: always()
        run: |
          echo "PipSight adaptive optimizer verification finished."
          echo "Status: ${{ job.status }}"
          echo "Repository: ${{ github.repository }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Run ID: ${{ github.run_id }}"
          echo "Completed at: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
