name: PipSight Pro — live GBP/JPY tick

on:
  schedule:
    - cron: "4,14,24,34,44,54 * * * *"

  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: pipsight-unified-analysis-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch:
    name: Fetch and publish live GBP/JPY tick
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify required source files
        run: |
          set -euo pipefail

          test -f fetch-gbpjpy-live.js

          echo "Required live GBP/JPY source file is available."

      - name: Validate JavaScript syntax
        run: |
          set -euo pipefail

          node --check fetch-gbpjpy-live.js

          echo "Live GBP/JPY JavaScript syntax is valid."

      - name: Verify API secret
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: |
          set -euo pipefail

          if [[ -z "${TWELVEDATA_API_KEY:-}" ]]; then
            echo "::error::TWELVEDATA_API_KEY is not configured."
            exit 1
          fi

          echo "Required API configuration validated."

      - name: Fetch live GBP/JPY tick
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: |
          set -euo pipefail

          node fetch-gbpjpy-live.js

      - name: Validate live tick output
        run: |
          set -euo pipefail

          node <<'NODE'
          "use strict";

          const fs = require("fs");

          const filePath =
            "data/gbpjpy-live.json";

          if (!fs.existsSync(filePath)) {
            throw new Error(
              `Required output file was not created: ${filePath}`
            );
          }

          const raw =
            fs.readFileSync(
              filePath,
              "utf8"
            ).trim();

          if (!raw) {
            throw new Error(
              `Output file is empty: ${filePath}`
            );
          }

          let parsed;

          try {
            parsed =
              JSON.parse(raw);
          } catch (error) {
            throw new Error(
              `Output file contains invalid JSON: ${filePath}: ${error.message}`
            );
          }

          if (
            parsed === null ||
            typeof parsed !== "object" ||
            Array.isArray(parsed)
          ) {
            throw new Error(
              `${filePath} must contain a JSON object.`
            );
          }

          const priceCandidates = [
            parsed.price,
            parsed.close,
            parsed.value,
            parsed.rate,
            parsed.last,
            parsed.currentPrice
          ];

          const price =
            priceCandidates
              .map(Number)
              .find(
                (value) =>
                  Number.isFinite(value) &&
                  value > 0
              );

          if (price === undefined) {
            throw new Error(
              `${filePath} does not contain a valid positive price.`
            );
          }

          console.log(
            `Validated ${filePath} with price ${price}.`
          );
          NODE

      - name: Commit and push updated tick
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          git config user.name "pipsight-robot"
          git config user.email "actions@users.noreply.github.com"

          # Strictly stage only the file owned by this workflow.
          git add -- \
            data/gbpjpy-live.json

          if git diff --cached --quiet; then
            echo "No live GBP/JPY tick changes to commit."
            exit 0
          fi

          git commit -m "robot: refresh live GBP/JPY tick"

          push_succeeded=false

          for attempt in 1 2 3 4 5; do
            echo "Push attempt ${attempt} of 5..."

            if git push origin HEAD:main; then
              push_succeeded=true
              break
            fi

            if [[ "${attempt}" -eq 5 ]]; then
              break
            fi

            echo "Push was rejected. Fetching and rebasing onto origin/main..."

            git fetch origin main

            if ! git rebase origin/main; then
              echo "::error::Rebase failed while synchronizing live GBP/JPY tick."
              git rebase --abort || true
              exit 1
            fi

            sleep $((attempt * 2))
          done

          if [[ "${push_succeeded}" != "true" ]]; then
            echo "::error::Unable to push live GBP/JPY tick after 5 attempts."
            exit 1
          fi

          echo "Live GBP/JPY tick committed and pushed successfully."

      - name: Log execution
        if: always()
        run: |
          echo "PipSight live GBP/JPY workflow finished."
          echo "Status: ${{ job.status }}"
          echo "Repository: ${{ github.repository }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Run ID: ${{ github.run_id }}"
          echo "Completed at: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
