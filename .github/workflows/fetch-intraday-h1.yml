name: PipSight Pro — intraday H1 market data

on:
  schedule:
    - cron: "7,22,37,52 * * * *"

  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: pipsight-unified-analysis-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch:
    name: Fetch and publish intraday H1 data
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify required source files
        run: |
          set -euo pipefail

          test -f fetch-intraday-h1.js

          echo "Required Intraday H1 source file is available."

      - name: Validate JavaScript syntax
        run: |
          set -euo pipefail

          node --check fetch-intraday-h1.js

          echo "Intraday H1 JavaScript syntax is valid."

      - name: Verify API secret
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: |
          set -euo pipefail

          if [[ -z "${TWELVEDATA_API_KEY:-}" ]]; then
            echo "::error::TWELVEDATA_API_KEY is not configured."
            exit 1
          fi

          echo "Required API configuration validated."

      - name: Fetch intraday H1
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: |
          set -euo pipefail

          node fetch-intraday-h1.js

      - name: Validate intraday H1 output
        run: |
          set -euo pipefail

          node <<'NODE'
          "use strict";

          const fs = require("fs");

          const filePath =
            "data/intraday-h1.json";

          if (!fs.existsSync(filePath)) {
            throw new Error(
              `Required output file was not created: ${filePath}`
            );
          }

          const raw =
            fs.readFileSync(
              filePath,
              "utf8"
            ).trim();

          if (!raw) {
            throw new Error(
              `Output file is empty: ${filePath}`
            );
          }

          let parsed;

          try {
            parsed =
              JSON.parse(raw);
          } catch (error) {
            throw new Error(
              `Output file contains invalid JSON: ${filePath}: ${error.message}`
            );
          }

          if (
            parsed === null ||
            typeof parsed !== "object" ||
            Array.isArray(parsed)
          ) {
            throw new Error(
              `${filePath} must contain a JSON object.`
            );
          }

          const pairKeys = [
            "XAUUSD",
            "GBPJPY"
          ];

          for (const pairKey of pairKeys) {
            const rows =
              parsed[pairKey];

            if (!Array.isArray(rows)) {
              throw new Error(
                `${pairKey} must contain an array.`
              );
            }

            if (rows.length === 0) {
              throw new Error(
                `${pairKey} contains no H1 candles.`
              );
            }

            const latest =
              rows[rows.length - 1];

            if (
              !latest ||
              typeof latest !== "object" ||
              Array.isArray(latest)
            ) {
              throw new Error(
                `${pairKey} latest candle is invalid.`
              );
            }

            const open =
              Number(latest.open);

            const high =
              Number(latest.high);

            const low =
              Number(latest.low);

            const close =
              Number(latest.close);

            const values = {
              open,
              high,
              low,
              close
            };

            for (
              const [field, value]
              of Object.entries(values)
            ) {
              if (
                !Number.isFinite(value) ||
                value <= 0
              ) {
                throw new Error(
                  `${pairKey} latest ${field} is invalid.`
                );
              }
            }

            if (
              high < low ||
              high < open ||
              high < close ||
              low > open ||
              low > close
            ) {
              throw new Error(
                `${pairKey} latest OHLC relationships are invalid.`
              );
            }

            console.log(
              `Validated latest ${pairKey} H1 candle.`
            );
          }

          console.log(
            `Validated ${filePath}`
          );
          NODE

      - name: Commit and push updated H1 data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          git config user.name "pipsight-robot"
          git config user.email "actions@users.noreply.github.com"

          # Strictly stage only the file owned by this workflow.
          git add -- \
            data/intraday-h1.json

          if git diff --cached --quiet; then
            echo "No intraday H1 changes to commit."
            exit 0
          fi

          git commit -m "robot: refresh intraday H1"

          push_succeeded=false

          for attempt in 1 2 3 4 5; do
            echo "Push attempt ${attempt} of 5..."

            if git push origin HEAD:main; then
              push_succeeded=true
              break
            fi

            if [[ "${attempt}" -eq 5 ]]; then
              break
            fi

            echo "Push was rejected. Fetching and rebasing onto origin/main..."

            git fetch origin main

            if ! git rebase origin/main; then
              echo "::error::Rebase failed while synchronizing Intraday H1 data."
              git rebase --abort || true
              exit 1
            fi

            sleep $((attempt * 2))
          done

          if [[ "${push_succeeded}" != "true" ]]; then
            echo "::error::Unable to push Intraday H1 data after 5 attempts."
            exit 1
          fi

          echo "Intraday H1 data committed and pushed successfully."

      - name: Log execution
        if: always()
        run: |
          echo "PipSight Intraday H1 workflow finished."
          echo "Status: ${{ job.status }}"
          echo "Repository: ${{ github.repository }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Run ID: ${{ github.run_id }}"
          echo "Completed at: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
