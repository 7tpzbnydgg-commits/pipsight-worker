name: PipSight Robot — scalp candles (5m)

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: pipsight-robots
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch scalp candles
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: node fetch-scalp-candles.js

      - name: Run scalp analysis
        run: node run-scalp-analysis.js

      - name: Commit updated scalp data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "pipsight-robot"
          git config user.email "actions@users.noreply.github.com"

          git add \
            data/scalp-candles.json \
            data/scalp-signals.json \
            data/scalp-signal-log.json

          if [[ -n "$(git status --porcelain)" ]]; then
            git commit -m "robot: refresh scalp candles and signals"

            git pull --rebase origin main

            git push origin main
          else
            echo "No changes to commit"
          fi

      - name: Log execution
        if: always()
        run: |
          echo "✅ Scalp candles and signals updated at $(date)"
          echo "Repository: ${{ github.repository }}"
          echo "Workflow completed"
