name: PipSight Pro — unified scalp and live analysis

on:
  schedule:
    - cron: "*/10 * * * *"

  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: pipsight-analysis-writes-${{ github.ref }}
  cancel-in-progress: false

env:
  PIPSIGHT_TELEGRAM_MODES: "master,swing,intraday,scalp"
  PIPSIGHT_TELEGRAM_NOTIFY_HOLD: "false"
  PIPSIGHT_POLICY_REFRESH_MINUTES: "120"

jobs:
  analyze:
    name: Refresh, resolve and publish unified analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate required configuration and files
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: |
          set -euo pipefail

          if [[ -z "${TWELVEDATA_API_KEY:-}" ]]; then
            echo "::error::TWELVEDATA_API_KEY secret is missing or empty."
            exit 1
          fi

          required_files=(
            "fetch-scalp-candles.js"
            "run-scalp-analysis.js"
            "run-live-analysis.js"
            "resolve-analysis-history.js"
            "run-learning-engine.js"
            "learner.js"
            "ai-memory.js"
            "ai-policy-engine.js"
            "ai-decision-engine.js"
            "ai-safety-gate.js"
            "data/autonomous-config.json"
            "data/analysis-history.json"
          )

          for file in "${required_files[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "::error file=$file::Required file is missing: $file"
              exit 1
            fi
          done

          echo "Required configuration and pipeline files are available."

      - name: Validate JavaScript syntax
        run: |
          set -euo pipefail

          scripts=(
            "fetch-scalp-candles.js"
            "run-scalp-analysis.js"
            "run-live-analysis.js"
            "resolve-analysis-history.js"
            "run-learning-engine.js"
            "learner.js"
            "ai-memory.js"
            "ai-policy-engine.js"
            "ai-decision-engine.js"
            "ai-safety-gate.js"
          )

          for script in "${scripts[@]}"; do
            node --check "$script"
          done

          if [[ -f "learning-enrichment.js" ]]; then
            node --check "learning-enrichment.js"
          fi

          echo "Unified autonomous pipeline JavaScript syntax is valid."

      - name: Verify autonomous engine compatibility
        run: |
          set -euo pipefail

          node <<'NODE'
          "use strict";

          const fs = require("fs");
          const crypto = require("crypto");

          const live = require("./run-live-analysis.js");
          const resolver = require("./resolve-analysis-history.js");
          const runner = require("./run-learning-engine.js");
          const { LearningConfig } = require("./learner.js");
          const memory = require("./ai-memory.js");
          const policy = require("./ai-policy-engine.js");
          const decision = require("./ai-decision-engine.js");
          const safety = require("./ai-safety-gate.js");

          const checks = [
            [live.ENGINE_VERSION, "1.4.2-pro", "Live Analysis compatibility version"],
            [live.AUTONOMOUS_LIVE_VERSION, "1.4.0", "Live Analysis autonomous version"],
            [resolver.ENGINE_VERSION, "1.0.2", "Resolver compatibility version"],
            [resolver.AUTONOMOUS_RESOLVER_VERSION, "1.4.0", "Resolver autonomous version"],
            [runner.ENGINE_VERSION, "1.4.0", "Learning runner version"],
            [LearningConfig.VERSION, "2.1.0", "Learner compatibility version"],
            [LearningConfig.AUTONOMOUS_VERSION, "1.4.0", "Learner autonomous version"],
            [memory.ENGINE_VERSION, "1.0.1", "AI Memory compatibility version"],
            [memory.AUTONOMOUS_MEMORY_VERSION, "1.4.0", "AI Memory autonomous version"],
            [policy.ENGINE_VERSION, "1.4.0", "AI Policy Engine version"],
            [decision.ENGINE_VERSION, "1.4.0", "AI Decision Engine version"],
            [safety.ENGINE_VERSION, "1.4.0", "AI Safety Gate version"]
          ];

          for (const [actual, expected, label] of checks) {
            if (actual !== expected) {
              throw new Error(`${label} ${actual} is unsupported; expected ${expected}.`);
            }
          }

          const requiredFunctions = [
            [live, "applyAutonomousControlToOutput"],
            [runner, "runLearningEngine"],
            [policy, "runAIPolicyEngine"],
            [decision, "evaluateDecision"],
            [decision, "persistDecisionResult"],
            [safety, "evaluateSafetyGate"],
            [safety, "persistSafetyResult"]
          ];

          for (const [moduleValue, functionName] of requiredFunctions) {
            if (typeof moduleValue[functionName] !== "function") {
              throw new Error(`Required function is missing: ${functionName}()`);
            }
          }

          const configPath = "data/autonomous-config.json";
          const config = JSON.parse(fs.readFileSync(configPath, "utf8"));
          const allowedModes = new Set([
            "OFF",
            "SHADOW",
            "CONTROLLED",
            "AUTONOMOUS",
            "EMERGENCY_STOP"
          ]);

          if (
            config.configVersion !== "1.4.0" ||
            !config.deployment ||
            !allowedModes.has(config.deployment.mode) ||
            config.deployment.allowRuntimeSelfPromotion !== false ||
            config.riskSafetyGate?.immutable !== true ||
            config.riskSafetyGate?.policyMayOverride !== false
          ) {
            throw new Error("data/autonomous-config.json failed the autonomous governance contract.");
          }

          if (
            config.deployment.mode === "SHADOW" &&
            Number(config.deployment.autonomousRolloutPercent) !== 0
          ) {
            throw new Error("SHADOW mode must keep autonomousRolloutPercent at 0.");
          }

          const hash = crypto
            .createHash("sha256")
            .update(fs.readFileSync(configPath))
            .digest("hex");

          console.log(`Autonomous engine compatibility passed. Config SHA-256: ${hash}`);
          NODE

      - name: Fetch scalp candles
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: |
          set -euo pipefail

          node fetch-scalp-candles.js

      - name: Validate closed scalp candles
        run: |
          set -euo pipefail

          node <<'NODE'
          "use strict";

          const fs = require("fs");

          const filePath =
            "data/scalp-candles.json";

          const intervalMs =
            5 * 60 * 1000;

          if (!fs.existsSync(filePath)) {
            throw new Error(
              `Required output file was not created: ${filePath}`
            );
          }

          const raw =
            fs.readFileSync(
              filePath,
              "utf8"
            ).trim();

          if (!raw) {
            throw new Error(
              `Output file is empty: ${filePath}`
            );
          }

          let data;

          try {
            data =
              JSON.parse(raw);
          } catch (error) {
            throw new Error(
              `Output file contains invalid JSON: ${error.message}`
            );
          }

          if (
            data === null ||
            typeof data !== "object" ||
            Array.isArray(data)
          ) {
            throw new Error(
              `${filePath} must contain a JSON object.`
            );
          }

          const pairs = [
            "XAUUSD",
            "GBPJPY"
          ];

          const nowMs =
            Date.now();

          for (const pair of pairs) {
            const rows =
              data[pair];

            if (
              !Array.isArray(rows) ||
              rows.length === 0
            ) {
              throw new Error(
                `${filePath} does not contain usable ${pair} candles.`
              );
            }

            let previousTimestamp =
              null;

            for (
              let index = 0;
              index < rows.length;
              index++
            ) {
              const row =
                rows[index];

              if (
                row === null ||
                typeof row !== "object"
              ) {
                throw new Error(
                  `${pair} candle ${index} is invalid.`
                );
              }

              const timestamp =
                Date.parse(
                  String(
                    row.time ??
                    row.datetime ??
                    ""
                  ).replace(
                    " ",
                    "T"
                  ) + (
                    String(
                      row.time ??
                      row.datetime ??
                      ""
                    ).includes("Z")
                      ? ""
                      : "Z"
                  )
                );

              if (!Number.isFinite(timestamp)) {
                throw new Error(
                  `${pair} candle ${index} has an invalid timestamp.`
                );
              }

              if (
                timestamp +
                  intervalMs >
                nowMs
              ) {
                throw new Error(
                  `${pair} candle ${index} is still open or future-dated.`
                );
              }

              const open =
                Number(row.open);

              const high =
                Number(row.high);

              const low =
                Number(row.low);

              const close =
                Number(row.close);

              if (
                ![
                  open,
                  high,
                  low,
                  close
                ].every(
                  Number.isFinite
                )
              ) {
                throw new Error(
                  `${pair} candle ${index} contains invalid OHLC values.`
                );
              }

              if (
                open <= 0 ||
                high <= 0 ||
                low <= 0 ||
                close <= 0 ||
                high < low ||
                high < open ||
                high < close ||
                low > open ||
                low > close
              ) {
                throw new Error(
                  `${pair} candle ${index} contains invalid OHLC geometry.`
                );
              }

              if (
                previousTimestamp !== null &&
                timestamp <=
                  previousTimestamp
              ) {
                throw new Error(
                  `${pair} candles are not strictly chronological.`
                );
              }

              previousTimestamp =
                timestamp;
            }

            const stale =
              data.stale?.[pair] ===
                true ||
              data.metadata?.[pair]
                ?.stale ===
                true;

            if (stale) {
              console.warn(
                `${pair} source is stale. ` +
                "The scalp engine must publish WAIT only."
              );
            }

            console.log(
              `Validated ${rows.length} completed ${pair} candles.`
            );
          }
          NODE

      - name: Run scalp analysis
        run: |
          set -euo pipefail

          node run-scalp-analysis.js

      - name: Validate scalp analysis outputs
        run: |
          set -euo pipefail

          node <<'NODE'
          "use strict";

          const fs = require("fs");

          const outputFiles = [
            "data/scalp-signals.json",
            "data/scalp-signal-log.json"
          ];

          for (const filePath of outputFiles) {
            if (!fs.existsSync(filePath)) {
              throw new Error(
                `Required output file was not created: ${filePath}`
              );
            }

            const raw =
              fs.readFileSync(
                filePath,
                "utf8"
              ).trim();

            if (!raw) {
              throw new Error(
                `Output file is empty: ${filePath}`
              );
            }

            let data;

            try {
              data =
                JSON.parse(raw);
            } catch (error) {
              throw new Error(
                `${filePath} contains invalid JSON: ${error.message}`
              );
            }

            if (
              data === null ||
              typeof data !== "object"
            ) {
              throw new Error(
                `${filePath} must contain valid JSON data.`
              );
            }

            console.log(
              `Validated ${filePath}`
            );
          }
          NODE


      - name: Prepare validated autonomous policy snapshot
        id: autonomous-policy
        run: |
          set -euo pipefail

          adaptive_sources=(
            "data/learning-data.json"
            "data/confidence-data.json"
            "data/learning-engine-state.json"
            "data/ai-memory.json"
            "data/ai-memory-state.json"
          )

          bootstrap=false

          for file in "${adaptive_sources[@]}"; do
            if [[ ! -s "$file" ]]; then
              echo "Adaptive source is missing or empty: $file"
              bootstrap=true
            fi
          done

          if [[ "$bootstrap" == "true" ]]; then
            echo "Bootstrapping the learning, AI Memory and AI Policy chain."
            node run-learning-engine.js
          fi

          refresh_env="${RUNNER_TEMP}/autonomous-policy-refresh.env"

          node > "$refresh_env" <<'NODE'
          "use strict";

          const fs = require("fs");
          const crypto = require("crypto");

          const refreshMinutes = Math.max(
            1,
            Number(process.env.PIPSIGHT_POLICY_REFRESH_MINUTES || 120)
          );

          function readObject(filePath) {
            if (!fs.existsSync(filePath)) {
              return null;
            }

            const raw = fs.readFileSync(filePath, "utf8").trim();
            return raw ? JSON.parse(raw) : null;
          }

          function hashFile(filePath) {
            return crypto
              .createHash("sha256")
              .update(fs.readFileSync(filePath))
              .digest("hex");
          }

          const sourcePaths = {
            autonomousConfig: "data/autonomous-config.json",
            learningData: "data/learning-data.json",
            confidenceData: "data/confidence-data.json",
            aiMemory: "data/ai-memory.json"
          };

          const policy = readObject("data/ai-policy.json");
          const state = readObject("data/ai-policy-state.json");
          const reasons = [];
          let forceRefresh = false;

          if (!policy) {
            reasons.push("policy-missing");
          }

          if (!state) {
            reasons.push("policy-state-missing");
          } else if (state.pendingTransaction) {
            reasons.push("pending-policy-transaction");
          }

          if (policy) {
            const generatedAt = Date.parse(policy.generatedAt || "");
            const ageMs = Date.now() - generatedAt;

            if (!Number.isFinite(generatedAt)) {
              reasons.push("policy-generatedAt-invalid");
              forceRefresh = true;
            } else if (ageMs > refreshMinutes * 60 * 1000) {
              reasons.push("policy-refresh-margin-reached");
              forceRefresh = true;
            } else if (ageMs < -60 * 1000) {
              reasons.push("policy-future-dated");
              forceRefresh = true;
            }

            for (const [key, filePath] of Object.entries(sourcePaths)) {
              if (!fs.existsSync(filePath)) {
                reasons.push(`source-missing-${key}`);
                continue;
              }

              const expected = hashFile(filePath);
              const actual = policy.source?.[key]?.hash;

              if (actual !== expected) {
                reasons.push(`source-hash-mismatch-${key}`);
                forceRefresh = false;
              }
            }
          }

          const refresh = reasons.length > 0;
          console.log(`POLICY_REFRESH=${refresh ? "true" : "false"}`);
          console.log(`POLICY_FORCE_REFRESH=${forceRefresh && policy ? "true" : "false"}`);
          console.log(`POLICY_REFRESH_REASON=${reasons.join(",") || "current"}`);
          NODE

          # Values are generated internally as fixed booleans and comma-separated identifiers.
          source "$refresh_env"

          echo "refresh=$POLICY_REFRESH" >> "$GITHUB_OUTPUT"
          echo "force_refresh=$POLICY_FORCE_REFRESH" >> "$GITHUB_OUTPUT"
          echo "reason=$POLICY_REFRESH_REASON" >> "$GITHUB_OUTPUT"

          if [[ "$POLICY_REFRESH" != "true" ]]; then
            echo "AI Policy snapshot is current."
            exit 0
          fi

          echo "Refreshing AI Policy snapshot: $POLICY_REFRESH_REASON"

          policy_backup="${RUNNER_TEMP}/ai-policy.backup.json"
          state_backup="${RUNNER_TEMP}/ai-policy-state.backup.json"
          had_policy=false
          had_state=false

          if [[ -f data/ai-policy.json ]]; then
            cp data/ai-policy.json "$policy_backup"
            had_policy=true
          fi

          if [[ -f data/ai-policy-state.json ]]; then
            cp data/ai-policy-state.json "$state_backup"
            had_state=true
          fi

          if [[ "$POLICY_FORCE_REFRESH" == "true" ]]; then
            # The engine intentionally avoids rewriting unchanged policy content.
            # Removing only the working policy copy forces a fresh generatedAt while
            # backups keep the last-known-good snapshot recoverable on failure.
            rm -f data/ai-policy.json
          fi

          if ! node ai-policy-engine.js; then
            echo "::error::AI Policy refresh failed; restoring last-known-good files."

            if [[ "$had_policy" == "true" ]]; then
              cp "$policy_backup" data/ai-policy.json
            else
              rm -f data/ai-policy.json
            fi

            if [[ "$had_state" == "true" ]]; then
              cp "$state_backup" data/ai-policy-state.json
            else
              rm -f data/ai-policy-state.json
            fi

            exit 1
          fi

      - name: Validate autonomous policy integrity
        run: |
          set -euo pipefail

          node <<'NODE'
          "use strict";

          const fs = require("fs");
          const crypto = require("crypto");

          function readObject(filePath) {
            if (!fs.existsSync(filePath)) {
              throw new Error(`Required autonomous file is missing: ${filePath}`);
            }

            const raw = fs.readFileSync(filePath, "utf8").trim();

            if (!raw) {
              throw new Error(`Required autonomous file is empty: ${filePath}`);
            }

            const parsed = JSON.parse(raw);

            if (!parsed || typeof parsed !== "object" || Array.isArray(parsed)) {
              throw new Error(`${filePath} must contain a JSON object.`);
            }

            return parsed;
          }

          function hashFile(filePath) {
            return crypto
              .createHash("sha256")
              .update(fs.readFileSync(filePath))
              .digest("hex");
          }

          const config = readObject("data/autonomous-config.json");
          const policy = readObject("data/ai-policy.json");
          const state = readObject("data/ai-policy-state.json");

          if (
            policy.engineName !== "PipSight Pro Autonomous AI Policy Engine" ||
            policy.engineVersion !== "1.4.0" ||
            policy.config?.version !== "1.4.0" ||
            policy.mode !== config.deployment.mode ||
            Number(policy.autonomousRolloutPercent) !==
              Number(config.deployment.autonomousRolloutPercent) ||
            policy.validation?.valid !== true ||
            policy.safety?.policyOnly !== true ||
            policy.safety?.immutableSafetyGateRequired !== true ||
            policy.safety?.riskLimitModification !== false
          ) {
            throw new Error("data/ai-policy.json failed its governance contract.");
          }

          if (
            state.engineName !== policy.engineName ||
            state.engineVersion !== "1.4.0" ||
            state.pendingTransaction !== null ||
            state.policyHash !== policy.metadata?.policyContentHash ||
            state.lastKnownGoodPolicyHash !== policy.metadata?.policyContentHash
          ) {
            throw new Error("data/ai-policy-state.json is not committed to the active policy hash.");
          }

          const sources = {
            autonomousConfig: "data/autonomous-config.json",
            learningData: "data/learning-data.json",
            confidenceData: "data/confidence-data.json",
            aiMemory: "data/ai-memory.json"
          };

          for (const [key, filePath] of Object.entries(sources)) {
            const actualHash = hashFile(filePath);

            if (
              policy.source?.[key]?.hash !== actualHash ||
              state.sourceHashes?.[key] !== actualHash
            ) {
              throw new Error(`AI Policy source hash mismatch: ${key}`);
            }
          }

          const generatedAt = Date.parse(policy.generatedAt || "");
          const maximumAgeMinutes = Math.max(
            1,
            Number(config.policyValidation?.maximumPolicyAgeMinutes || 180)
          );
          const ageMs = Date.now() - generatedAt;

          if (
            !Number.isFinite(generatedAt) ||
            ageMs < -60 * 1000 ||
            ageMs > maximumAgeMinutes * 60 * 1000
          ) {
            throw new Error("AI Policy freshness validation failed.");
          }

          console.log(
            `Validated AI Policy ${policy.metadata.policyContentHash} ` +
            `in ${policy.mode} mode with ${policy.summary?.policyCount ?? 0} policy buckets.`
          );
          NODE

      - name: Run live analysis
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail

          node run-live-analysis.js

      - name: Validate live analysis outputs
        run: |
          set -euo pipefail

          node <<'NODE'
          "use strict";

          const fs = require("fs");

          const outputFiles = [
            "data/live-analysis.json",
            "data/analysis-history.json",
            "data/notify-state.json",
            "data/ai-decision-preview.json",
            "data/ai-decision-log.json",
            "data/ai-decision-state.json",
            "data/ai-safety-preview.json",
            "data/ai-safety-log.json",
            "data/ai-safety-state.json"
          ];

          for (const filePath of outputFiles) {
            if (!fs.existsSync(filePath)) {
              throw new Error(
                `Required output file was not created: ${filePath}`
              );
            }

            const raw =
              fs.readFileSync(
                filePath,
                "utf8"
              ).trim();

            if (!raw) {
              throw new Error(
                `Output file is empty: ${filePath}`
              );
            }

            let data;

            try {
              data =
                JSON.parse(raw);
            } catch (error) {
              throw new Error(
                `${filePath} contains invalid JSON: ${error.message}`
              );
            }

            if (
              data === null ||
              typeof data !== "object"
            ) {
              throw new Error(
                `${filePath} must contain valid JSON data.`
              );
            }

            console.log(
              `Validated ${filePath}`
            );
          }

          const live = JSON.parse(
            fs.readFileSync("data/live-analysis.json", "utf8")
          );
          const config = JSON.parse(
            fs.readFileSync("data/autonomous-config.json", "utf8")
          );
          const decisionState = JSON.parse(
            fs.readFileSync("data/ai-decision-state.json", "utf8")
          );
          const safetyState = JSON.parse(
            fs.readFileSync("data/ai-safety-state.json", "utf8")
          );

          if (
            live.engineVersion !== "1.4.2-pro" ||
            live.autonomous?.version !== "1.4.0" ||
            live.autonomous?.configuredMode !== config.deployment.mode ||
            decisionState.engineVersion !== "1.4.0" ||
            safetyState.engineVersion !== "1.4.0" ||
            safetyState.pendingTransaction !== null
          ) {
            throw new Error(
              "Live autonomous output/state validation failed."
            );
          }

          if (fs.existsSync("data/ai-safety-state.pending.json")) {
            throw new Error(
              "AI Safety Gate left an incomplete pending transaction."
            );
          }
          NODE

      - name: Resolve open trades
        id: resolve
        run: |
          set -euo pipefail

          history_file="data/analysis-history.json"
          before_file="${RUNNER_TEMP}/analysis-history-before-resolver.json"

          cp "$history_file" "$before_file"

          node resolve-analysis-history.js

          if cmp -s "$before_file" "$history_file"; then
            echo "history_changed=false" >> "$GITHUB_OUTPUT"
            echo "Resolver did not change analysis history."
          else
            echo "history_changed=true" >> "$GITHUB_OUTPUT"
            echo "Resolver changed analysis history."
          fi

      - name: Validate resolved analysis history
        run: |
          set -euo pipefail

          node <<'NODE'
          "use strict";

          const fs = require("fs");

          const filePath =
            "data/analysis-history.json";

          const raw =
            fs.readFileSync(
              filePath,
              "utf8"
            ).trim();

          if (!raw) {
            throw new Error(
              `${filePath} is empty.`
            );
          }

          let history;

          try {
            history =
              JSON.parse(raw);
          } catch (error) {
            throw new Error(
              `${filePath} contains invalid JSON: ${error.message}`
            );
          }

          if (
            history === null ||
            typeof history !== "object" ||
            Array.isArray(history)
          ) {
            throw new Error(
              `${filePath} must contain a JSON object.`
            );
          }

          if (
            !Array.isArray(history.records) ||
            !Array.isArray(history.history) ||
            !Array.isArray(history.items) ||
            !Array.isArray(history.closed)
          ) {
            throw new Error(
              "History records, history, items and closed must be arrays."
            );
          }

          if (
            history.records.length !==
              history.history.length ||
            history.records.length !==
              history.items.length
          ) {
            throw new Error(
              "History aliases are not synchronized."
            );
          }

          console.log(
            `Validated history: ` +
            `${history.records.length} rich records, ` +
            `${history.closed.length} legacy closed records.`
          );
          NODE

      - name: Determine learning refresh requirement
        id: learning-gate
        run: |
          set -euo pipefail

          refresh="${{ steps.resolve.outputs.history_changed }}"

          required_outputs=(
            "data/learning-data.json"
            "data/confidence-data.json"
            "data/learning-engine-state.json"
            "data/ai-memory.json"
            "data/ai-memory-state.json"
            "data/ai-policy.json"
            "data/ai-policy-state.json"
          )

          for file in "${required_outputs[@]}"; do
            if [[ ! -s "$file" ]]; then
              echo "Missing required adaptive output: $file"
              refresh="true"
            fi
          done

          echo "refresh=$refresh" >> "$GITHUB_OUTPUT"

          if [[ "$refresh" == "true" ]]; then
            echo "Learning, AI Memory and AI Policy refresh is required."
          else
            echo "No resolved-history change and all adaptive outputs exist; refresh will be skipped."
          fi

      - name: Run learning engine
        if: steps.learning-gate.outputs.refresh == 'true'
        run: |
          set -euo pipefail

          node run-learning-engine.js

      - name: Validate adaptive autonomous chain
        if: steps.learning-gate.outputs.refresh == 'true'
        run: |
          set -euo pipefail

          node <<'NODE'
          "use strict";

          const fs = require("fs");

          const requiredObjects = [
            "data/learning-data.json",
            "data/confidence-data.json",
            "data/learning-engine-state.json",
            "data/ai-memory.json",
            "data/ai-memory-state.json",
            "data/ai-policy.json",
            "data/ai-policy-state.json"
          ];

          for (const filePath of requiredObjects) {
            if (!fs.existsSync(filePath)) {
              throw new Error(`Required adaptive output was not created: ${filePath}`);
            }

            const raw = fs.readFileSync(filePath, "utf8").trim();

            if (!raw) {
              throw new Error(`Adaptive output is empty: ${filePath}`);
            }

            const data = JSON.parse(raw);

            if (!data || typeof data !== "object" || Array.isArray(data)) {
              throw new Error(`${filePath} must contain a JSON object.`);
            }
          }

          const learningState = JSON.parse(
            fs.readFileSync("data/learning-engine-state.json", "utf8")
          );
          const memory = JSON.parse(
            fs.readFileSync("data/ai-memory.json", "utf8")
          );
          const memoryState = JSON.parse(
            fs.readFileSync("data/ai-memory-state.json", "utf8")
          );
          const policy = JSON.parse(
            fs.readFileSync("data/ai-policy.json", "utf8")
          );
          const policyState = JSON.parse(
            fs.readFileSync("data/ai-policy-state.json", "utf8")
          );

          if (
            learningState.pendingTransaction !== null ||
            memory.engineVersion !== "1.0.1" ||
            memory.autonomousMemory?.engineVersion !== "1.4.0" ||
            memoryState.pendingTransaction !== null ||
            policy.engineVersion !== "1.4.0" ||
            policy.validation?.valid !== true ||
            policyState.pendingTransaction !== null ||
            policyState.policyHash !== policy.metadata?.policyContentHash
          ) {
            throw new Error("Adaptive autonomous chain failed its committed-state contract.");
          }

          console.log(
            `Adaptive chain validated: ${policy.summary?.acceptedTrades ?? 0} trades, ` +
            `${policy.summary?.policyCount ?? 0} policy buckets.`
          );
          NODE

      - name: Show unified pipeline changes
        run: |
          set -euo pipefail

          echo "Changed files after unified pipeline:"
          git status --short

          echo "Resolver history changed: ${{ steps.resolve.outputs.history_changed }}"
          echo "Adaptive refresh executed: ${{ steps.learning-gate.outputs.refresh }}"
          echo "Policy preflight refresh: ${{ steps.autonomous-policy.outputs.refresh }}"
          echo "Policy refresh reason: ${{ steps.autonomous-policy.outputs.reason }}"

      - name: Commit and push unified pipeline snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_TYPE}" != "branch" ]]; then
            echo "::error::Unified analysis can only commit from a branch workflow run."
            exit 1
          fi

          git config user.name "pipsight-robot"
          git config user.email "actions@users.noreply.github.com"

          files_to_commit=(
            "data/scalp-candles.json"
            "data/scalp-signals.json"
            "data/scalp-signal-log.json"
            "data/live-analysis.json"
            "data/analysis-history.json"
            "data/notify-state.json"
            "data/learning-data.json"
            "data/confidence-data.json"
            "data/learning-engine-state.json"
            "data/learning-enrichment.json"
            "data/learning-enrichment-state.json"
            "data/ai-memory.json"
            "data/ai-memory-state.json"
            "data/ai-policy.json"
            "data/ai-policy-state.json"
            "data/ai-decision-preview.json"
            "data/ai-decision-log.json"
            "data/ai-decision-state.json"
            "data/ai-safety-preview.json"
            "data/ai-safety-log.json"
            "data/ai-safety-state.json"
          )

          existing_files=()

          for file in "${files_to_commit[@]}"; do
            if [[ -f "$file" ]]; then
              existing_files+=("$file")
            fi
          done

          if [[ "${#existing_files[@]}" -eq 0 ]]; then
            echo "No unified pipeline output files are available."
            exit 0
          fi

          git add -- "${existing_files[@]}"

          if git diff --cached --quiet; then
            echo "No unified pipeline changes to commit."
            exit 0
          fi

          git commit -m "robot: refresh unified autonomous analysis state"

          push_succeeded=false

          for attempt in 1 2 3 4 5; do
            echo "Push attempt ${attempt} of 5..."

            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              push_succeeded=true
              break
            fi

            if [[ "$attempt" -eq 5 ]]; then
              break
            fi

            echo "Push was rejected. Fetching and rebasing..."

            git fetch origin "${GITHUB_REF_NAME}"

            if ! git rebase "origin/${GITHUB_REF_NAME}"; then
              echo "::error::Rebase failed while synchronizing the unified pipeline."
              git rebase --abort || true
              exit 1
            fi

            sleep $((attempt * 2))
          done

          if [[ "$push_succeeded" != "true" ]]; then
            echo "::error::Unable to push unified pipeline state after 5 attempts."
            exit 1
          fi

          echo "Unified pipeline state committed successfully."

      - name: Log execution
        if: always()
        run: |
          echo "PipSight unified pipeline workflow finished."
          echo "Status: ${{ job.status }}"
          echo "Repository: ${{ github.repository }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Run ID: ${{ github.run_id }}"
          echo "Completed at: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
