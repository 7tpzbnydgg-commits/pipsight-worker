name: PipSight Pro — signals manual recovery

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: pipsight-news-signals-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch:
    name: Run and publish signals manually
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify required source files
        run: |
          set -euo pipefail

          test -f fetch-signals.js
          test -f data/news-feed.json
          test -f data/xau-usd-history.json

          echo "Required signal-engine source files are available."

      - name: Validate signal-engine syntax
        run: |
          set -euo pipefail

          node --check fetch-signals.js

          echo "Signal-engine JavaScript syntax is valid."

      - name: Validate news input
        run: |
          set -euo pipefail

          node <<'NODE'
          "use strict";

          const fs = require("fs");

          const filePath =
            "data/news-feed.json";

          if (!fs.existsSync(filePath)) {
            throw new Error(
              `Required source file does not exist: ${filePath}`
            );
          }

          const raw =
            fs.readFileSync(
              filePath,
              "utf8"
            ).trim();

          if (!raw) {
            throw new Error(
              `Source file is empty: ${filePath}`
            );
          }

          let parsed;

          try {
            parsed =
              JSON.parse(raw);
          } catch (error) {
            throw new Error(
              `Source file contains invalid JSON: ${filePath}: ${error.message}`
            );
          }

          if (
            parsed === null ||
            typeof parsed !== "object" ||
            Array.isArray(parsed)
          ) {
            throw new Error(
              `${filePath} must contain the news producer object contract.`
            );
          }

          if (
            !Number.isFinite(
              Date.parse(parsed.updatedAt || "")
            )
          ) {
            throw new Error(
              `${filePath}.updatedAt must be a valid timestamp.`
            );
          }

          if (
            !Number.isInteger(parsed.feedCount) ||
            parsed.feedCount !== 3
          ) {
            throw new Error(
              `${filePath}.feedCount must equal the configured producer feed count (3).`
            );
          }

          if (
            !Number.isInteger(parsed.itemCount) ||
            parsed.itemCount < 0 ||
            !Array.isArray(parsed.items) ||
            parsed.itemCount !== parsed.items.length
          ) {
            throw new Error(
              `${filePath} has an invalid itemCount/items contract.`
            );
          }

          const validPairs =
            new Set([
              "XAU/USD",
              "GBP/JPY"
            ]);

          const validImpacts =
            new Set([
              "high",
              "normal"
            ]);

          for (
            let index = 0;
            index < parsed.items.length;
            index++
          ) {
            const item =
              parsed.items[index];

            if (
              item === null ||
              typeof item !== "object" ||
              Array.isArray(item)
            ) {
              throw new Error(
                `${filePath}.items[${index}] must be a JSON object.`
              );
            }

            if (!validPairs.has(item.pair)) {
              throw new Error(
                `${filePath}.items[${index}] has an unsupported pair.`
              );
            }

            if (
              typeof item.date !== "string" ||
              !item.date.trim() ||
              !Number.isFinite(
                Date.parse(item.publishedAt || "")
              )
            ) {
              throw new Error(
                `${filePath}.items[${index}] has invalid publication metadata.`
              );
            }

            if (
              !Number.isFinite(item.sentiment) ||
              item.sentiment < -20 ||
              item.sentiment > 20
            ) {
              throw new Error(
                `${filePath}.items[${index}] has invalid sentiment.`
              );
            }

            if (
              typeof item.source !== "string" ||
              !item.source.trim() ||
              typeof item.text !== "string" ||
              !item.text.trim() ||
              !validImpacts.has(item.impact)
            ) {
              throw new Error(
                `${filePath}.items[${index}] has invalid news content fields.`
              );
            }
          }

          console.log(
            `Validated ${filePath} with ${parsed.items.length} producer-contract items.`
          );
          NODE

      - name: Run signal engine
        run: |
          set -euo pipefail

          node fetch-signals.js

      - name: Validate signal outputs
        run: |
          set -euo pipefail

          node <<'NODE'
          "use strict";

          const fs = require("fs");

          function readJson(filePath) {
            if (!fs.existsSync(filePath)) {
              throw new Error(
                `Required output file was not created: ${filePath}`
              );
            }

            const raw =
              fs.readFileSync(
                filePath,
                "utf8"
              ).trim();

            if (!raw) {
              throw new Error(
                `Output file is empty: ${filePath}`
              );
            }

            try {
              return JSON.parse(raw);
            } catch (error) {
              throw new Error(
                `Output file contains invalid JSON: ${filePath}: ${error.message}`
              );
            }
          }

          const signalsPath =
            "data/signals.json";

          const logPath =
            "data/signal-log.json";

          const signals =
            readJson(signalsPath);

          const log =
            readJson(logPath);

          if (
            signals === null ||
            typeof signals !== "object" ||
            Array.isArray(signals)
          ) {
            throw new Error(
              `${signalsPath} must contain the signal-engine object contract.`
            );
          }

          if (
            !Number.isFinite(
              Date.parse(signals.updatedAt || "")
            ) ||
            signals.engineVersion !== "2.1.0" ||
            signals.strategyVersion !== "legacy-lockstep-2.1" ||
            signals.pairCount !== 2 ||
            signals.snapshotCount !== 4 ||
            !Array.isArray(signals.errors) ||
            !Number.isInteger(signals.errorCount) ||
            signals.errorCount !== signals.errors.length ||
            !Array.isArray(signals.signals) ||
            signals.signals.length !== 4
          ) {
            throw new Error(
              `${signalsPath} failed the current signal-engine output contract.`
            );
          }

          const expectedSnapshots =
            new Set([
              "XAU/USD|daily",
              "XAU/USD|weekly",
              "GBP/JPY|daily",
              "GBP/JPY|weekly"
            ]);

          const observedSnapshots =
            new Set();

          for (
            let index = 0;
            index < signals.signals.length;
            index++
          ) {
            const snapshot =
              signals.signals[index];

            if (
              snapshot === null ||
              typeof snapshot !== "object" ||
              Array.isArray(snapshot)
            ) {
              throw new Error(
                `${signalsPath}.signals[${index}] must be a JSON object.`
              );
            }

            const identity =
              `${snapshot.pair}|${snapshot.mode}`;

            if (
              !expectedSnapshots.has(identity) ||
              observedSnapshots.has(identity)
            ) {
              throw new Error(
                `${signalsPath} contains an invalid or duplicate pair/mode snapshot: ${identity}`
              );
            }

            if (
              snapshot.engineVersion !== "2.1.0" ||
              snapshot.strategyVersion !== "legacy-lockstep-2.1"
            ) {
              throw new Error(
                `${signalsPath}.signals[${index}] has incompatible engine metadata.`
              );
            }

            observedSnapshots.add(identity);
          }

          if (
            observedSnapshots.size !== expectedSnapshots.size ||
            [...expectedSnapshots].some(
              identity => !observedSnapshots.has(identity)
            )
          ) {
            throw new Error(
              `${signalsPath} does not contain the exact 2-pair × daily/weekly snapshot set.`
            );
          }

          if (!Array.isArray(log)) {
            throw new Error(
              `${logPath} must contain the signal-engine log array.`
            );
          }

          if (log.length > 5000) {
            throw new Error(
              `${logPath} exceeds the signal-engine maximum of 5000 entries.`
            );
          }

          for (
            let index = 0;
            index < log.length;
            index++
          ) {
            if (
              log[index] === null ||
              typeof log[index] !== "object" ||
              Array.isArray(log[index])
            ) {
              throw new Error(
                `${logPath}[${index}] must be a JSON object.`
              );
            }
          }

          console.log(
            `Validated ${signalsPath} with 4 exact snapshots and ${log.length} log entries.`
          );
          NODE

      - name: Commit and push updated signals
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          git config user.name "pipsight-robot"
          git config user.email "actions@users.noreply.github.com"

          # Strictly stage only files owned by the signal engine.
          git add -- \
            data/signals.json \
            data/signal-log.json

          if git diff --cached --quiet; then
            echo "No signal changes to commit."
            exit 0
          fi

          git commit -m "robot: manually refresh signals"

          push_succeeded=false

          for attempt in 1 2 3 4 5; do
            echo "Push attempt ${attempt} of 5..."

            if git push origin HEAD:main; then
              push_succeeded=true
              break
            fi

            if [[ "${attempt}" -eq 5 ]]; then
              break
            fi

            if [[ -n "$(git status --porcelain)" ]]; then
              echo "::error::The working tree is not clean after committing the validated signal snapshot."
              git status --short
              exit 1
            fi

            echo "Remote branch advanced. Verifying whether the new commits are safe to rebase across..."

            git fetch origin main

            merge_base="$(git merge-base HEAD origin/main)"

            if [[ -z "$merge_base" ]]; then
              echo "::error::Unable to determine a common base with the updated remote branch."
              exit 1
            fi

            mapfile -t remote_changed_files < <(
              git diff --name-only "$merge_base" origin/main |
                sed '/^$/d' |
                sort -u
            )

            unsafe_remote_changes=()

            for file in "${remote_changed_files[@]}"; do
              case "$file" in
                data/daily-ohlc.json|data/xau-usd-history.json|data/news-feed.json|data/signals.json|data/signal-log.json|fetch-signals.js|.github/workflows/fetch-signals.yml)
                  unsafe_remote_changes+=("$file")
                  ;;
              esac
            done

            if [[ "${#unsafe_remote_changes[@]}" -gt 0 ]]; then
              echo "::error::The branch changed in files that can affect the validated manual signal snapshot."
              printf '::error::Unsafe remote change: %s\n' "${unsafe_remote_changes[@]}"
              echo "::error::The stale generated snapshot was not merged, rebased, or force-pushed."
              echo "::error::Re-run against the newest branch head so signals are regenerated from current input/code."
              exit 1
            fi

            echo "Remote changes are unrelated to signal generation. Rebasing the validated commit."

            if ! git rebase origin/main; then
              echo "::error::Rebase failed while synchronizing signal files."
              git rebase --abort || true
              exit 1
            fi

            sleep $((attempt * 2))
          done

          if [[ "${push_succeeded}" != "true" ]]; then
            echo "::error::Unable to push signal files after 5 safe attempts."
            exit 1
          fi

          echo "Signal files committed and pushed successfully."

      - name: Log execution
        if: always()
        run: |
          echo "PipSight manual signal workflow finished."
          echo "Status: ${{ job.status }}"
          echo "Repository: ${{ github.repository }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Run ID: ${{ github.run_id }}"
          echo "Completed at: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
