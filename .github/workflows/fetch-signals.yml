name: PipSight Robot — fetch signals

on:
  schedule:
    - cron: "*/30 * * * *"

  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: pipsight-fetch-signals-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch:
    name: Fetch and publish signals
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run signal engine
        run: |
          set -euo pipefail

          node fetch-signals.js

      - name: Validate signal outputs
        run: |
          set -euo pipefail

          test -s data/signals.json
          test -s data/signal-log.json

          node -e "
            const fs = require('fs');

            const files = [
              'data/signals.json',
              'data/signal-log.json'
            ];

            for (const file of files) {
              JSON.parse(fs.readFileSync(file, 'utf8'));
              console.log('Validated:', file);
            }
          "

      - name: Commit and push updated signals
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          git config user.name "pipsight-robot"
          git config user.email "actions@users.noreply.github.com"

          # Strictly stage only the files owned by this workflow.
          git add -- \
            data/signals.json \
            data/signal-log.json

          if git diff --cached --quiet; then
            echo "No signal changes to commit."
            exit 0
          fi

          git commit -m "robot: refresh signals"

          max_attempts=5

          for attempt in $(seq 1 "$max_attempts"); do
            echo "Push attempt ${attempt}/${max_attempts}"

            if git push origin HEAD:main; then
              echo "Signal files pushed successfully."
              exit 0
            fi

            if [[ "$attempt" -eq "$max_attempts" ]]; then
              echo "Push failed after ${max_attempts} attempts."
              exit 1
            fi

            echo "Remote branch changed. Rebasing before retry..."

            git fetch origin main

            if ! git rebase origin/main; then
              echo "Rebase conflict detected."

              git rebase --abort || true
              exit 1
            fi

            sleep $((attempt * 5))
          done

      - name: Log execution
        if: always()
        run: |
          echo "PipSight fetch-signals workflow finished."
          echo "Status: ${{ job.status }}"
          echo "Repository: ${{ github.repository }}"
          echo "Run ID: ${{ github.run_id }}"
          echo "Completed at: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
