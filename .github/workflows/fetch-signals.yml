name: PipSight Pro — signals manual recovery

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: pipsight-news-signals-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch:
    name: Run and publish signals manually
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify required source files
        run: |
          set -euo pipefail

          test -f fetch-signals.js
          test -f data/news-feed.json
          test -f data/xau-usd-history.json

          echo "Required signal-engine source files are available."

      - name: Validate signal-engine syntax
        run: |
          set -euo pipefail

          node --check fetch-signals.js

          echo "Signal-engine JavaScript syntax is valid."

      - name: Validate news input
        run: |
          set -euo pipefail

          node <<'NODE'
          "use strict";

          const fs = require("fs");

          const filePath =
            "data/news-feed.json";

          if (!fs.existsSync(filePath)) {
            throw new Error(
              `Required source file does not exist: ${filePath}`
            );
          }

          const raw =
            fs.readFileSync(
              filePath,
              "utf8"
            ).trim();

          if (!raw) {
            throw new Error(
              `Source file is empty: ${filePath}`
            );
          }

          let parsed;

          try {
            parsed =
              JSON.parse(raw);
          } catch (error) {
            throw new Error(
              `${filePath} contains invalid JSON: ${error.message}`
            );
          }

          if (
            parsed === null ||
            typeof parsed !== "object"
          ) {
            throw new Error(
              `${filePath} must contain valid JSON data.`
            );
          }

          console.log(
            `Validated ${filePath}`
          );
          NODE

      - name: Run signal engine
        run: |
          set -euo pipefail

          node fetch-signals.js

      - name: Validate signal outputs
        run: |
          set -euo pipefail

          node <<'NODE'
          "use strict";

          const fs = require("fs");

          const outputFiles = [
            "data/signals.json",
            "data/signal-log.json"
          ];

          for (const filePath of outputFiles) {
            if (!fs.existsSync(filePath)) {
              throw new Error(
                `Required output file was not created: ${filePath}`
              );
            }

            const raw =
              fs.readFileSync(
                filePath,
                "utf8"
              ).trim();

            if (!raw) {
              throw new Error(
                `Output file is empty: ${filePath}`
              );
            }

            let parsed;

            try {
              parsed =
                JSON.parse(raw);
            } catch (error) {
              throw new Error(
                `Output file contains invalid JSON: ${filePath}: ${error.message}`
              );
            }

            if (
              parsed === null ||
              typeof parsed !== "object"
            ) {
              throw new Error(
                `${filePath} must contain valid JSON data.`
              );
            }

            console.log(
              `Validated ${filePath}`
            );
          }
          NODE

      - name: Commit and push updated signals
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          git config user.name "pipsight-robot"
          git config user.email "actions@users.noreply.github.com"

          # Strictly stage only files owned by the signal engine.
          git add -- \
            data/signals.json \
            data/signal-log.json

          if git diff --cached --quiet; then
            echo "No signal changes to commit."
            exit 0
          fi

          git commit -m "robot: manually refresh signals"

          push_succeeded=false

          for attempt in 1 2 3 4 5; do
            echo "Push attempt ${attempt} of 5..."

            if git push origin HEAD:main; then
              push_succeeded=true
              break
            fi

            if [[ "${attempt}" -eq 5 ]]; then
              break
            fi

            echo "Push was rejected. Fetching and rebasing onto origin/main..."

            git fetch origin main

            if ! git rebase origin/main; then
              echo "::error::Rebase failed while synchronizing signal files."
              git rebase --abort || true
              exit 1
            fi

            sleep $((attempt * 2))
          done

          if [[ "${push_succeeded}" != "true" ]]; then
            echo "::error::Unable to push signal files after 5 attempts."
            exit 1
          fi

          echo "Signal files committed and pushed successfully."

      - name: Log execution
        if: always()
        run: |
          echo "PipSight manual signal workflow finished."
          echo "Status: ${{ job.status }}"
          echo "Repository: ${{ github.repository }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Run ID: ${{ github.run_id }}"
          echo "Completed at: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
