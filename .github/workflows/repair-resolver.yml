          4viERDJMhYPpHOb8+BRxO0xznCoao7QNglEKcA4GvbRbBBB/vUjAMvsrw08ZczmhMGShNFXe5zFh
          ncNKlaOq5NWVVki+6mg2AFDu6lgm5O+MLj3zjenfIt7GwUU7CEBr3DuftAdBKd6iHLLwkgH0WpQr
          PQJstudPqOemtpWLaXUCFuhbQt2Ss2U/tT3sPIoc2EJcFfaZKTzaF+KIGvZOvg6WaOwwuOXdbEGy
          iyoC6ZkXFFOCMCJ3tHgDKkig+Llp5DY107wmwUSGUf+Cla3+jmFkTZJ1HcsS6cB+5bXbJg51NgZ+
          F5SrU+VyDkjj2VwqcWy1LBWBPrHqmualT5sfa5DFjZSKkbXURZ8AZSuU8fZWNkH+YuwfXCEKpVYh
          AAA=
          PATCH_B64

          base64 --decode \
            "${RUNNER_TEMP}/resolver-fix.patch.gz.b64" |
            gzip --decompress > \
            "${RUNNER_TEMP}/resolver-fix.patch"

          patch -p2 < \
            "${RUNNER_TEMP}/resolver-fix.patch"

          node --check "$resolver"

          node -e "const resolver = require('./resolve-analysis-history.js'); if (!resolver.RESOLUTION_POLICY || typeof resolver.runTradeResolution !== 'function') throw new Error('Resolver exports are incomplete'); console.log('Resolver module load passed.');"

          test_dir="${RUNNER_TEMP}/resolver-runtime-test"
          mkdir -p "$test_dir"
          cp "$resolver" "$test_dir/resolve-analysis-history.js"
          cp -R data "$test_dir/data"

          node "$test_dir/resolve-analysis-history.js"

          echo "Resolver runtime validation passed in an isolated copy."

      - name: Commit repaired resolver
        run: |
          set -euo pipefail

          git config user.name "pipsight-repair-robot"
          git config user.email "actions@users.noreply.github.com"

          rm -f .github/workflows/repair-resolver.yml

          git add -- \
            resolve-analysis-history.js \
            .github/workflows/repair-resolver.yml

          if git diff --cached --quiet; then
            echo "No repair changes to commit."
            exit 0
          fi

          git commit -m "fix: restore complete analysis history resolver"

          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi

            if [[ "$attempt" -eq 5 ]]; then
              echo "::error::Unable to push repaired resolver after 5 attempts."
              exit 1
            fi

            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}"
            sleep $((attempt * 2))
          done
