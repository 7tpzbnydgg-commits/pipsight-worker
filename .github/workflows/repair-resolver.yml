name: Repair analysis history resolver

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: pipsight-unified-analysis-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Restore and patch resolver
        run: |
          set -euo pipefail

          resolver="resolve-analysis-history.js"
          historical_commit=""

          while IFS= read -r commit; do
            candidate="${RUNNER_TEMP}/resolver-${commit}.js"

            if ! git show "${commit}:${resolver}" > "$candidate" 2>/dev/null; then
              continue
            fi

            line_count="$(wc -l < "$candidate" | tr -d ' ')"

            if [[ "$line_count" -lt 8000 ]]; then
              continue
            fi

            if ! grep -q '^const RESOLUTION_POLICY =' "$candidate"; then
              continue
            fi

            if ! grep -q '^function collectLegacyOpenTradeDescriptors' "$candidate"; then
              continue
            fi

            historical_commit="$commit"
            cp "$candidate" "$resolver"
            break
          done < <(git rev-list HEAD -- "$resolver")

          if [[ -z "$historical_commit" ]]; then
            echo "::error::Unable to locate a complete historical resolver version."
            exit 1
          fi

          echo "Restored complete resolver from commit: $historical_commit"

          cat > "${RUNNER_TEMP}/resolver-fix.patch.gz.b64" <<'PATCH_B64'
          H4sICKOZa2oAA3Jlc29sdmVyLWZpeC1naXQucGF0Y2gAxRnJcts29K6vgHXI2NZiUZvleDxJJk6a
