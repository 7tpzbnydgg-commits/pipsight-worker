name: PipSight Pro — Resolve Trades and Learn

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: pipsight-analysis-writes-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  resolve-and-learn:
    name: Resolve trades, learn and refresh AI memory
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Sync to latest branch head
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_TYPE}" != "branch" ]]; then
            echo "::error::Adaptive pipeline can only synchronize from a branch workflow run."
            exit 1
          fi

          git fetch origin "${GITHUB_REF_NAME}"
          git reset --hard "origin/${GITHUB_REF_NAME}"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate required pipeline files
        run: |
          set -euo pipefail

          required_files=(
            "resolve-analysis-history.js"
            "run-learning-engine.js"
            "learner.js"
            "ai-memory.js"
            "data/analysis-history.json"
          )

          for file in "${required_files[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "::error file=$file::Required file is missing: $file"
              exit 1
            fi
          done

          echo "Required resolver, learning and AI-memory files are available."

      - name: Validate JavaScript syntax
        run: |
          set -euo pipefail

          scripts=(
            "resolve-analysis-history.js"
            "run-learning-engine.js"
            "learner.js"
            "ai-memory.js"
          )

          for script in "${scripts[@]}"; do
            node --check "$script"
          done

          echo "Resolver, Learning and AI Memory JavaScript syntax is valid."

      - name: Resolve open trades
        id: resolve
        run: |
          set -euo pipefail

          history_file="data/analysis-history.json"
          before_file="${RUNNER_TEMP}/analysis-history-before-resolver.json"

          cp "$history_file" "$before_file"

          node resolve-analysis-history.js

          if cmp -s "$before_file" "$history_file"; then
            echo "history_changed=false" >> "$GITHUB_OUTPUT"
            echo "Resolver did not change analysis history."
          else
            echo "history_changed=true" >> "$GITHUB_OUTPUT"
            echo "Resolver changed analysis history."
          fi

      - name: Validate resolved analysis history
        run: |
          set -euo pipefail

          node <<'NODE'
          "use strict";

          const fs = require("fs");

          const filePath =
            "data/analysis-history.json";

          if (!fs.existsSync(filePath)) {
            throw new Error(
              `Required history file does not exist: ${filePath}`
            );
          }

          const raw =
            fs.readFileSync(
              filePath,
              "utf8"
            ).trim();

          if (!raw) {
            throw new Error(
              `${filePath} is empty.`
            );
          }

          let history;

          try {
            history =
              JSON.parse(raw);
          } catch (error) {
            throw new Error(
              `${filePath} contains invalid JSON: ${error.message}`
            );
          }

          if (
            history === null ||
            typeof history !== "object" ||
            Array.isArray(history)
          ) {
            throw new Error(
              `${filePath} must contain a JSON object.`
            );
          }

          const arrayFields = [
            "records",
            "history",
            "items",
            "closed"
          ];

          for (const field of arrayFields) {
            if (!Array.isArray(history[field])) {
              throw new Error(
                `${filePath} field ${field} must be an array.`
              );
            }
          }

          if (
            history.records.length !==
              history.history.length ||
            history.records.length !==
              history.items.length
          ) {
            throw new Error(
              "History records, history and items aliases are not synchronized."
            );
          }

          if (
            history.open !== undefined &&
            (
              history.open === null ||
              typeof history.open !== "object" ||
              Array.isArray(history.open)
            )
          ) {
            throw new Error(
              "analysis-history.json open field must be an object."
            );
          }

          console.log(
            `Validated analysis history with ` +
            `${history.records.length} rich records and ` +
            `${history.closed.length} closed records.`
          );
          NODE

      - name: Run learning engine
        run: |
          set -euo pipefail

          node run-learning-engine.js

      - name: Validate learning outputs
        run: |
          set -euo pipefail

          node <<'NODE'
          "use strict";

          const fs = require("fs");

          const outputFiles = [
            "data/learning-data.json",
            "data/confidence-data.json",
            "data/learning-engine-state.json"
          ];

          for (const filePath of outputFiles) {
            if (!fs.existsSync(filePath)) {
              throw new Error(
                `Required learning output was not created: ${filePath}`
              );
            }

            const raw =
              fs.readFileSync(
                filePath,
                "utf8"
              ).trim();

            if (!raw) {
              throw new Error(
                `Learning output is empty: ${filePath}`
              );
            }

            let data;

            try {
              data =
                JSON.parse(raw);
            } catch (error) {
              throw new Error(
                `${filePath} contains invalid JSON: ${error.message}`
              );
            }

            if (
              data === null ||
              typeof data !== "object" ||
              Array.isArray(data)
            ) {
              throw new Error(
                `${filePath} must contain a JSON object.`
              );
            }

            console.log(
              `Validated ${filePath}`
            );
          }
          NODE

      - name: Validate AI Memory outputs
        run: |
          set -euo pipefail

          node <<'NODE'
          "use strict";

          const fs = require("fs");

          const outputFiles = [
            "data/ai-memory.json",
            "data/ai-memory-state.json"
          ];

          for (const filePath of outputFiles) {
            if (!fs.existsSync(filePath)) {
              throw new Error(
                `Required AI Memory output was not created: ${filePath}`
              );
            }

            const raw =
              fs.readFileSync(
                filePath,
                "utf8"
              ).trim();

            if (!raw) {
              throw new Error(
                `AI Memory output is empty: ${filePath}`
              );
            }

            let data;

            try {
              data =
                JSON.parse(raw);
            } catch (error) {
              throw new Error(
                `${filePath} contains invalid JSON: ${error.message}`
              );
            }

            if (
              data === null ||
              typeof data !== "object" ||
              Array.isArray(data)
            ) {
              throw new Error(
                `${filePath} must contain a JSON object.`
              );
            }

            console.log(
              `Validated ${filePath}`
            );
          }
          NODE

      - name: Show generated changes
        run: |
          set -euo pipefail

          echo "Changed files after resolution, learning and AI Memory:"
          git status --short

          echo "Resolver history changed: ${{ steps.resolve.outputs.history_changed }}"

      - name: Commit and push adaptive pipeline outputs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          git config user.name "pipsight-adaptive-robot"
          git config user.email "actions@users.noreply.github.com"

          files_to_commit=(
            "data/analysis-history.json"
            "data/learning-data.json"
            "data/confidence-data.json"
            "data/learning-engine-state.json"
            "data/learning-enrichment.json"
            "data/learning-enrichment-state.json"
            "data/ai-memory.json"
            "data/ai-memory-state.json"
            "data/ai-policy.json"
            "data/ai-policy-state.json"
          )

          existing_files=()

          for file in "${files_to_commit[@]}"; do
            if [[ -f "$file" ]]; then
              existing_files+=("$file")
            fi
          done

          if [[ "${#existing_files[@]}" -eq 0 ]]; then
            echo "No expected adaptive pipeline files are available."
            exit 0
          fi

          git add -- "${existing_files[@]}"

          if git diff --cached --quiet; then
            echo "No resolution, learning or AI Memory changes to commit."
            exit 0
          fi

          git commit -m "robot: resolve trades and refresh adaptive state"

          # A remote commit can arrive after this validated adaptive snapshot was
          # generated. Rebase only across changes proven unrelated to the
          # resolver/learning/memory/policy calculation. Any relevant source,
          # state, engine or workflow change fails closed so stale learning is
          # never promoted.
          push_succeeded=false

          for attempt in 1 2 3; do
            echo "Push attempt ${attempt} of 3..."

            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              push_succeeded=true
              break
            fi

            if [[ "$attempt" -eq 3 ]]; then
              break
            fi

            if [[ -n "$(git status --porcelain)" ]]; then
              echo "::error::The working tree is not clean after committing the validated adaptive snapshot."
              git status --short
              exit 1
            fi

            echo "Remote branch advanced. Verifying whether the new commits are safe to rebase across..."
            git fetch origin "${GITHUB_REF_NAME}"

            merge_base="$(git merge-base HEAD "origin/${GITHUB_REF_NAME}")"

            if [[ -z "$merge_base" ]]; then
              echo "::error::Unable to determine a common base with the updated remote branch."
              exit 1
            fi

            mapfile -t remote_changed_files < <(
              git diff --name-only "$merge_base" "origin/${GITHUB_REF_NAME}" |
                sed '/^$/d' |
                sort -u
            )

            unsafe_remote_changes=()

            for file in "${remote_changed_files[@]}"; do
              case "$file" in
                data/analysis-history.json|data/scalp-candles.json|data/intraday-h1.json|data/daily-ohlc.json|data/learning-data.json|data/confidence-data.json|data/learning-engine-state.json|data/learning-enrichment.json|data/learning-enrichment-state.json|data/ai-memory.json|data/ai-memory-state.json|data/ai-policy.json|data/ai-policy-state.json|data/autonomous-config.json)
                  unsafe_remote_changes+=("$file")
                  ;;
                resolve-analysis-history.js|run-learning-engine.js|learner.js|learning-enrichment.js|ai-memory.js|ai-policy-engine.js|.github/workflows/resolve-trades-and-learn.yml)
                  unsafe_remote_changes+=("$file")
                  ;;
              esac
            done

            if [[ "${#unsafe_remote_changes[@]}" -gt 0 ]]; then
              echo "::error::The branch changed in files that can affect the validated adaptive snapshot."
              printf '::error::Unsafe remote change: %s\n' "${unsafe_remote_changes[@]}"
              echo "::error::The stale adaptive snapshot was not merged, rebased, or force-pushed."
              echo "::error::Re-run against the newest branch head so resolver/learning/memory/policy are regenerated from current inputs."
              exit 1
            fi

            echo "Remote changes are unrelated to adaptive inputs/state. Rebasing the already validated commit."
            git rebase "origin/${GITHUB_REF_NAME}"

            sleep $((attempt * 2))
          done

          if [[ "$push_succeeded" != "true" ]]; then
            echo "::error::Unable to publish the validated adaptive snapshot after 3 safe push attempts."
            exit 1
          fi

          echo "Adaptive pipeline state committed successfully."

      - name: Log execution
        if: always()
        run: |
          echo "PipSight resolver, Learning and AI Memory workflow finished."
          echo "Status: ${{ job.status }}"
          echo "Repository: ${{ github.repository }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Run ID: ${{ github.run_id }}"
          echo "Completed at: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
