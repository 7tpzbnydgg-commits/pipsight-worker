name: PipSight Pro — hourly resolver, learning and AI memory

on:
  schedule:
    - cron: "8 * * * *"

  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: pipsight-analysis-writes-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  sync-learning:
    name: Resolve trades and refresh adaptive state
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Sync to latest branch head
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_TYPE}" != "branch" ]]; then
            echo "::error::Adaptive state can only synchronize from a branch workflow run."
            exit 1
          fi

          git fetch origin "${GITHUB_REF_NAME}"
          git reset --hard "origin/${GITHUB_REF_NAME}"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify required pipeline files
        run: |
          set -euo pipefail

          required_files=(
            "resolve-analysis-history.js"
            "run-learning-engine.js"
            "learner.js"
            "learning-enrichment.js"
            "ai-memory.js"
            "data/analysis-history.json"
          )

          for file in "${required_files[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "::error file=$file::Required file is missing: $file"
              exit 1
            fi
          done

          echo "Required resolver, Learning and AI Memory files are available."

      - name: Validate JavaScript syntax
        run: |
          set -euo pipefail

          scripts=(
            "resolve-analysis-history.js"
            "run-learning-engine.js"
            "learner.js"
            "learning-enrichment.js"
            "ai-memory.js"
          )

          for script in "${scripts[@]}"; do
            node --check "$script"
          done

          echo "Resolver, Learning and AI Memory JavaScript syntax is valid."

      - name: Verify fixed adaptive engine compatibility
        run: |
          set -euo pipefail

          node <<'NODE'
          "use strict";

          const {
            PipSightLearner,
            LearningConfig
          } = require("./learner.js");

          const resolver =
            require("./resolve-analysis-history.js");

          const aiMemory =
            require("./ai-memory.js");

          if (LearningConfig.VERSION !== "2.1.0") {
            throw new Error(
              `learner.js version ${LearningConfig.VERSION} is unsupported; expected 2.1.0.`
            );
          }

          if (resolver.ENGINE_VERSION !== "1.0.2") {
            throw new Error(
              `resolve-analysis-history.js version ${resolver.ENGINE_VERSION} is unsupported; expected 1.0.2.`
            );
          }

          if (aiMemory.ENGINE_VERSION !== "1.0.1") {
            throw new Error(
              `ai-memory.js version ${aiMemory.ENGINE_VERSION} is unsupported; expected 1.0.1.`
            );
          }

          const learner =
            new PipSightLearner();

          learner.data.signals = [
            {
              id: "compatibility-signal",
              pair: "GBPJPY",
              strategy: "scalp",
              timeframe: "5m",
              direction: "BUY",
              entry: 200,
              outcome: null
            }
          ];

          const unsafeFallback =
            learner.findPendingLegacySignal({
              pair: "GBPJPY",
              strategy: "scalp",
              timeframe: "15m",
              direction: "BUY",
              entry: 200
            });

          if (unsafeFallback !== null) {
            throw new Error(
              "learner.js still permits approximate pending-trade matching."
            );
          }

          const identityBase = {
            id: "compatibility-signal",
            pair: "GBPJPY",
            engine: "scalp",
            direction: "BUY",
            timeframe: "5m",
            entry: 200,
            openedAt: "2026-01-01T00:00:00.000Z"
          };

          const originalKey =
            aiMemory.createTradeKey(identityBase);

          const correctedKey =
            aiMemory.createTradeKey({
              ...identityBase,
              outcome: "WIN",
              closePrice: 201,
              closedAt: "2026-01-01T01:00:00.000Z"
            });

          if (originalKey !== correctedKey) {
            throw new Error(
              "ai-memory.js identity changes when mutable resolution fields change."
            );
          }

          console.log(
            "Fixed learner, resolver and AI Memory compatibility checks passed."
          );
          NODE

      - name: Validate source analysis history
        run: |
          set -euo pipefail

          node <<'NODE'
          "use strict";

          const fs = require("fs");

          const filePath =
            "data/analysis-history.json";

          if (!fs.existsSync(filePath)) {
            throw new Error(
              `Required source file does not exist: ${filePath}`
            );
          }

          const raw =
            fs.readFileSync(
              filePath,
              "utf8"
            ).trim();

          if (!raw) {
            throw new Error(
              `${filePath} is empty.`
            );
          }

          let history;

          try {
            history =
              JSON.parse(raw);
          } catch (error) {
            throw new Error(
              `${filePath} contains invalid JSON: ${error.message}`
            );
          }

          if (
            history === null ||
            typeof history !== "object" ||
            Array.isArray(history)
          ) {
            throw new Error(
              `${filePath} must contain a JSON object.`
            );
          }

          if (
            history.closed !== undefined &&
            !Array.isArray(history.closed)
          ) {
            throw new Error(
              "analysis-history.json closed field must be an array."
            );
          }

          if (
            history.records !== undefined &&
            !Array.isArray(history.records)
          ) {
            throw new Error(
              "analysis-history.json records field must be an array."
            );
          }

          if (
            history.open !== undefined &&
            (
              history.open === null ||
              typeof history.open !== "object" ||
              Array.isArray(history.open)
            )
          ) {
            throw new Error(
              "analysis-history.json open field must be an object."
            );
          }

          const closedCount =
            Array.isArray(history.closed)
              ? history.closed.length
              : 0;

          const richCount =
            Array.isArray(history.records)
              ? history.records.length
              : 0;

          console.log(
            `Validated source history with ` +
            `${richCount} rich records and ` +
            `${closedCount} closed records.`
          );
          NODE

      - name: Resolve open trades
        id: resolve
        run: |
          set -euo pipefail

          history_file="data/analysis-history.json"
          before_file="${RUNNER_TEMP}/analysis-history-before-resolver.json"

          cp "$history_file" "$before_file"

          node resolve-analysis-history.js

          if cmp -s "$before_file" "$history_file"; then
            echo "history_changed=false" >> "$GITHUB_OUTPUT"
            echo "Resolver did not change analysis history."
          else
            echo "history_changed=true" >> "$GITHUB_OUTPUT"
            echo "Resolver changed analysis history."
          fi

      - name: Validate resolved analysis history
        run: |
          set -euo pipefail

          node <<'NODE'
          "use strict";

          const fs = require("fs");

          const filePath =
            "data/analysis-history.json";

          const raw =
            fs.readFileSync(
              filePath,
              "utf8"
            ).trim();

          if (!raw) {
            throw new Error(
              `${filePath} is empty after resolution.`
            );
          }

          let history;

          try {
            history =
              JSON.parse(raw);
          } catch (error) {
            throw new Error(
              `${filePath} contains invalid JSON after resolution: ${error.message}`
            );
          }

          if (
            history === null ||
            typeof history !== "object" ||
            Array.isArray(history)
          ) {
            throw new Error(
              `${filePath} must contain a JSON object.`
            );
          }

          const arrayFields = [
            "records",
            "history",
            "items",
            "closed"
          ];

          for (const field of arrayFields) {
            if (!Array.isArray(history[field])) {
              throw new Error(
                `${filePath} field ${field} must be an array after resolution.`
              );
            }
          }

          if (
            JSON.stringify(history.records) !==
              JSON.stringify(history.history) ||
            JSON.stringify(history.records) !==
              JSON.stringify(history.items)
          ) {
            throw new Error(
              "Resolved history aliases are not synchronized."
            );
          }

          if (
            history.stats !== undefined &&
            (
              history.stats === null ||
              typeof history.stats !== "object" ||
              Array.isArray(history.stats)
            )
          ) {
            throw new Error(
              "analysis-history.json stats field must be an object."
            );
          }

          if (
            history.statistics !== undefined &&
            (
              history.statistics === null ||
              typeof history.statistics !== "object" ||
              Array.isArray(history.statistics)
            )
          ) {
            throw new Error(
              "analysis-history.json statistics field must be an object."
            );
          }

          console.log(
            `Validated resolved history with ` +
            `${history.records.length} rich records and ` +
            `${history.closed.length} closed records.`
          );
          NODE

      - name: Run learning engine
        run: |
          set -euo pipefail

          node run-learning-engine.js

      - name: Verify generated learning files
        run: |
          set -euo pipefail

          node <<'NODE'
          "use strict";

          const fs = require("fs");

          const outputFiles = [
            "data/learning-data.json",
            "data/confidence-data.json",
            "data/learning-engine-state.json"
          ];

          for (const filePath of outputFiles) {
            if (!fs.existsSync(filePath)) {
              throw new Error(
                `Required output file was not created: ${filePath}`
              );
            }

            const raw =
              fs.readFileSync(
                filePath,
                "utf8"
              ).trim();

            if (!raw) {
              throw new Error(
                `Output file is empty: ${filePath}`
              );
            }

            let data;

            try {
              data =
                JSON.parse(raw);
            } catch (error) {
              throw new Error(
                `${filePath} contains invalid JSON: ${error.message}`
              );
            }

            if (
              data === null ||
              typeof data !== "object" ||
              Array.isArray(data)
            ) {
              throw new Error(
                `${filePath} must contain a valid JSON object.`
              );
            }

            console.log(
              `Validated ${filePath}`
            );
          }
          NODE

      - name: Run Learning Enrichment safely
        run: |
          set -euo pipefail

          learning_before="${RUNNER_TEMP}/learning-data-before-enrichment.json"
          confidence_before="${RUNNER_TEMP}/confidence-data-before-enrichment.json"

          cp \
            "data/learning-data.json" \
            "$learning_before"

          cp \
            "data/confidence-data.json" \
            "$confidence_before"

          node learning-enrichment.js

          if ! cmp -s \
            "$learning_before" \
            "data/learning-data.json"; then
            echo "::error file=data/learning-data.json::Learning Enrichment modified the protected learning-data.json source."
            exit 1
          fi

          if ! cmp -s \
            "$confidence_before" \
            "data/confidence-data.json"; then
            echo "::error file=data/confidence-data.json::Learning Enrichment modified the protected confidence-data.json source."
            exit 1
          fi

          echo "Learning Enrichment completed without modifying its source files."

      - name: Verify generated Learning Enrichment files
        run: |
          set -euo pipefail

          node <<'NODE'
          "use strict";

          const fs =
            require("fs");

          const outputPath =
            "data/learning-enrichment.json";

          const statePath =
            "data/learning-enrichment-state.json";

          for (
            const filePath of [
              outputPath,
              statePath
            ]
          ) {

            if (
              !fs.existsSync(
                filePath
              )
            ) {

              throw new Error(
                `Required Learning Enrichment output was not created: ${filePath}`
              );

            }

            const raw =
              fs.readFileSync(
                filePath,
                "utf8"
              ).trim();

            if (
              !raw
            ) {

              throw new Error(
                `Learning Enrichment output is empty: ${filePath}`
              );

            }

            let parsed;

            try {

              parsed =
                JSON.parse(
                  raw
                );

            } catch (
              error
            ) {

              throw new Error(
                `${filePath} contains invalid JSON: ${error.message}`
              );

            }

            if (
              parsed === null ||
              typeof parsed !==
                "object" ||
              Array.isArray(
                parsed
              )
            ) {

              throw new Error(
                `${filePath} must contain a JSON object.`
              );

            }

            console.log(
              `Validated ${filePath}`
            );

          }

          const enrichment =
            JSON.parse(
              fs.readFileSync(
                outputPath,
                "utf8"
              )
            );

          const state =
            JSON.parse(
              fs.readFileSync(
                statePath,
                "utf8"
              )
            );

          if (
            enrichment.version !==
              1
          ) {

            throw new Error(
              "Learning Enrichment schema version must remain 1."
            );

          }

          if (
            enrichment.engineName !==
              "PipSight Pro Learning Enrichment Engine"
          ) {

            throw new Error(
              "Learning Enrichment engine name is invalid."
            );

          }

          if (
            enrichment.engineVersion !==
              "1.0.0"
          ) {

            throw new Error(
              "Learning Enrichment engine version is invalid."
            );

          }

          if (
            enrichment.mode !==
              "advisory"
          ) {

            throw new Error(
              "Learning Enrichment must remain in advisory mode."
            );

          }

          if (
            enrichment.validation?.valid !==
              true
          ) {

            throw new Error(
              (
                enrichment.validation
                  ?.errors ||
                [
                  "Learning Enrichment internal validation failed."
                ]
              ).join(
                " "
              )
            );

          }

          if (
            enrichment.safety?.advisoryOnly !==
              true
          ) {

            throw new Error(
              "Learning Enrichment advisory-only lock is invalid."
            );

          }

          const requiredFalseSafetyFlags =
            [
              "liveSignalModification",
              "confidenceModification",
              "decisionModification",
              "tradePlanModification",
              "telegramModification",
              "sourceCodeModification",
              "externalApiCalls",
              "existingSchemaModification",
              "existingLearningOutputModification",
              "existingMemoryOutputModification"
            ];

          for (
            const flag of
            requiredFalseSafetyFlags
          ) {

            if (
              enrichment.safety?.[
                flag
              ] !==
                false
            ) {

              throw new Error(
                `Learning Enrichment safety.${flag} must remain false.`
              );

            }

          }

          if (
            enrichment.metadata
              ?.productionConsumerEnabled !==
              false
          ) {

            throw new Error(
              "Learning Enrichment must not have a production consumer enabled."
            );

          }

          if (
            enrichment.metadata
              ?.externalApiCalls !==
              false
          ) {

            throw new Error(
              "Learning Enrichment must not make external API calls."
            );

          }

          const summary =
            enrichment.summary;

          if (
            summary === null ||
            typeof summary !==
              "object" ||
            Array.isArray(
              summary
            )
          ) {

            throw new Error(
              "Learning Enrichment summary is missing."
            );

          }

          const sourceTrades =
            Number(
              summary.sourceTrades
            );

          const acceptedTrades =
            Number(
              summary.acceptedTrades
            );

          const rejectedTrades =
            Number(
              summary.rejectedTrades
            );

          const duplicateTrades =
            Number(
              summary.duplicateTrades
            );

          for (
            const [
              name,
              value
            ] of [
              [
                "sourceTrades",
                sourceTrades
              ],
              [
                "acceptedTrades",
                acceptedTrades
              ],
              [
                "rejectedTrades",
                rejectedTrades
              ],
              [
                "duplicateTrades",
                duplicateTrades
              ]
            ]
          ) {

            if (
              !Number.isInteger(
                value
              ) ||
              value <
                0
            ) {

              throw new Error(
                `Learning Enrichment summary.${name} is invalid.`
              );

            }

          }

          if (
            acceptedTrades +
              rejectedTrades +
              duplicateTrades !==
            sourceTrades
          ) {

            throw new Error(
              "Learning Enrichment source counts are inconsistent."
            );

          }

          const acceptedStatuses =
            new Set([
              "UPDATED",
              "UNCHANGED"
            ]);

          if (
            !acceptedStatuses.has(
              state.lastRun?.status
            )
          ) {

            throw new Error(
              "Learning Enrichment state does not contain a successful last run."
            );

          }

          if (
            state.lastRun?.stateWritten !==
              true
          ) {

            throw new Error(
              "Learning Enrichment state was not persisted successfully."
            );

          }

          if (
            state.lastRun?.error !==
              null
          ) {

            throw new Error(
              "Learning Enrichment state contains a last-run error."
            );

          }

          console.log(
            "Learning Enrichment safety validation passed."
          );

          console.log(
            `Source trades: ${sourceTrades}`
          );

          console.log(
            `Accepted trades: ${acceptedTrades}`
          );

          console.log(
            `Rejected trades: ${rejectedTrades}`
          );

          console.log(
            `Duplicate trades: ${duplicateTrades}`
          );

          NODE

      - name: Run AI Memory
        run: |
          set -euo pipefail

          node ai-memory.js

      - name: Verify generated AI Memory files
        run: |
          set -euo pipefail

          node <<'NODE'
          "use strict";

          const fs = require("fs");

          function readObject(filePath) {
            if (!fs.existsSync(filePath)) {
              throw new Error(
                `Required output file was not created: ${filePath}`
              );
            }

            const raw =
              fs.readFileSync(filePath, "utf8").trim();

            if (!raw) {
              throw new Error(
                `Output file is empty: ${filePath}`
              );
            }

            const parsed = JSON.parse(raw);

            if (
              parsed === null ||
              typeof parsed !== "object" ||
              Array.isArray(parsed)
            ) {
              throw new Error(
                `${filePath} must contain a JSON object.`
              );
            }

            return parsed;
          }

          const memory =
            readObject("data/ai-memory.json");

          const state =
            readObject("data/ai-memory-state.json");

          if (
            memory.version !== 1 ||
            memory.engineName !==
              "PipSight Pro Adaptive AI Memory Engine" ||
            memory.engineVersion !== "1.0.1" ||
            memory.validation?.valid !== true ||
            memory.metadata?.deterministic !== true ||
            memory.metadata?.duplicateSafe !== true
          ) {
            throw new Error(
              "data/ai-memory.json failed its production compatibility contract."
            );
          }

          if (
            state.version !== 1 ||
            state.engineName !==
              "PipSight Pro Adaptive AI Memory Engine" ||
            state.engineVersion !== "1.0.1" ||
            state.pendingTransaction !== null ||
            !["UPDATED", "UNCHANGED"].includes(
              state.lastRun?.status
            ) ||
            state.lastRun?.stateWritten !== true ||
            state.lastRun?.error !== null
          ) {
            throw new Error(
              "data/ai-memory-state.json does not contain a fully committed successful run."
            );
          }

          console.log(
            "AI Memory schema, version and transaction-state validation passed."
          );
          NODE

      - name: Show adaptive pipeline outputs
        run: |
          set -euo pipefail

          echo "Generated resolver, Learning and AI Memory files:"

          ls -lh \
            data/analysis-history.json \
            data/learning-data.json \
            data/confidence-data.json \
            data/learning-engine-state.json \
            data/learning-enrichment.json \
            data/learning-enrichment-state.json \
            data/ai-memory.json \
            data/ai-memory-state.json

          echo ""
          echo "Changed files:"
          git status --short

          echo ""
          echo "Resolver history changed: ${{ steps.resolve.outputs.history_changed }}"

      - name: Commit and push hourly adaptive state
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_TYPE}" != "branch" ]]; then
            echo "::error::Adaptive state can only be committed from a branch workflow run."
            exit 1
          fi

          git config user.name "pipsight-adaptive-robot"
          git config user.email "actions@users.noreply.github.com"

          files_to_commit=(
            "data/analysis-history.json"
            "data/learning-data.json"
            "data/confidence-data.json"
            "data/learning-engine-state.json"
            "data/learning-enrichment.json"
            "data/learning-enrichment-state.json"
            "data/ai-memory.json"
            "data/ai-memory-state.json"
            "data/ai-policy.json"
            "data/ai-policy-state.json"
          )

          existing_files=()

          for file in "${files_to_commit[@]}"; do
            if [[ -f "$file" ]]; then
              existing_files+=("$file")
            fi
          done

          if [[ "${#existing_files[@]}" -eq 0 ]]; then
            echo "No adaptive pipeline files are available to commit."
            exit 0
          fi

          git add -- "${existing_files[@]}"

          if git diff --cached --quiet; then
            echo "No resolver, Learning or AI Memory changes to commit."
            exit 0
          fi

          git commit -m "robot: refresh hourly adaptive state"

          # The shared concurrency queue can delay this run, and the branch can
          # still advance later because of unrelated writers/manual commits.
          # Rebase only across changes proven unrelated to this adaptive
          # calculation. Any change to an actual adaptive input/state/module
          # fails closed so stale learning is never promoted.
          push_succeeded=false

          for attempt in 1 2 3 4 5; do
            echo "Push attempt ${attempt} of 5..."

            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              push_succeeded=true
              break
            fi

            if [[ "$attempt" -eq 5 ]]; then
              break
            fi

            if [[ -n "$(git status --porcelain)" ]]; then
              echo "::error::The working tree is not clean after committing the validated adaptive snapshot."
              git status --short
              exit 1
            fi

            echo "Remote branch advanced. Verifying whether the new commits are safe to rebase across..."
            git fetch origin "${GITHUB_REF_NAME}"

            merge_base="$(git merge-base HEAD "origin/${GITHUB_REF_NAME}")"

            if [[ -z "$merge_base" ]]; then
              echo "::error::Unable to determine a common base with the updated remote branch."
              exit 1
            fi

            mapfile -t remote_changed_files < <(
              git diff --name-only "$merge_base" "origin/${GITHUB_REF_NAME}" |
                sed '/^$/d' |
                sort -u
            )

            unsafe_remote_changes=()

            for file in "${remote_changed_files[@]}"; do
              case "$file" in
                data/analysis-history.json|data/scalp-candles.json|data/intraday-h1.json|data/daily-ohlc.json|data/learning-data.json|data/confidence-data.json|data/learning-engine-state.json|data/learning-enrichment.json|data/learning-enrichment-state.json|data/ai-memory.json|data/ai-memory-state.json|data/ai-policy.json|data/ai-policy-state.json|data/autonomous-config.json)
                  unsafe_remote_changes+=("$file")
                  ;;
                resolve-analysis-history.js|run-learning-engine.js|learner.js|learning-enrichment.js|ai-memory.js|ai-policy-engine.js|.github/workflows/run-learning-engine.yml)
                  unsafe_remote_changes+=("$file")
                  ;;
              esac
            done

            if [[ "${#unsafe_remote_changes[@]}" -gt 0 ]]; then
              echo "::error::The branch changed in files that can affect the validated adaptive snapshot."
              printf '::error::Unsafe remote change: %s\n' "${unsafe_remote_changes[@]}"
              echo "::error::The stale adaptive snapshot was not merged, rebased, or force-pushed."
              echo "::error::Re-run against the newest branch head so resolver/learning/memory/policy are regenerated from current inputs."
              exit 1
            fi

            echo "Remote changes are unrelated to adaptive inputs/state. Rebasing the already validated commit."
            git rebase "origin/${GITHUB_REF_NAME}"

            sleep $((attempt * 2))
          done

          if [[ "$push_succeeded" != "true" ]]; then
            echo "::error::Unable to publish the validated hourly adaptive snapshot after 5 safe push attempts."
            exit 1
          fi

          echo "Hourly adaptive state committed successfully."

      - name: Log execution
        if: always()
        run: |
          echo "PipSight hourly resolver, Learning and AI Memory workflow finished."
          echo "Status: ${{ job.status }}"
          echo "Repository: ${{ github.repository }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Run ID: ${{ github.run_id }}"
          echo "Completed at: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
