name: PipSight Robot — live analysis (background)

on:
  schedule:
    - cron: "*/15 * * * *"

  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: pipsight-live-analysis-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analyze:
    name: Run and publish live analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run live analysis
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail

          node run-live-analysis.js

      - name: Validate analysis outputs
        run: |
          set -euo pipefail

          files=(
            "data/live-analysis.json"
            "data/analysis-history.json"
            "data/notify-state.json"
          )

          for file in "${files[@]}"; do
            test -s "$file"

            node -e "
              const fs = require('fs');
              const file = process.argv[1];
              const parsed = JSON.parse(
                fs.readFileSync(file, 'utf8')
              );

              if (
                parsed === null ||
                typeof parsed !== 'object'
              ) {
                throw new Error(
                  file + ' must contain a JSON object or array'
                );
              }

              console.log('Validated:', file);
            " "$file"
          done

      - name: Commit and push updated analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          git config user.name "pipsight-robot"
          git config user.email "actions@users.noreply.github.com"

          # Strictly stage only files owned by this workflow.
          git add -- \
            data/live-analysis.json \
            data/analysis-history.json \
            data/notify-state.json

          if git diff --cached --quiet; then
            echo "No live analysis changes to commit."
            exit 0
          fi

          git commit -m "robot: refresh live analysis"

          max_attempts=5

          for attempt in $(seq 1 "$max_attempts"); do
            echo "Push attempt ${attempt}/${max_attempts}"

            if git push origin HEAD:main; then
              echo "Live analysis pushed successfully."
              exit 0
            fi

            if [[ "$attempt" -eq "$max_attempts" ]]; then
              echo "Push failed after ${max_attempts} attempts."
              exit 1
            fi

            echo "Remote branch changed. Rebasing before retry..."

            git fetch origin main

            if ! git rebase origin/main; then
              echo "Rebase conflict detected."
              git rebase --abort || true
              exit 1
            fi

            sleep $((attempt * 5))
          done

      - name: Log execution
        if: always()
        run: |
          echo "PipSight live-analysis workflow finished."
          echo "Status: ${{ job.status }}"
          echo "Repository: ${{ github.repository }}"
          echo "Run ID: ${{ github.run_id }}"
          echo "Completed at: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
