name: PipSight Pro — live analysis manual recovery

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: pipsight-analysis-writes-${{ github.ref }}
  cancel-in-progress: false
  queue: max

env:
  PIPSIGHT_TELEGRAM_MODES: "master,swing,intraday,scalp"
  PIPSIGHT_TELEGRAM_NOTIFY_HOLD: "false"

jobs:
  analyze:
    name: Run and publish live analysis manually
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify fixed live-analysis engine
        run: |
          set -euo pipefail

          test -s "run-live-analysis.js"
          node --check "run-live-analysis.js"

          node <<'NODE'
          "use strict";

          const live =
            require("./run-live-analysis.js");

          if (
            typeof live.buildLiveAnalysisOutput !==
              "function"
          ) {
            throw new Error(
              "run-live-analysis.js does not expose the expected production API."
            );
          }

          const probe =
            live.buildLiveAnalysisOutput({
              pairs: [],
              generatedAt:
                "2026-01-01T00:00:00.000Z",
              timestamp:
                Date.parse(
                  "2026-01-01T00:00:00.000Z"
                )
            });

          if (probe.engineVersion !== "1.4.2-pro") {
            throw new Error(
              `run-live-analysis.js version ${probe.engineVersion} is unsupported; expected 1.4.2-pro.`
            );
          }

          console.log(
            "Fixed Live Analysis engine compatibility check passed."
          );
          NODE

      - name: Run live analysis
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail

          node run-live-analysis.js

      - name: Validate analysis outputs
        run: |
          set -euo pipefail

          node <<'NODE'
          "use strict";

          const fs = require("fs");

          function readObject(filePath) {
            if (!fs.existsSync(filePath)) {
              throw new Error(
                `Required output file does not exist: ${filePath}`
              );
            }

            const raw =
              fs.readFileSync(filePath, "utf8").trim();

            if (!raw) {
              throw new Error(
                `Output file is empty: ${filePath}`
              );
            }

            const parsed = JSON.parse(raw);

            if (
              parsed === null ||
              typeof parsed !== "object" ||
              Array.isArray(parsed)
            ) {
              throw new Error(
                `${filePath} must contain a JSON object.`
              );
            }

            return parsed;
          }

          const live =
            readObject("data/live-analysis.json");

          const history =
            readObject("data/analysis-history.json");

          const notify =
            readObject("data/notify-state.json");

          if (
            live.engineVersion !== "1.4.2-pro" ||
            live.status !== "ok" ||
            typeof live.pairs !== "object" ||
            live.pairs === null ||
            Array.isArray(live.pairs) ||
            !Array.isArray(live.results) ||
            !Array.isArray(live.analyses) ||
            !Array.isArray(live.data) ||
            live.pairCount !==
              Object.keys(live.pairs).length ||
            JSON.stringify(live.results) !==
              JSON.stringify(live.analyses) ||
            JSON.stringify(live.results) !==
              JSON.stringify(live.data)
          ) {
            throw new Error(
              "data/live-analysis.json failed its production schema contract."
            );
          }

          for (const field of [
            "records",
            "history",
            "items",
            "closed"
          ]) {
            if (!Array.isArray(history[field])) {
              throw new Error(
                `data/analysis-history.json field ${field} must be an array.`
              );
            }
          }

          if (
            history.open === null ||
            typeof history.open !== "object" ||
            Array.isArray(history.open) ||
            JSON.stringify(history.records) !==
              JSON.stringify(history.history) ||
            JSON.stringify(history.records) !==
              JSON.stringify(history.items)
          ) {
            throw new Error(
              "data/analysis-history.json aliases or open collection are invalid."
            );
          }

          for (const field of [
            "signals",
            "notifications",
            "state"
          ]) {
            if (
              notify[field] === null ||
              typeof notify[field] !== "object" ||
              Array.isArray(notify[field])
            ) {
              throw new Error(
                `data/notify-state.json field ${field} must be an object.`
              );
            }
          }

          if (
            JSON.stringify(notify.signals) !==
              JSON.stringify(notify.notifications) ||
            JSON.stringify(notify.signals) !==
              JSON.stringify(notify.state)
          ) {
            throw new Error(
              "data/notify-state.json aliases are not synchronized."
            );
          }

          console.log(
            "Live analysis, history and notify-state validation passed."
          );
          NODE

      - name: Commit and push updated analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_TYPE}" != "branch" ]]; then
            echo "::error::Live analysis can only be committed from a branch workflow run."
            exit 1
          fi

          git config user.name "pipsight-robot"
          git config user.email "actions@users.noreply.github.com"

          # Strictly stage only files owned by live analysis.
          git add -- \
            data/live-analysis.json \
            data/analysis-history.json \
            data/notify-state.json

          if git diff --cached --quiet; then
            echo "No live analysis changes to commit."
            exit 0
          fi

          git commit -m "robot: manually refresh live analysis"

          max_attempts=5

          for attempt in $(seq 1 "$max_attempts"); do
            echo "Push attempt ${attempt}/${max_attempts}"

            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "Live analysis pushed successfully."
              exit 0
            fi

            if [[ "$attempt" -eq "$max_attempts" ]]; then
              echo "Push failed after ${max_attempts} attempts."
              exit 1
            fi

            echo "Remote branch changed. Rebasing before retry..."

            git fetch origin "${GITHUB_REF_NAME}"

            if ! git rebase "origin/${GITHUB_REF_NAME}"; then
              echo "Rebase conflict detected."
              git rebase --abort || true
              exit 1
            fi

            sleep $((attempt * 5))
          done

      - name: Log execution
        if: always()
        run: |
          echo "PipSight manual live-analysis workflow finished."
          echo "Status: ${{ job.status }}"
          echo "Repository: ${{ github.repository }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Run ID: ${{ github.run_id }}"
          echo "Completed at: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
