name: Send Pattern Alerts to Telegram

on:
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: pipsight-telegram-${{ github.ref }}
  cancel-in-progress: false

jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate required configuration
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail

          if [[ -z "${TELEGRAM_BOT_TOKEN:-}" ]]; then
            echo "::error::TELEGRAM_BOT_TOKEN secret is missing or empty."
            exit 1
          fi

          if [[ -z "${TELEGRAM_CHAT_ID:-}" ]]; then
            echo "::error::TELEGRAM_CHAT_ID secret is missing or empty."
            exit 1
          fi

          echo "Telegram configuration validated."

      - name: Send Pattern Alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          node telegram-pattern-alerts.js

      - name: Log execution
        if: always()
        run: |
          echo "Telegram workflow finished at $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          echo "Repository: ${{ github.repository }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Run ID: ${{ github.run_id }}"
          echo "Final status: ${{ job.status }}"
