name: Send Pattern Alerts to Telegram

on:
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: pipsight-telegram-alerts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate required configuration
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail

          if [[ -z "${TELEGRAM_BOT_TOKEN:-}" ]]; then
            echo "::error::TELEGRAM_BOT_TOKEN secret is missing or empty."
            exit 1
          fi

          if [[ -z "${TELEGRAM_CHAT_ID:-}" ]]; then
            echo "::error::TELEGRAM_CHAT_ID secret is missing or empty."
            exit 1
          fi

          echo "Telegram configuration validated."

      - name: Send pattern signal alerts
        id: send_alerts
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          node telegram-pattern-alerts.js

      - name: Validate sent-alert state
        if: always()
        run: |
          set -euo pipefail

          if [[ ! -f telegram-pattern-log.json ]]; then
            echo "No telegram-pattern-log.json file was created."
            echo "This normally means no new alert was sent."
            exit 0
          fi

          node -e '
            const fs = require("fs");

            const file = "telegram-pattern-log.json";
            const parsed = JSON.parse(fs.readFileSync(file, "utf8"));

            if (!Array.isArray(parsed)) {
              throw new Error(
                "telegram-pattern-log.json must contain a JSON array."
              );
            }

            for (const [index, entry] of parsed.entries()) {
              if (
                !entry ||
                typeof entry !== "object" ||
                Array.isArray(entry)
              ) {
                throw new Error(
                  `Invalid log entry at index ${index}.`
                );
              }

              if (
                typeof entry.id !== "string" ||
                entry.id.trim() === ""
              ) {
                throw new Error(
                  `Missing alert ID at index ${index}.`
                );
              }

              if (
                typeof entry.sentAt !== "string" ||
                entry.sentAt.trim() === ""
              ) {
                throw new Error(
                  `Missing sentAt value at index ${index}.`
                );
              }
            }

            console.log(
              `Validated ${parsed.length} persisted Telegram alert record(s).`
            );
          '

      - name: Commit sent-alert state
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [[ ! -f telegram-pattern-log.json ]]; then
            echo "No sent-alert state file exists. Nothing to commit."
            exit 0
          fi

          git config user.name "pipsight-robot"
          git config user.email "actions@users.noreply.github.com"

          git add -- telegram-pattern-log.json

          if git diff --cached --quiet; then
            echo "Telegram sent-alert state is unchanged."
            exit 0
          fi

          git commit -m "Persist Telegram pattern alert state"

          max_attempts=3
          attempt=1

          while [[ "$attempt" -le "$max_attempts" ]]; do
            echo "Push attempt ${attempt}/${max_attempts}..."

            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "Telegram alert state pushed successfully."
              exit 0
            fi

            if [[ "$attempt" -eq "$max_attempts" ]]; then
              echo "::error::Unable to push Telegram alert state after ${max_attempts} attempts."
              exit 1
            fi

            echo "Push conflict detected. Rebasing and retrying..."

            git pull \
              --rebase \
              --autostash \
              origin \
              "${GITHUB_REF_NAME}"

            attempt=$((attempt + 1))
            sleep $((attempt * 2))
          done

      - name: Verify alert execution result
        if: always()
        env:
          ALERT_STEP_OUTCOME: ${{ steps.send_alerts.outcome }}
        run: |
          set -euo pipefail

          if [[ "${ALERT_STEP_OUTCOME}" != "success" ]]; then
            echo "::error::Telegram pattern alert processing failed."
            exit 1
          fi

          echo "Telegram pattern alert processing completed successfully."

      - name: Log execution
        if: always()
        run: |
          echo "Telegram workflow finished at $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          echo "Repository: ${{ github.repository }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Run ID: ${{ github.run_id }}"
          echo "Final status: ${{ job.status }}"
