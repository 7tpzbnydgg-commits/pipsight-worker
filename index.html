<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
/>

<title>PipSight Pro AI — Gold &amp; FX Signal Desk</title>

<meta
  name="description"
  content="PipSight Pro AI — professional Gold and Forex market analysis dashboard."
/>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

<link
  href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap"
  rel="stylesheet"
/>

<style>
  :root{
    color-scheme:dark;

    --bg:#0B0C0F;
    --panel:#15171C;
    --panel-soft:#111318;
    --panel-hover:#191C22;

    --border:#272A31;
    --border-strong:#3A3E47;

    --text:#ECE8DF;
    --muted:#888B92;
    --muted-light:#A8ABB2;

    --buy:#3E9C74;
    --sell:#B5544A;
    --hold:#D08C3B;
    --accent:#C9A24C;

    --buy-bg:rgba(62,156,116,.13);
    --sell-bg:rgba(181,84,74,.13);
    --hold-bg:rgba(208,140,59,.13);
    --accent-bg:rgba(201,162,76,.12);

    --shadow:0 14px 40px rgba(0,0,0,.22);
    --radius:5px;

    --safe-top:env(safe-area-inset-top, 0px);
    --safe-right:env(safe-area-inset-right, 0px);
    --safe-bottom:env(safe-area-inset-bottom, 0px);
    --safe-left:env(safe-area-inset-left, 0px);
  }

  *{
    box-sizing:border-box;
  }

  html{
    min-height:100%;
    background:var(--bg);
    scroll-behavior:smooth;
  }

  body{
    min-height:100%;
    margin:0;
    padding:0;
    background:
      radial-gradient(
        circle at 50% -20%,
        rgba(201,162,76,.06),
        transparent 36%
      ),
      var(--bg);
    color:var(--text);
    font-family:"Inter",sans-serif;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }

  button,
  input,
  select,
  textarea{
    font:inherit;
  }

  button{
    -webkit-tap-highlight-color:transparent;
  }

  .mono{
    font-family:"JetBrains Mono",monospace;
    font-variant-numeric:tabular-nums;
  }

  .display{
    font-family:"Fraunces",serif;
    font-optical-sizing:auto;
  }

  .header{
    padding:
      calc(18px + var(--safe-top))
      calc(20px + var(--safe-right))
      18px
      calc(20px + var(--safe-left));
    border-bottom:1px solid var(--border);
    background:rgba(11,12,15,.92);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
  }

  .header-inner{
    width:100%;
    max-width:900px;
    margin:0 auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
  }

  .eyebrow{
    margin:0;
    font-size:10px;
    font-weight:500;
    letter-spacing:.3em;
    color:var(--accent);
    text-transform:uppercase;
  }

  h1{
    margin:4px 0 0;
    font-family:"Fraunces",serif;
    font-size:23px;
    font-weight:600;
    letter-spacing:-.01em;
  }

  .header-right{
    text-align:right;
  }

  .disclaimer{
    font-size:10px;
    line-height:1.55;
    color:var(--muted);
  }

  .tabs{
    width:100%;
    max-width:900px;
    margin:0 auto;
    padding:18px 20px 0;
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:4px;
  }

  .tab{
    padding:7px 13px;
    border:1px solid var(--border);
    border-radius:3px;
    background:var(--panel);
    color:var(--muted);
    cursor:pointer;
    font-family:"JetBrains Mono",monospace;
    font-size:12px;
    transition:
      color .15s ease,
      border-color .15s ease,
      background .15s ease;
  }

  .tab:hover:not(.active){
    color:var(--text);
    border-color:var(--border-strong);
  }

  .tab.active{
    color:var(--accent);
    border-color:rgba(201,162,76,.55);
    background:var(--accent-bg);
  }

  .session-chip{
    margin-left:auto;
    padding:5px 10px;
    border:1px solid var(--border);
    border-radius:3px;
    background:var(--panel);
    color:var(--muted);
    font-family:"JetBrains Mono",monospace;
    font-size:10px;
  }

  .master-wrap{
    width:100%;
    max-width:900px;
    margin:0 auto;
    padding:10px 20px 0;
  }

  .mode-row{
    width:100%;
    max-width:900px;
    margin:0 auto;
    padding:10px 20px 0;
    display:flex;
    gap:4px;
  }

  .mode-btn{
    flex:1;
    min-width:0;
    padding:10px 12px;
    border:1px solid var(--border);
    border-radius:3px;
    background:var(--panel);
    color:var(--muted);
    cursor:pointer;
    text-align:center;
    font-family:"Fraunces",serif;
    font-size:12px;
    font-weight:600;
    transition:
      color .15s ease,
      border-color .15s ease,
      background .15s ease;
  }

  .mode-btn:hover:not(.active){
    color:var(--text);
    border-color:var(--border-strong);
  }

  .mode-btn.active{
    color:var(--accent);
    border-color:rgba(201,162,76,.55);
    background:var(--accent-bg);
  }

  .mode-btn small{
    display:block;
    margin-top:2px;
    color:var(--muted);
    font-family:"JetBrains Mono",monospace;
    font-size:10px;
    font-weight:400;
  }

  .container{
    width:100%;
    max-width:900px;
    margin:0 auto;
    padding:
      24px
      calc(20px + var(--safe-right))
      calc(24px + var(--safe-bottom))
      calc(20px + var(--safe-left));
  }

  .card{
    margin-bottom:20px;
    padding:22px;
    border:1px solid var(--border);
    border-top:2px solid rgba(201,162,76,.5);
    border-radius:var(--radius);
    background:var(--panel);
    box-shadow:var(--shadow);
  }

  .label{
    margin-bottom:8px;
    color:var(--muted);
    font-family:"JetBrains Mono",monospace;
    font-size:11px;
    letter-spacing:.08em;
    text-transform:uppercase;
  }

  .hero{
    display:grid;
    grid-template-columns:minmax(0,1fr) auto;
    align-items:center;
    gap:24px;
  }

  .price{
    font-family:"Fraunces",serif;
    font-size:38px;
    font-weight:600;
    letter-spacing:-.01em;
  }

  .row{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:10px;
    margin-top:12px;
  }

  .badge{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    padding:6px 14px;
    border:1px solid;
    border-radius:3px;
    font-family:"JetBrains Mono",monospace;
    font-size:13px;
    font-weight:600;
    letter-spacing:.04em;
    text-transform:uppercase;
  }

  .badge-buy{
    color:var(--buy);
    border-color:rgba(62,156,116,.45);
    background:var(--buy-bg);
  }

  .badge-sell{
    color:var(--sell);
    border-color:rgba(181,84,74,.45);
    background:var(--sell-bg);
  }

  .badge-hold{
    color:var(--hold);
    border-color:rgba(208,140,59,.45);
    background:var(--hold-bg);
  }

  .robot-dot{
    display:inline-block;
    width:7px;
    height:7px;
    margin-right:6px;
    border-radius:50%;
    vertical-align:middle;
  }

  .robot-on{
    background:var(--buy);
    box-shadow:0 0 6px var(--buy);
  }

  .robot-warn{
    background:var(--hold);
    box-shadow:0 0 6px var(--hold);
  }

  .robot-off{
    background:var(--muted);
  }

  .grid3{
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:14px;
  }

  .indicator-val{
    font-size:13px;
    line-height:1.5;
  }

  .newsitem{
    margin-bottom:14px;
    padding-left:12px;
    border-left:2px solid var(--hold);
  }

  .newsmeta{
    margin-bottom:4px;
    color:var(--muted);
    font-family:"JetBrains Mono",monospace;
    font-size:10px;
  }

  .newstext{
    color:rgba(236,232,223,.9);
    font-size:14px;
    line-height:1.5;
  }

  .footer-note{
    padding-top:8px;
    color:var(--muted);
    text-align:center;
    font-family:"JetBrains Mono",monospace;
    font-size:10px;
    line-height:1.6;
  }

  .loading,
  .errbox{
    padding:40px;
    border:1px solid var(--border);
    border-radius:var(--radius);
    background:var(--panel);
    color:var(--muted);
    text-align:center;
    font-family:"JetBrains Mono",monospace;
    font-size:13px;
  }

  .errbox{
    border-color:rgba(181,84,74,.35);
  }

  .retry{
    margin-top:12px;
    padding:7px 16px;
    border:1px solid rgba(181,84,74,.45);
    border-radius:3px;
    background:var(--sell-bg);
    color:var(--sell);
    cursor:pointer;
    font-family:"JetBrains Mono",monospace;
    font-size:12px;
  }

  .retry:hover{
    border-color:var(--sell);
  }

  .chart-wrap{
    height:560px;
  }

  .chart-fullscreen{
    position:fixed !important;
    inset:0;
    z-index:1000;
    display:flex;
    flex-direction:column;
    margin:0;
    padding:
      max(12px,var(--safe-top))
      max(12px,var(--safe-right))
      max(12px,var(--safe-bottom))
      max(12px,var(--safe-left));
    overflow:hidden;
    border-radius:0;
    background:var(--bg);
  }

  .chart-fullscreen .chart-wrap{
    flex:1;
    height:auto;
    margin-top:8px !important;
  }

  .chart-fullscreen #tvchart{
    height:100%;
  }

  .iconbtn{
    padding:5px 10px;
    border:1px solid var(--border);
    border-radius:3px;
    background:transparent;
    color:var(--muted);
    cursor:pointer;
    font-family:"JetBrains Mono",monospace;
    font-size:11px;
  }

  .iconbtn:hover{
    color:var(--text);
    border-color:var(--accent);
  }

  .sr-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    padding:8px 0;
    border-bottom:1px dashed var(--border);
    font-size:13px;
  }

  .sr-row:last-child{
    border-bottom:none;
  }

  .sr-tag{
    flex-shrink:0;
    padding:2px 8px;
    border-radius:2px;
    white-space:nowrap;
    font-family:"JetBrains Mono",monospace;
    font-size:10px;
  }

  .sr-tag.res{
    color:var(--sell);
    background:var(--sell-bg);
  }

  .sr-tag.sup{
    color:var(--buy);
    background:var(--buy-bg);
  }

  .watch-box{
    padding:12px;
    border:1px dashed var(--border);
    border-radius:4px;
    background:transparent;
    color:rgba(236,232,223,.9);
    font-size:13px;
    line-height:1.6;
  }

  .plan-grid{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:10px;
    margin-top:6px;
  }

  .plan-cell{
    padding:10px 12px;
    border:1px solid var(--border);
    border-radius:4px;
    background:transparent;
  }

  .plan-cell .k{
    color:var(--muted);
    font-family:"JetBrains Mono",monospace;
    font-size:10px;
    letter-spacing:.05em;
    text-transform:uppercase;
  }

  .plan-cell .v{
    margin-top:2px;
    font-family:"Fraunces",serif;
    font-size:16px;
    font-weight:600;
  }

  .breakdown-row{
    display:flex;
    align-items:center;
    gap:10px;
    padding:6px 0;
    font-size:12px;
  }

  .breakdown-row .bname{
    width:150px;
    flex-shrink:0;
    color:var(--muted);
    font-family:"JetBrains Mono",monospace;
    font-size:11px;
  }

  .breakdown-bar{
    position:relative;
    flex:1;
    height:6px;
    overflow:hidden;
    border-radius:2px;
    background:var(--border);
  }

  .breakdown-fill{
    position:absolute;
    top:0;
    bottom:0;
  }

  .pipe-step{
    position:relative;
    padding-bottom:18px;
    padding-left:34px;
  }

  .pipe-step:last-child{
    padding-bottom:0;
  }

  .pipe-step::before{
    content:"";
    position:absolute;
    top:24px;
    bottom:-4px;
    left:11px;
    width:2px;
    background:var(--border);
  }

  .pipe-step:last-child::before{
    display:none;
  }

  .pipe-dot{
    position:absolute;
    top:0;
    left:0;
    display:flex;
    width:24px;
    height:24px;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    font-size:12px;
    font-weight:700;
  }

  .pipe-dot.pass{
    color:var(--buy);
    border:1px solid rgba(62,156,116,.45);
    background:var(--buy-bg);
  }

  .pipe-dot.fail{
    color:var(--sell);
    border:1px solid rgba(181,84,74,.45);
    background:var(--sell-bg);
  }

  .pipe-dot.na{
    color:var(--muted);
    border:1px solid var(--border);
    background:rgba(136,139,146,.1);
  }

  .pipe-dot.skip{
    color:var(--muted);
    border:1px dashed var(--border);
    background:transparent;
  }

  .pipe-dot.info{
    color:var(--accent);
    border:1px solid rgba(201,162,76,.45);
    background:var(--accent-bg);
  }

  .pipe-name{
    color:var(--text);
    font-family:"JetBrains Mono",monospace;
    font-size:12.5px;
    font-weight:600;
  }

  .pipe-detail{
    margin-top:2px;
    color:var(--muted);
    font-size:12px;
    line-height:1.45;
  }

  .log-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    padding:7px 0;
    border-bottom:1px dashed var(--border);
    font-family:"JetBrains Mono",monospace;
    font-size:12px;
  }

  .log-row:last-child{
    border-bottom:none;
  }

  .log-status{
    flex-shrink:0;
    padding:2px 8px;
    border-radius:2px;
    font-size:10px;
  }

  .log-open{
    color:var(--hold);
    background:var(--hold-bg);
  }

  .log-win{
    color:var(--buy);
    background:var(--buy-bg);
  }

  .log-loss{
    color:var(--sell);
    background:var(--sell-bg);
  }

  .suppress{
    margin-top:8px;
    color:var(--hold);
    font-family:"JetBrains Mono",monospace;
    font-size:11px;
    line-height:1.5;
  }

  .scope-note{
    color:var(--muted);
    font-size:11px;
    line-height:1.6;
  }

  .scope-note b{
    color:var(--text);
  }

  .freshness{
    display:inline-flex;
    align-items:center;
    gap:4px;
    white-space:nowrap;
    font-family:"JetBrains Mono",monospace;
    font-size:10px;
  }

  .freshness.live{
    color:var(--buy);
  }

  .freshness.warn{
    padding:2px 6px;
    border:1px solid var(--hold);
    border-radius:6px;
    color:var(--hold);
  }

  .freshness.error{
    padding:2px 6px;
    border:1px solid var(--sell);
    border-radius:6px;
    color:var(--sell);
  }

  .tf-grid{
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:8px;
  }

  .tf-card{
    padding:10px;
    border:1px solid rgba(255,255,255,.08);
    border-radius:8px;
    text-align:center;
  }

  .signal-summary{
    padding:12px;
    margin-bottom:12px;
    border:1px solid rgba(255,255,255,.12);
    border-radius:10px;
    background:rgba(255,255,255,.02);
  }

  .metric-grid{
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:6px;
    text-align:center;
  }

  .metric{
    padding:8px;
    border:1px solid var(--border);
    border-radius:4px;
    background:rgba(255,255,255,.02);
  }

  .metric-label{
    margin-bottom:2px;
    color:var(--muted);
    font-family:"JetBrains Mono",monospace;
    font-size:9px;
    text-transform:uppercase;
  }

  .metric-value{
    font-family:"JetBrains Mono",monospace;
    font-size:12px;
    font-weight:600;
  }

  .empty-note{
    padding:18px;
    border:1px dashed var(--border);
    border-radius:4px;
    color:var(--muted);
    text-align:center;
    font-size:12px;
    line-height:1.6;
  }

  @media (max-width:700px){
    .header-inner{
      align-items:flex-start;
    }

    .disclaimer{
      max-width:280px;
    }

    .mode-row{
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
    }

    .grid3{
      grid-template-columns:1fr;
    }

    .hero{
      grid-template-columns:1fr;
    }

    .chart-wrap{
      height:480px;
    }
  }

  @media (max-width:480px){
    .header{
      padding-left:16px;
      padding-right:16px;
    }

    .header-inner{
      flex-direction:column;
      gap:12px;
    }

    .header-right{
      width:100%;
      text-align:left;
    }

    .tabs,
    .mode-row,
    .master-wrap{
      padding-left:14px;
      padding-right:14px;
    }

    .session-chip{
      width:100%;
      margin-left:0;
      text-align:center;
    }

    .container{
      padding-left:14px;
      padding-right:14px;
    }

    .card{
      padding:16px;
    }

    .price{
      font-size:34px;
    }

    .plan-grid,
    .metric-grid{
      grid-template-columns:1fr;
    }

    .tf-grid{
      grid-template-columns:1fr;
    }

    .log-row{
      align-items:flex-start;
      flex-direction:column;
      gap:6px;
    }

    .sr-row{
      align-items:flex-start;
      flex-direction:column;
      gap:4px;
    }

    .chart-wrap{
      height:420px;
    }
  }
</style>
</head>

<body>

<header class="header">
  <div class="header-inner">
    <div>
      <div class="eyebrow">Gold &amp; FX · Professional Signal Desk</div>
      <h1 class="display">PipSight Pro AI</h1>
    </div>

    <div class="header-right">
      <div class="disclaimer mono">
        Not financial advice · no broker connected<br />
        Signals are rules-based probability estimates, not guarantees
      </div>

      <button
        class="iconbtn"
        type="button"
        onclick="exportLearnerBackup()"
        style="margin-top:8px;"
      >
        📥 Backup Data
      </button>
    </div>
  </div>
</header>

<nav
  class="tabs"
  id="tabs"
  aria-label="Trading pairs"
></nav>

<div
  class="master-wrap"
  id="masterSignalContainer"
></div>

<div
  class="mode-row"
  role="group"
  aria-label="Analysis mode"
>
  <button
    class="mode-btn active"
    type="button"
    data-mode="daily"
    onclick="setMode('daily')"
  >
    Intraday
    <small>H1 confirmed by H4</small>
  </button>

  <button
    class="mode-btn"
    type="button"
    data-mode="weekly"
    onclick="setMode('weekly')"
  >
    Swing
    <small>D1 confirmed by W1</small>
  </button>

  <button
    class="mode-btn"
    type="button"
    data-mode="scalp"
    onclick="setMode('scalp')"
  >
    Scalping
    <small>M5 · M15 · M30 · H1</small>
  </button>

  <button
    class="mode-btn"
    type="button"
    data-mode="patterns"
    onclick="loadPatternDetector()"
  >
    Patterns
    <small>AI chart-pattern feed</small>
  </button>
</div>

<main>
  <section
    class="container"
    id="container"
  >
    <div class="loading">
      Loading PipSight market data…
    </div>
  </section>

  <section
    class="container"
    id="scalpContainer"
    style="display:none;"
  ></section>

  <section
    class="container"
    id="patternContainer"
    style="display:none;"
  ></section>
</main>

<script src="https://s3.tradingview.com/tv.js"></script>
<script src="learner.js"></script>

<script>
"use strict";

// ════════════════════════════════════════════════════════════════
// PIPSIGHT PRO AI
// INDEX.HTML — PART 1 OF 5
//
// This section provides:
//
// - shared configuration
// - centralized worker URLs

// - safe formatting and HTML helpers
// - request caching and duplicate-request prevention
// - last-known-good network fallback
// - request timeout handling
// - render locks
// - page visibility controls
// - self-learning engine initialization
// - supported pair definitions
//
// Parts 2–5 continue directly below this code.
// ════════════════════════════════════════════════════════════════

// ════════════════════════════════════════════════════════════════
// STORAGE HELPERS
// ════════════════════════════════════════════════════════════════

function loadJSON(key, defaultValue){
  try{
    const raw = localStorage.getItem(key);

    if(raw == null || raw === ""){
      return defaultValue;
    }

    return JSON.parse(raw);
  }catch(error){
    console.warn(
      `Could not read localStorage key "${key}":`,
      error
    );

    return defaultValue;
  }
}

function saveJSON(key, value){
  try{
    localStorage.setItem(
      key,
      JSON.stringify(value)
    );

    return true;
  }catch(error){
    console.warn(
      `Could not save localStorage key "${key}":`,
      error
    );

    return false;
  }
}

function removeStoredJSON(key){
  try{
    localStorage.removeItem(key);
    return true;
  }catch(error){
    console.warn(
      `Could not remove localStorage key "${key}":`,
      error
    );

    return false;
  }
}

// ════════════════════════════════════════════════════════════════
// BASIC VALUE HELPERS
// ════════════════════════════════════════════════════════════════

function clamp(value, minimum, maximum){
  return Math.max(
    minimum,
    Math.min(
      maximum,
      value
    )
  );
}

function isPlainObject(value){
  return (
    value !== null &&
    typeof value === "object" &&
    !Array.isArray(value)
  );
}

function safeObject(value){
  return isPlainObject(value)
    ? value
    : {};
}

function safeArray(value){
  return Array.isArray(value)
    ? value
    : [];
}

function isFiniteNumberValue(value){
  return (
    typeof value === "number" &&
    Number.isFinite(value)
  );
}

function safeNumber(value, fallback = null){
  if(isFiniteNumberValue(value)){
    return value;
  }

  if(
    value == null ||
    value === "" ||
    typeof value === "boolean"
  ){
    return fallback;
  }

  const converted =
    Number(value);

  return Number.isFinite(converted)
    ? converted
    : fallback;
}

function safeInteger(value, fallback = null){
  const number =
    safeNumber(value, null);

  return number == null
    ? fallback
    : Math.trunc(number);
}

function safeFixed(
  value,
  decimals = 2,
  fallback = "—"
){
  const number =
    safeNumber(value, null);

  if(number == null){
    return fallback;
  }

  const safeDecimals =
    clamp(
      safeInteger(decimals, 2),
      0,
      12
    );

  return number.toFixed(
    safeDecimals
  );
}

function safePercentage(
  value,
  decimals = 1,
  fallback = "—"
){
  const number =
    safeNumber(value, null);

  return number == null
    ? fallback
    : `${safeFixed(number, decimals)}%`;
}

function normalizeErrorMessage(
  error,
  fallback = "Unknown error"
){
  if(
    error &&
    typeof error.message === "string" &&
    error.message.trim()
  ){
    return error.message.trim();
  }

  if(
    typeof error === "string" &&
    error.trim()
  ){
    return error.trim();
  }

  return fallback;
}

function safeDateMs(value){
  if(
    value == null ||
    value === ""
  ){
    return null;
  }

  const timestamp =
    new Date(value).getTime();

  return Number.isFinite(timestamp)
    ? timestamp
    : null;
}

function safeDateLabel(
  value,
  fallback = "Unknown"
){
  const timestamp =
    safeDateMs(value);

  if(timestamp == null){
    return fallback;
  }

  try{
    return new Date(timestamp)
      .toLocaleString();
  }catch{
    return fallback;
  }
}

function safeISODate(value){
  const timestamp =
    safeDateMs(value);

  if(timestamp == null){
    return null;
  }

  return new Date(timestamp)
    .toISOString();
}

function escapeHTML(value){
  return String(
    value == null
      ? ""
      : value
  )
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function escapeAttribute(value){
  return escapeHTML(value)
    .replace(/`/g, "&#96;");
}

function truncateText(
  value,
  maximumLength = 120
){
  const text =
    String(
      value == null
        ? ""
        : value
    );

  const limit =
    Math.max(
      1,
      safeInteger(
        maximumLength,
        120
      )
    );

  if(text.length <= limit){
    return text;
  }

  return (
    text.slice(
      0,
      Math.max(
        0,
        limit - 1
      )
    ) +
    "…"
  );
}

function deepClone(value){
  if(
    typeof structuredClone === "function"
  ){
    try{
      return structuredClone(value);
    }catch{
      // JSON fallback below.
    }
  }

  try{
    return JSON.parse(
      JSON.stringify(value)
    );
  }catch{
    return value;
  }
}

function uniqueBy(items, keyFactory){
  const seen =
    new Set();

  const output =
    [];

  for(const item of safeArray(items)){
    const key =
      keyFactory(item);

    if(
      key == null ||
      seen.has(key)
    ){
      continue;
    }

    seen.add(key);
    output.push(item);
  }

  return output;
}

function sortByTimestampAscending(
  rows,
  timestampSelector
){
  return safeArray(rows)
    .slice()
    .sort((first, second)=>{
      const firstTime =
        safeDateMs(
          timestampSelector(first)
        ) ?? 0;

      const secondTime =
        safeDateMs(
          timestampSelector(second)
        ) ?? 0;

      return firstTime -
        secondTime;
    });
}

function sortByTimestampDescending(
  rows,
  timestampSelector
){
  return safeArray(rows)
    .slice()
    .sort((first, second)=>{
      const firstTime =
        safeDateMs(
          timestampSelector(first)
        ) ?? 0;

      const secondTime =
        safeDateMs(
          timestampSelector(second)
        ) ?? 0;

      return secondTime -
        firstTime;
    });
}

// ════════════════════════════════════════════════════════════════
// REQUEST CACHE AND DUPLICATE-REQUEST PREVENTION
// ════════════════════════════════════════════════════════════════

const NETWORK_CACHE =
  new Map();

const IN_FLIGHT_REQUESTS =
  new Map();

const LAST_KNOWN_GOOD =
  new Map();

function buildRequestUrl(
  url,
  cacheBustValue = Date.now()
){
  const separator =
    url.includes("?")
      ? "&"
      : "?";

  return (
    `${url}${separator}t=${encodeURIComponent(cacheBustValue)}`
  );
}

function getNetworkCacheEntry(url){
  const entry =
    NETWORK_CACHE.get(url);

  if(
    !entry ||
    !Number.isFinite(entry.cachedAt)
  ){
    return null;
  }

  return entry;
}

function clearNetworkCache(url = null){
  if(url == null){
    NETWORK_CACHE.clear();
    return;
  }

  NETWORK_CACHE.delete(url);
}

function clearLastKnownGood(url = null){
  if(url == null){
    LAST_KNOWN_GOOD.clear();
    return;
  }

  LAST_KNOWN_GOOD.delete(url);
}

async function fetchJSONCached(
  url,
  {
    ttlMs = 60_000,
    timeoutMs = APP_CONFIG.requestTimeoutMs,
    forceRefresh = false,
    allowLastKnownGood = true,
    validate = null,
    transform = null
  } = {}
){
  if(
    typeof url !== "string" ||
    !url.trim()
  ){
    throw new Error(
      "A valid JSON URL is required"
    );
  }

  const normalizedUrl =
    url.trim();

  const now =
    Date.now();

  const cached =
    getNetworkCacheEntry(
      normalizedUrl
    );

  if(
    !forceRefresh &&
    cached &&
    now - cached.cachedAt <
      Math.max(0, ttlMs)
  ){
    return cached.data;
  }

  /*
   * When multiple dashboard sections request the same worker file
   * simultaneously, they all share this one active request.
   */
  if(
    IN_FLIGHT_REQUESTS.has(
      normalizedUrl
    )
  ){
    return IN_FLIGHT_REQUESTS.get(
      normalizedUrl
    );
  }

  const requestPromise =
    (async()=>{
      const controller =
        new AbortController();

      const timeoutId =
        setTimeout(
          ()=>{
            controller.abort();
          },
          Math.max(
            1_000,
            timeoutMs
          )
        );

      try{
        const requestUrl =
          buildRequestUrl(
            normalizedUrl,
            now
          );

        const response =
          await fetch(
            requestUrl,
            {
              method:"GET",
              cache:"no-store",
              signal:controller.signal,
              headers:{
                Accept:"application/json"
              }
            }
          );

        if(!response.ok){
          throw new Error(
            `HTTP ${response.status}`
          );
        }

        const responseText =
          await response.text();

        if(!responseText.trim()){
          throw new Error(
            "Server returned an empty response"
          );
        }

        let payload;

        try{
          payload =
            JSON.parse(
              responseText
            );
        }catch{
          throw new Error(
            "Server returned invalid JSON"
          );
        }

        if(
          typeof validate === "function"
        ){
          const validationResult =
            validate(payload);

          if(validationResult !== true){
            throw new Error(
              typeof validationResult === "string"
                ? validationResult
                : "Response validation failed"
            );
          }
        }

        if(
          typeof transform === "function"
        ){
          payload =
            transform(payload);
        }

        NETWORK_CACHE.set(
          normalizedUrl,
          {
            cachedAt:Date.now(),
            data:payload
          }
        );

        LAST_KNOWN_GOOD.set(
          normalizedUrl,
          payload
        );

        return payload;
      }catch(error){
        const normalizedError =
          error &&
          error.name === "AbortError"
            ? new Error(
                `Request timed out after ${Math.max(1_000, timeoutMs)}ms`
              )
            : error;

        if(
          allowLastKnownGood &&
          LAST_KNOWN_GOOD.has(
            normalizedUrl
          )
        ){
          console.warn(
            `Request failed for ${normalizedUrl}; using last known good response:`,
            normalizeErrorMessage(
              normalizedError
            )
          );

          return LAST_KNOWN_GOOD.get(
            normalizedUrl
          );
        }

        throw normalizedError;
      }finally{
        clearTimeout(
          timeoutId
        );

        IN_FLIGHT_REQUESTS.delete(
          normalizedUrl
        );
      }
    })();

  IN_FLIGHT_REQUESTS.set(
    normalizedUrl,
    requestPromise
  );

  return requestPromise;
}

// ════════════════════════════════════════════════════════════════
// RENDER LOCKS
// ════════════════════════════════════════════════════════════════

const ACTIVE_RENDERS =
  new Map();

const RENDER_GENERATIONS =
  new Map();

function nextRenderGeneration(scope){
  const next =
    (
      RENDER_GENERATIONS.get(scope) ||
      0
    ) + 1;

  RENDER_GENERATIONS.set(
    scope,
    next
  );

  return next;
}

function currentRenderGeneration(scope){
  return (
    RENDER_GENERATIONS.get(scope) ||
    0
  );
}

function isLatestRenderGeneration(
  scope,
  generation
){
  return (
    currentRenderGeneration(scope) ===
    generation
  );
}

async function withRenderLock(
  scope,
  renderer,
  {
    shareActive = true
  } = {}
){
  if(
    shareActive &&
    ACTIVE_RENDERS.has(scope)
  ){
    return ACTIVE_RENDERS.get(
      scope
    );
  }

  const generation =
    nextRenderGeneration(
      scope
    );

  const renderPromise =
    (async()=>{
      try{
        return await renderer({
          generation,

          isCurrent(){
            return isLatestRenderGeneration(
              scope,
              generation
            );
          }
        });
      }finally{
        if(
          ACTIVE_RENDERS.get(scope) ===
          renderPromise
        ){
          ACTIVE_RENDERS.delete(
            scope
          );
        }
      }
    })();

  ACTIVE_RENDERS.set(
    scope,
    renderPromise
  );

  return renderPromise;
}

function invalidateRender(scope){
  nextRenderGeneration(scope);
}

}

      PIPLEARNER_STORAGE_KEY,
      pipLearner.exportData()
    );
  }catch(error){

      "Learner data save failed:",
      normalizeErrorMessage(error)
    );

    return false;
  }
}

// ════════════════════════════════════════════════════════════════
// MANUAL LOCAL BACKUP
// ════════════════════════════════════════════════════════════════

function exportLearnerBackup(){
  const backupData = {
    version:
      APP_CONFIG.version,

    learning:
      pipLearner
        ? pipLearner.exportData()
        : null,

    dailyLog:
      typeof loadLog === "function"
        ? loadLog("daily")
        : [],

    weeklyLog:
      typeof loadLog === "function"
        ? loadLog("weekly")
        : [],

    scalpOpen:
      typeof loadScalpOpen === "function"
        ? loadScalpOpen()
        : {},

    scalpHistory:
      typeof loadScalpHistory === "function"
        ? loadScalpHistory()
        : [],

    goldHistory:
      typeof loadGoldHistory === "function"
        ? loadGoldHistory()
        : [],

    exportedAt:
      new Date().toISOString()
  };

  let objectUrl =
    null;

  let anchor =
    null;

  try{
    const blob =
      new Blob(
        [
          JSON.stringify(
            backupData,
            null,
            2
          )
        ],
        {
          type:"application/json"
        }
      );

    objectUrl =
      URL.createObjectURL(
        blob
      );

    anchor =
      document.createElement(
        "a"
      );

    anchor.href =
      objectUrl;

    anchor.download =
      `pipsight-backup-${new Date()
        .toISOString()
        .slice(0,10)}.json`;

    anchor.style.display =
      "none";

    document.body.appendChild(
      anchor
    );

    anchor.click();
  }catch(error){
    alert(
      "Backup failed: " +
      normalizeErrorMessage(error)
    );
  }finally{
    if(
      anchor &&
      anchor.parentNode
    ){
      anchor.parentNode.removeChild(
        anchor
      );
    }

    if(objectUrl){
      URL.revokeObjectURL(
        objectUrl
      );
    }
  }
}

// ════════════════════════════════════════════════════════════════
// LEARNING-DRIVEN SIGNAL GATES
// ════════════════════════════════════════════════════════════════

const LEARNER_GATE_MIN_SAMPLE =
  10;

const LEARNER_GATE_MIN_CONFIDENCE =
  35;

function worstLearnerConfidence(
  strategy,
  pairKey
){
  if(!pipLearner){
    return null;
  }

  let stats;

  try{
    stats =
      safeObject(
        pipLearner.getStats()
      );
  }catch(error){
    console.warn(
      "Could not read learner statistics:",
      normalizeErrorMessage(error)
    );

    return null;
  }

  const strategies =
    safeObject(
      stats.strategies
    );

  const pairs =
    safeObject(
      stats.pairs
    );

  const strategyStats =
    safeObject(
      strategies[strategy]
    );

  const pairStats =
    safeObject(
      pairs[pairKey]
    );

  let worst =
    null;

  const strategyResolved =
    safeNumber(
      strategyStats.resolved,
      0
    );

  const strategyConfidence =
    safeNumber(
      strategyStats.confidence,
      null
    );

  if(
    strategyResolved >=
      LEARNER_GATE_MIN_SAMPLE &&
    strategyConfidence != null &&
    strategyConfidence <
      LEARNER_GATE_MIN_CONFIDENCE
  ){
    worst = {
      label:
        `${strategy} strategy`,

      confidence:
        strategyConfidence,

      resolved:
        strategyResolved
    };
  }

  const pairResolved =
    safeNumber(
      pairStats.resolved,
      0
    );

  const pairConfidence =
    safeNumber(
      pairStats.confidence,
      null
    );

  if(
    pairResolved >=
      LEARNER_GATE_MIN_SAMPLE &&
    pairConfidence != null &&
    pairConfidence <
      LEARNER_GATE_MIN_CONFIDENCE
  ){
    if(
      !worst ||
      pairConfidence <
        worst.confidence
    ){
      worst = {
        label:
          `${pairKey} pair`,

        confidence:
          pairConfidence,

        resolved:
          pairResolved
      };
    }
  }

  return worst;
}

function applyLearnerGate(
  analysis,
  strategy,
  pairKey
){
  if(
    !analysis ||
    typeof analysis !== "object"
  ){
    return analysis;
  }

  if(
    !pipLearner ||
    !analysis.tradePlan
  ){
    return analysis;
  }

  if(
    !Array.isArray(
      analysis.pipeline
    )
  ){
    analysis.pipeline = [];
  }

  const worst =
    worstLearnerConfidence(
      strategy,
      pairKey
    );

  if(worst){
    const reason =
      `Learning engine suppressed this ${analysis.signal} — ` +
      `${worst.label} has ${safeFixed(worst.confidence,1)}% learned confidence ` +
      `after ${worst.resolved} resolved signals ` +
      `(minimum allowed: ${LEARNER_GATE_MIN_CONFIDENCE}%)`;

    analysis.pipeline.push({
      name:
        "Learning Engine Gate",

      status:
        "fail",

      detail:
        reason
    });

    analysis.signal =
      "HOLD";

    analysis.tradePlan =
      null;

    analysis.suppressionReason =
      reason;

    return analysis;
  }

  let resolvedSignals =
    0;

  try{
    const stats =
      safeObject(
        pipLearner.getStats()
      );

    resolvedSignals =
      safeNumber(
        stats.resolvedSignals,
        0
      );
  }catch{
    resolvedSignals = 0;
  }

  analysis.pipeline.push({
    name:
      "Learning Engine Gate",

    status:
      resolvedSignals >=
        LEARNER_GATE_MIN_SAMPLE
        ? "pass"
        : "skip",

    detail:
      resolvedSignals >=
        LEARNER_GATE_MIN_SAMPLE
        ? "Learned confidence for this strategy and pair remains above the suppression floor — signal allowed"
        : `Not enough resolved history yet (${resolvedSignals}/${LEARNER_GATE_MIN_SAMPLE}) — signal allowed by default`
  });

  return analysis;
}

function applyScalpLearnerGate(
  tradeSignal,
  pairKey
){
  if(
    !tradeSignal ||
    typeof tradeSignal !== "object"
  ){
    return tradeSignal;
  }

  if(
    !pipLearner ||
    tradeSignal.decision === "HOLD"
  ){
    return tradeSignal;
  }

  const worst =
    worstLearnerConfidence(
      "scalp",
      pairKey
    );

  if(!worst){
    return tradeSignal;
  }

  tradeSignal.reason =
    `Learning engine suppressed this ${tradeSignal.decision} — ` +
    `${worst.label} has ${safeFixed(worst.confidence,1)}% learned confidence ` +
    `after ${worst.resolved} resolved signals ` +
    `(minimum allowed: ${LEARNER_GATE_MIN_CONFIDENCE}%)`;

  tradeSignal.decision =
    "HOLD";

  tradeSignal.rawSl =
    null;

  tradeSignal.rawTp =
    null;

  tradeSignal.rawTp1 =
    null;

  tradeSignal.rawTp2 =
    null;

  tradeSignal.rawTp3 =
    null;

  return tradeSignal;
}

function getSession(){
  const hour =
    new Date().getUTCHours();

  const inAsia =
    hour >= 0 &&
    hour < 9;

  const inLondon =
    hour >= 8 &&
    hour < 17;

  const inNewYork =
    hour >= 13 &&
    hour < 22;

  if(
    inLondon &&
    inNewYork
  ){
    return "London / New York overlap — highest liquidity";
  }

  if(inLondon){
    return "London session";
  }

  if(inNewYork){
    return "New York session";
  }

  if(inAsia){
    return "Asian session";
  }

  return "Between major sessions — thinner liquidity";
}

function getTimeAgo(value){
  const timestamp =
    safeDateMs(value);

  if(timestamp == null){
    return "unknown";
  }

  const difference =
    Math.max(
      0,
      Date.now() -
      timestamp
    );

  const minutes =
    Math.floor(
      difference /
      60_000
    );

  const hours =
    Math.floor(
      difference /
      3_600_000
    );

  const days =
    Math.floor(
      difference /
      86_400_000
    );

  if(minutes < 1){
    return "just now";
  }

  if(minutes < 60){
    return `${minutes}m ago`;
  }

  if(hours < 24){
    return `${hours}h ago`;
  }

  return `${days}d ago`;
}

function freshnessBadge(
  updatedAtISO,
  maximumAgeMinutes,
  staleFlag = false
){
  const timestamp =
    safeDateMs(
      updatedAtISO
    );

  if(timestamp == null){
    return `
      <span class="freshness error">
        ⚠ no data yet
      </span>
    `;
  }

  const ageMinutes =
    Math.max(
      0,
      Math.round(
        (
          Date.now() -
          timestamp
        ) /
        60_000
      )
    );

  const ageLabel =
    ageMinutes < 60
      ? `${ageMinutes}m ago`
      : `${Math.round(ageMinutes / 60)}h ago`;

  const warning =
    staleFlag ||
    ageMinutes >
      maximumAgeMinutes;

  if(!warning){
    return `
      <span class="freshness live">
        ● live · ${escapeHTML(ageLabel)}
      </span>
    `;
  }

  return `
    <span class="freshness warn">
      ⚠ stale · ${escapeHTML(ageLabel)}
      ${staleFlag ? " · worker fallback" : ""}
    </span>
  `;
}

// ════════════════════════════════════════════════════════════════
// DATE AND WEEK HELPERS
// ════════════════════════════════════════════════════════════════

function normalizeDateOnly(value){
  if(
    typeof value !== "string"
  ){
    return null;
  }

  const trimmed =
    value.trim();

  if(
    /^\d{4}-\d{2}-\d{2}$/.test(
      trimmed
    )
  ){
    return trimmed;
  }

  const timestamp =
    safeDateMs(
      trimmed
    );

  if(timestamp == null){
    return null;
  }

  return new Date(timestamp)
    .toISOString()
    .slice(0,10);
}

function isoWeekKey(dateValue){
  const dateOnly =
    normalizeDateOnly(
      dateValue
    );

  if(!dateOnly){
    return null;
  }

  const date =
    new Date(
      `${dateOnly}T00:00:00Z`
    );

  const day =
    (
      date.getUTCDay() +
      6
    ) %
    7;

  date.setUTCDate(
    date.getUTCDate() -
    day +
    3
  );

  const firstThursday =
    new Date(
      Date.UTC(
        date.getUTCFullYear(),
        0,
        4
      )
    );

  const firstThursdayDay =
    (
      firstThursday.getUTCDay() +
      6
    ) %
    7;

  const week =
    1 +
    Math.round(
      (
        (
          date -
          firstThursday
        ) /
        86_400_000 -
        3 +
        firstThursdayDay
      ) /
      7
    );

  return (
    `${date.getUTCFullYear()}-W` +
    String(week)
      .padStart(2,"0")
  );
}

function resampleWeekly(rows){
  const map =
    new Map();

  for(const row of safeArray(rows)){
    const weekKey =
      isoWeekKey(
        row.date
      );

    if(!weekKey){
      continue;
    }

    /*
     * Daily close rows contain one close value only.
     * Keeping the last row of each ISO week creates the weekly close.
     */
    map.set(
      weekKey,
      row
    );
  }

  return Array.from(
    map.values()
  );
}

function rowsForMode(
  rows,
  mode
){
  return mode === "weekly"
    ? resampleWeekly(rows)
    : rows;
}
