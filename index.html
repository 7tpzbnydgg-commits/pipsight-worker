// MARKET-DATA NORMALIZATION
// ════════════════════════════════════════════════════════════════

function normalizeCloseRow(row){
  if(
    !row ||
    typeof row !== "object"
  ){
    return null;
  }

  const date =
    normalizeDateOnly(
      row.date ||
      row.datetime ||
      row.time
    );

  const close =
    safeNumber(
      row.close,
      null
    );

  if(
    !date ||
    close == null ||
    close <= 0
  ){
    return null;
  }

  return {
    date,
    close
  };
}

function normalizeCandle(row){
  if(
    !row ||
    typeof row !== "object"
  ){
    return null;
  }

  const timeValue =
    row.time ??
    row.datetime ??
    row.timestamp ??
    row.date;

  const timeMs =
    typeof timeValue === "number"
      ? (
          timeValue < 10_000_000_000
            ? timeValue * 1000
            : timeValue
        )
      : safeDateMs(timeValue);

  const open =
    safeNumber(
      row.open,
      null
    );

  const high =
    safeNumber(
      row.high,
      null
    );

  const low =
    safeNumber(
      row.low,
      null
    );

  const close =
    safeNumber(
      row.close,
      null
    );

  if(
    timeMs == null ||
    open == null ||
    high == null ||
    low == null ||
    close == null
  ){
    return null;
  }

  if(
    open <= 0 ||
    high <= 0 ||
    low <= 0 ||
    close <= 0
  ){
    return null;
  }

  const normalizedHigh =
    Math.max(
      high,
      open,
      close,
      low
    );

  const normalizedLow =
    Math.min(
      low,
      open,
      close,
      high
    );

  return {
    time:
      new Date(timeMs)
        .toISOString(),

    open,

    high:
      normalizedHigh,

    low:
      normalizedLow,

    close,

    volume:
      safeNumber(
        row.volume,
        null
      )
  };
}

function normalizeCloseRows(rows){
  return uniqueBy(
    safeArray(rows)
      .map(
        normalizeCloseRow
      )
      .filter(Boolean)
      .sort(
        (first, second)=>
          first.date.localeCompare(
            second.date
          )
      ),

    row=>
      row.date
  );
}

function normalizeCandles(rows){
  return uniqueBy(
    sortByTimestampAscending(
      safeArray(rows)
        .map(
          normalizeCandle
        )
        .filter(Boolean),

      row=>
        row.time
    ),

    row=>
      row.time
  );
}

function candleTimeMs(candle){
  return safeDateMs(
    candle &&
    candle.time
  );
}

function timeframeMilliseconds(minutes){
  return (
    Math.max(
      1,
      safeInteger(
        minutes,
        1
      )
    ) *
    60_000
  );
}

function isCandleClosed(
  candle,
  timeframeMinutes,
  nowMs = Date.now()
){
  const openTime =
    candleTimeMs(
      candle
    );

  if(openTime == null){
    return false;
  }

  return (
    openTime +
    timeframeMilliseconds(
      timeframeMinutes
    ) <=
    nowMs
  );
}

function closedCandlesOnly(
  candles,
  timeframeMinutes,
  nowMs = Date.now()
){
  return normalizeCandles(
    candles
  ).filter(
    candle=>
      isCandleClosed(
        candle,
        timeframeMinutes,
        nowMs
      )
  );
}

function closeRowsFromCandles(candles){
  return normalizeCandles(
    candles
  ).map(
    candle=>({
      date:
        candle.time.slice(
          0,
          10
        ),

      close:
        candle.close
    })
  );
}

// ════════════════════════════════════════════════════════════════
// CLOCK-ALIGNED CANDLE AGGREGATION
//
// Unlike grouping by array position, this groups candles by actual
// UTC clock boundaries.
//
// Example:
//
// - 10:00, 10:05 and 10:10 belong to the same M15 candle.
// - 10:15 starts the next M15 candle.
// ════════════════════════════════════════════════════════════════

function alignedBucketStartMs(
  timestampMs,
  timeframeMinutes
){
  const intervalMs =
    timeframeMilliseconds(
      timeframeMinutes
    );

  return (
    Math.floor(
      timestampMs /
      intervalMs
    ) *
    intervalMs
  );
}

function aggregateCandlesAligned(
  sourceCandles,
  sourceTimeframeMinutes,
  targetTimeframeMinutes,
  {
    closedOnly = true,
    nowMs = Date.now(),
    requireCompleteBuckets = true
  } = {}
){
  const sourceMinutes =
    Math.max(
      1,
      safeInteger(
        sourceTimeframeMinutes,
        5
      )
    );

  const targetMinutes =
    Math.max(
      sourceMinutes,
      safeInteger(
        targetTimeframeMinutes,
        sourceMinutes
      )
    );

  if(
    targetMinutes %
      sourceMinutes !==
    0
  ){
    throw new Error(
      `Cannot aggregate ${sourceMinutes}m candles into ${targetMinutes}m candles`
    );
  }

  const requiredCount =
    targetMinutes /
    sourceMinutes;

  const normalized =
    normalizeCandles(
      sourceCandles
    );

  const source =
    closedOnly
      ? normalized.filter(
          candle=>
            isCandleClosed(
              candle,
              sourceMinutes,
              nowMs
            )
        )
      : normalized;

  const buckets =
    new Map();

  for(const candle of source){
    const timeMs =
      candleTimeMs(
        candle
      );

    if(timeMs == null){
      continue;
    }

    const bucketStart =
      alignedBucketStartMs(
        timeMs,
        targetMinutes
      );

    if(
      !buckets.has(
        bucketStart
      )
    ){
      buckets.set(
        bucketStart,
        []
      );
    }

    buckets.get(
      bucketStart
    ).push(
      candle
    );
  }

  const output =
    [];

  for(
    const [
      bucketStart,
      bucketCandles
    ]
    of Array.from(
      buckets.entries()
    ).sort(
      (first, second)=>
        first[0] -
        second[0]
    )
  ){
    const ordered =
      sortByTimestampAscending(
        bucketCandles,
        candle=>
          candle.time
      );

    if(
      requireCompleteBuckets &&
      ordered.length <
        requiredCount
    ){
      continue;
    }

    const bucketEnd =
      bucketStart +
      timeframeMilliseconds(
        targetMinutes
      );

    if(
      closedOnly &&
      bucketEnd >
        nowMs
    ){
      continue;
    }

    const first =
      ordered[0];

    const last =
      ordered[
        ordered.length -
        1
      ];

    output.push({
      time:
        new Date(
          bucketStart
        ).toISOString(),

      open:
        first.open,

      high:
        Math.max(
          ...ordered.map(
            candle=>
              candle.high
          )
        ),

      low:
        Math.min(
          ...ordered.map(
            candle=>
              candle.low
          )
        ),

      close:
        last.close,

      volume:
        ordered.every(
          candle=>
            candle.volume != null
        )
          ? ordered.reduce(
              (sum, candle)=>
                sum +
                candle.volume,
              0
            )
          : null,

      sourceCount:
        ordered.length,

      complete:
        ordered.length >=
        requiredCount
    });
  }

  return output;
}

/*
 * Backward-compatible helper used by some existing rendering functions.
 *
 * Part 3 will use aggregateCandlesAligned() directly for the scalp engine.
 */
function aggregateCandles(
  candles,
  groupSize
){
  const safeGroupSize =
    Math.max(
      1,
      safeInteger(
        groupSize,
        1
      )
    );

  if(safeGroupSize === 1){
    return normalizeCandles(
      candles
    );
  }

  return aggregateCandlesAligned(
    candles,
    5,
    safeGroupSize * 5,
    {
      closedOnly:true,
      requireCompleteBuckets:true
    }
  );
}

// ════════════════════════════════════════════════════════════════
// EMA
// ════════════════════════════════════════════════════════════════

function emaSeries(
  values,
  period
){
  const numericValues =
    safeArray(values)
      .map(
        value=>
          safeNumber(
            value,
            null
          )
      );

  const safePeriod =
    Math.max(
      1,
      safeInteger(
        period,
        1
      )
    );

  const output =
    new Array(
      numericValues.length
    ).fill(null);

  if(
    numericValues.length <
      safePeriod
  ){
    return output;
  }

  const seedValues =
    numericValues.slice(
      0,
      safePeriod
    );

  if(
    seedValues.some(
      value=>
        value == null
    )
  ){
    return output;
  }

  const multiplier =
    2 /
    (
      safePeriod +
      1
    );

  let previous =
    seedValues.reduce(
      (sum, value)=>
        sum +
        value,
      0
    ) /
    safePeriod;

  output[
    safePeriod -
    1
  ] =
    previous;

  for(
    let index =
      safePeriod;

    index <
      numericValues.length;

    index += 1
  ){
    const value =
      numericValues[index];

    if(value == null){
      output[index] =
        previous;

      continue;
    }

    previous =
      value *
      multiplier +
      previous *
      (
        1 -
        multiplier
      );

    output[index] =
      previous;
  }

  return output;
}

// ════════════════════════════════════════════════════════════════
// RSI — WILDER SMOOTHING
// ════════════════════════════════════════════════════════════════

function rsiSeries(
  values,
  period = 14
){
  const numericValues =
    safeArray(values)
      .map(
        value=>
          safeNumber(
            value,
            null
          )
      );

  const safePeriod =
    Math.max(
      2,
      safeInteger(
        period,
        14
      )
    );

  const output =
    new Array(
      numericValues.length
    ).fill(null);

  if(
    numericValues.length <=
      safePeriod
  ){
    return output;
  }

  let gainSum =
    0;

  let lossSum =
    0;

  for(
    let index = 1;
    index <= safePeriod;
    index += 1
  ){
    const current =
      numericValues[index];

    const previous =
      numericValues[
        index -
        1
      ];

    if(
      current == null ||
      previous == null
    ){
      return output;
    }

    const difference =
      current -
      previous;

    if(difference >= 0){
      gainSum +=
        difference;
    }else{
      lossSum +=
        Math.abs(
          difference
        );
    }
  }

  let averageGain =
    gainSum /
    safePeriod;

  let averageLoss =
    lossSum /
    safePeriod;

  output[safePeriod] =
    averageLoss === 0
      ? 100
      : 100 -
        100 /
        (
          1 +
          averageGain /
          averageLoss
        );

  for(
    let index =
      safePeriod +
      1;

    index <
      numericValues.length;

    index += 1
  ){
    const current =
      numericValues[index];

    const previous =
      numericValues[
        index -
        1
      ];

    if(
      current == null ||
      previous == null
    ){
      output[index] =
        output[
          index -
          1
        ];

      continue;
    }

    const difference =
      current -
      previous;

    const gain =
      difference > 0
        ? difference
        : 0;

    const loss =
      difference < 0
        ? Math.abs(
            difference
          )
        : 0;

    averageGain =
      (
        averageGain *
        (
          safePeriod -
          1
        ) +
        gain
      ) /
      safePeriod;

    averageLoss =
      (
        averageLoss *
        (
          safePeriod -
          1
        ) +
        loss
      ) /
      safePeriod;

    output[index] =
      averageLoss === 0
        ? 100
        : 100 -
          100 /
          (
            1 +
            averageGain /
            averageLoss
          );
  }

  return output;
}

// ════════════════════════════════════════════════════════════════
// MACD
// ════════════════════════════════════════════════════════════════

function computeMACD(
  values,
  fastPeriod = 12,
  slowPeriod = 26,
  signalPeriod = 9
){
  const fast =
    emaSeries(
      values,
      fastPeriod
    );

  const slow =
    emaSeries(
      values,
      slowPeriod
    );

  const macdLine =
    safeArray(values).map(
      (_, index)=>{
        if(
          fast[index] == null ||
          slow[index] == null
        ){
          return null;
        }

        return (
          fast[index] -
          slow[index]
        );
      }
    );

  const compactMacd =
    macdLine.filter(
      value=>
        value != null
    );

  const compactSignal =
    emaSeries(
      compactMacd,
      signalPeriod
    );

  const signalLine =
    new Array(
      macdLine.length
    ).fill(null);

  let compactIndex =
    0;

  for(
    let index = 0;
    index < macdLine.length;
    index += 1
  ){
    if(
      macdLine[index] == null
    ){
      continue;
    }

    signalLine[index] =
      compactSignal[
        compactIndex
      ];

    compactIndex += 1;
  }

  const histogram =
    macdLine.map(
      (value, index)=>{
        if(
          value == null ||
          signalLine[index] == null
        ){
          return null;
        }

        return (
          value -
          signalLine[index]
        );
      }
    );

  return {
    macdLine,
    signalLine,
    histogram,

    lastMacd:
      macdLine[
        macdLine.length -
        1
      ] ??
      null,

    lastSignal:
      signalLine[
        signalLine.length -
        1
      ] ??
      null,

    lastHistogram:
      histogram[
        histogram.length -
        1
      ] ??
      null
  };
}

// ════════════════════════════════════════════════════════════════
// TRUE RANGE AND ATR
// ════════════════════════════════════════════════════════════════

function trueRangeSeries(candles){
  const normalized =
    normalizeCandles(
      candles
    );

  const output =
    new Array(
      normalized.length
    ).fill(null);

  if(!normalized.length){
    return output;
  }

  output[0] =
    normalized[0].high -
    normalized[0].low;

  for(
    let index = 1;
    index < normalized.length;
    index += 1
  ){
    const current =
      normalized[index];

    const previous =
      normalized[
        index -
        1
      ];

    output[index] =
      Math.max(
        current.high -
        current.low,

        Math.abs(
          current.high -
          previous.close
        ),

        Math.abs(
          current.low -
          previous.close
        )
      );
  }

  return output;
}

function atrSeries(
  candles,
  period = 14
){
  const trueRanges =
    trueRangeSeries(
      candles
    );

  const safePeriod =
    Math.max(
      2,
      safeInteger(
        period,
        14
      )
    );

  const output =
    new Array(
      trueRanges.length
    ).fill(null);

  if(
    trueRanges.length <
      safePeriod
  ){
    return output;
  }

  let initialSum =
    0;

  for(
    let index = 0;
    index < safePeriod;
    index += 1
  ){
    initialSum +=
      trueRanges[index];
  }

  let previousATR =
    initialSum /
    safePeriod;

  output[
    safePeriod -
    1
  ] =
    previousATR;

  for(
    let index =
      safePeriod;

    index <
      trueRanges.length;

    index += 1
  ){
    previousATR =
      (
        previousATR *
        (
          safePeriod -
          1
        ) +
        trueRanges[index]
      ) /
      safePeriod;

    output[index] =
      previousATR;
  }

  return output;
}

function computeATR(
  candles,
  period = 14
){
  const series =
    atrSeries(
      candles,
      period
    );

  return (
    series[
      series.length -
      1
    ] ??
    null
  );
}

// ════════════════════════════════════════════════════════════════
// ADX
// ════════════════════════════════════════════════════════════════

function computeADX(
  candles,
  period = 14
){
  const normalized =
    normalizeCandles(
      candles
    );

  const safePeriod =
    Math.max(
      2,
      safeInteger(
        period,
        14
      )
    );

  if(
    normalized.length <
      safePeriod * 2 +
      1
  ){
    return null;
  }

  const trueRanges =
    [];

  const positiveDM =
    [];

  const negativeDM =
    [];

  for(
    let index = 1;
    index < normalized.length;
    index += 1
  ){
    const current =
      normalized[index];

    const previous =
      normalized[
        index -
        1
      ];

    trueRanges.push(
      Math.max(
        current.high -
        current.low,

        Math.abs(
          current.high -
          previous.close
        ),

        Math.abs(
          current.low -
          previous.close
        )
      )
    );

    const upwardMove =
      current.high -
      previous.high;

    const downwardMove =
      previous.low -
      current.low;

    positiveDM.push(
      upwardMove >
        downwardMove &&
      upwardMove > 0
        ? upwardMove
        : 0
    );

    negativeDM.push(
      downwardMove >
        upwardMove &&
      downwardMove > 0
        ? downwardMove
        : 0
    );
  }

  let smoothedTR =
    trueRanges
      .slice(
        0,
        safePeriod
      )
      .reduce(
        (sum, value)=>
          sum +
          value,
        0
      );

  let smoothedPositiveDM =
    positiveDM
      .slice(
        0,
        safePeriod
      )
      .reduce(
        (sum, value)=>
          sum +
          value,
        0
      );

  let smoothedNegativeDM =
    negativeDM
      .slice(
        0,
        safePeriod
      )
      .reduce(
        (sum, value)=>
          sum +
          value,
        0
      );

  const dxValues =
    [];

  for(
    let index =
      safePeriod;

    index <
      trueRanges.length;

    index += 1
  ){
    smoothedTR =
      smoothedTR -
      smoothedTR /
      safePeriod +
      trueRanges[index];

    smoothedPositiveDM =
      smoothedPositiveDM -
      smoothedPositiveDM /
      safePeriod +
      positiveDM[index];

    smoothedNegativeDM =
      smoothedNegativeDM -
      smoothedNegativeDM /
      safePeriod +
      negativeDM[index];

    const positiveDI =
      smoothedTR === 0
        ? 0
        : 100 *
          (
            smoothedPositiveDM /
            smoothedTR
          );

    const negativeDI =
      smoothedTR === 0
        ? 0
        : 100 *
          (
            smoothedNegativeDM /
            smoothedTR
          );

    const denominator =
      positiveDI +
      negativeDI;

    dxValues.push(
      denominator === 0
        ? 0
        : 100 *
          Math.abs(
            positiveDI -
            negativeDI
          ) /
          denominator
    );
  }

  if(
    dxValues.length <
      safePeriod
  ){
    return null;
  }

  let adx =
    dxValues
      .slice(
        0,
        safePeriod
      )
      .reduce(
        (sum, value)=>
          sum +
          value,
        0
      ) /
    safePeriod;

  for(
    let index =
      safePeriod;

    index <
      dxValues.length;

    index += 1
  ){
    adx =
      (
        adx *
        (
          safePeriod -
          1
        ) +
        dxValues[index]
      ) /
      safePeriod;
  }

  return adx;
}

// ════════════════════════════════════════════════════════════════
// CLOSE-BASED VOLATILITY FALLBACK
// ════════════════════════════════════════════════════════════════

function computeVolatility(rows){
  const closes =
    safeArray(rows)
      .map(
        row=>
          safeNumber(
            row &&
            row.close,
            null
          )
      )
      .filter(
        value=>
          value != null
      );

  if(closes.length < 3){
    return 0.004;
  }

  let total =
    0;

  let count =
    0;

  for(
    let index = 1;
    index < closes.length;
    index += 1
  ){
    const previous =
      closes[
        index -
        1
      ];

    if(previous <= 0){
      continue;
    }

    total +=
      Math.abs(
        closes[index] -
        previous
      ) /
      previous;

    count += 1;
  }

  return count
    ? total /
      count
    : 0.004;
}

// ════════════════════════════════════════════════════════════════
// SWING-POINT DETECTION
// ════════════════════════════════════════════════════════════════

function detectSwingPoints(
  values,
  radius = 2
){
  const numericValues =
    safeArray(values)
      .map(
        value=>
          safeNumber(
            value,
            null
          )
      );

  const safeRadius =
    Math.max(
      1,
      safeInteger(
        radius,
        2
      )
    );

  const highs =
    [];

  const lows =
    [];

  for(
    let index =
      safeRadius;

    index <
      numericValues.length -
      safeRadius;

    index += 1
  ){
    const value =
      numericValues[index];

    if(value == null){
      continue;
    }

    let isHigh =
      true;

    let isLow =
      true;

    for(
      let offset = 1;
      offset <= safeRadius;
      offset += 1
    ){
      const left =
        numericValues[
          index -
          offset
        ];

      const right =
        numericValues[
          index +
          offset
        ];

      if(
        left == null ||
        right == null
      ){
        isHigh = false;
        isLow = false;
        break;
      }

      if(
        value <
          left ||
        value <
          right
      ){
        isHigh = false;
      }

      if(
        value >
          left ||
        value >
          right
      ){
        isLow = false;
      }
    }

    if(isHigh){
      highs.push({
        index,
        value
      });
    }

    if(isLow){
      lows.push({
        index,
        value
      });
    }
  }

  return {
    highs,
    lows
  };
}

// ════════════════════════════════════════════════════════════════
// SUPPORT AND RESISTANCE
// ════════════════════════════════════════════════════════════════

function deduplicatePriceLevels(
  levels,
  thresholdRatio = 0.0015
){
  const sorted =
    safeArray(levels)
      .map(
        value=>
          safeNumber(
            value,
            null
          )
      )
      .filter(
        value=>
          value != null &&
          value > 0
      )
      .sort(
        (first, second)=>
          first -
          second
      );

  const output =
    [];

  for(const value of sorted){
    if(!output.length){
      output.push(value);
      continue;
    }

    const previous =
      output[
        output.length -
        1
      ];

    const relativeDistance =
      Math.abs(
        value -
        previous
      ) /
      value;

    if(
      relativeDistance >
        thresholdRatio
    ){
      output.push(value);
    }else{
      output[
        output.length -
        1
      ] =
        (
          previous +
          value
        ) /
        2;
    }
  }

  return output;
}

function computeSR(
  rows,
  lastClose
){
  const closes =
    safeArray(rows)
      .map(
        row=>
          safeNumber(
            row &&
            row.close,
            null
          )
      )
      .filter(
        value=>
          value != null
      );

  const currentPrice =
    safeNumber(
      lastClose,
      closes[
        closes.length -
        1
      ] ??
      null
    );

  if(
    currentPrice == null ||
    !closes.length
  ){
    return {
      resistances:[],
      supports:[]
    };
  }

  const radius =
    closes.length > 80
      ? 3
      : closes.length > 40
        ? 2
        : 1;

  const swings =
    detectSwingPoints(
      closes,
      radius
    );

  let resistances =
    deduplicatePriceLevels(
      swings.highs.map(
        point=>
          point.value
      )
    )
      .filter(
        level=>
          level >
          currentPrice
      )
      .sort(
        (first, second)=>
          first -
          second
      )
      .slice(
        0,
        3
      );

  let supports =
    deduplicatePriceLevels(
      swings.lows.map(
        point=>
          point.value
      )
    )
      .filter(
        level=>
          level <
          currentPrice
      )
      .sort(
        (first, second)=>
          second -
          first
      )
      .slice(
        0,
        3
      );

  if(
    !resistances.length &&
    closes.length >= 3
  ){
    const maximumClose =
      Math.max(
        ...closes
      );

    if(
      maximumClose >
      currentPrice *
      1.0005
    ){
      resistances = [
        maximumClose
      ];
    }
  }

  if(
    !supports.length &&
    closes.length >= 3
  ){
    const minimumClose =
      Math.min(
        ...closes
      );

    if(
      minimumClose <
      currentPrice *
      0.9995
    ){
      supports = [
        minimumClose
      ];
    }
  }

  return {
    resistances,
    supports
  };
}

function computeCandleSR(
  candles,
  lastClose
){
  const normalized =
    normalizeCandles(
      candles
    );

  if(
    normalized.length <
      5
  ){
    return {
      resistances:[],
      supports:[]
    };
  }

  const currentPrice =
    safeNumber(
      lastClose,
      normalized[
        normalized.length -
        1
      ].close
    );

  const radius =
    normalized.length > 100
      ? 3
      : 2;

  const highValues =
    normalized.map(
      candle=>
        candle.high
    );

  const lowValues =
    normalized.map(
      candle=>
        candle.low
    );

  const highSwings =
    detectSwingPoints(
      highValues,
      radius
    ).highs;

  const lowSwings =
    detectSwingPoints(
      lowValues,
      radius
    ).lows;

  const resistances =
    deduplicatePriceLevels(
      highSwings.map(
        point=>
          point.value
      )
    )
      .filter(
        level=>
          level >
          currentPrice
      )
      .sort(
        (first, second)=>
          first -
          second
      )
      .slice(
        0,
        3
      );

  const supports =
    deduplicatePriceLevels(
      lowSwings.map(
        point=>
          point.value
      )
    )
      .filter(
        level=>
          level <
          currentPrice
      )
      .sort(
        (first, second)=>
          second -
          first
      )
      .slice(
        0,
        3
      );

  return {
    resistances,
    supports
  };
}

function detectSRVote(
  supportResistance,
  lastClose
){
  const sr =
    supportResistance ||
    {
      resistances:[],
      supports:[]
    };

  const price =
    safeNumber(
      lastClose,
      null
    );

  if(price == null){
    return {
      vote:null,
      detail:"Current price is unavailable"
    };
  }

  const nearestResistance =
    safeNumber(
      sr.resistances &&
      sr.resistances[0],
      null
    );

  const nearestSupport =
    safeNumber(
      sr.supports &&
      sr.supports[0],
      null
    );

  const distanceToResistance =
    nearestResistance == null
      ? null
      : (
          nearestResistance -
          price
        ) /
        price;

  const distanceToSupport =
    nearestSupport == null
      ? null
      : (
          price -
          nearestSupport
        ) /
        price;

  const resistanceRoom =
    distanceToResistance == null ||
    distanceToResistance >=
      0.003;

  const supportRoom =
    distanceToSupport == null ||
    distanceToSupport >=
      0.003;

  const resistanceText =
    distanceToResistance == null
      ? "no nearby resistance"
      : `resistance ${(distanceToResistance * 100).toFixed(2)}% away`;

  const supportText =
    distanceToSupport == null
      ? "no nearby support"
      : `support ${(distanceToSupport * 100).toFixed(2)}% away`;

  if(
    resistanceRoom &&
    !supportRoom
  ){
    return {
      vote:"BUY",
      detail:
        `Upside has clearer room: ${resistanceText}; ${supportText}`
    };
  }

  if(
    supportRoom &&
    !resistanceRoom
  ){
    return {
      vote:"SELL",
      detail:
        `Downside has clearer room: ${supportText}; ${resistanceText}`
    };
  }

  if(
    resistanceRoom &&
    supportRoom
  ){
    const upsideRoom =
      distanceToResistance == null
        ? Infinity
        : distanceToResistance;

    const downsideRoom =
      distanceToSupport == null
        ? Infinity
        : distanceToSupport;

    if(upsideRoom === downsideRoom){
      return {
        vote:null,
        detail:
          `Room is balanced: ${resistanceText}; ${supportText}`
      };
    }

    return upsideRoom >
      downsideRoom
      ? {
          vote:"BUY",
          detail:
            `More room above than below: ${resistanceText}; ${supportText}`
        }
      : {
          vote:"SELL",
          detail:
            `More room below than above: ${supportText}; ${resistanceText}`
        };
  }

  return {
    vote:null,
    detail:
      `Price is compressed between nearby levels: ${resistanceText}; ${supportText}`
  };
}

// ════════════════════════════════════════════════════════════════
// MARKET STRUCTURE
// ════════════════════════════════════════════════════════════════

function computeMarketStructure(rows){
  const closes =
    safeArray(rows)
      .map(
        row=>
          safeNumber(
            row &&
            row.close,
            null
          )
      )
      .filter(
        value=>
          value != null
      );

  if(closes.length < 10){
    return {
      direction:null,
      label:"Building history — not enough sessions",
      score:0,
      confidence:0
    };
  }

  const radius =
    closes.length > 80
      ? 3
      : closes.length > 30
        ? 2
        : 1;

  const swings =
    detectSwingPoints(
      closes,
      radius
    );

  if(
    swings.highs.length < 2 ||
    swings.lows.length < 2
  ){
    return {
      direction:null,
      label:"Not enough confirmed swing points",
      score:0,
      confidence:20
    };
  }

  const latestHighs =
    swings.highs.slice(-2);

  const latestLows =
    swings.lows.slice(-2);

  const higherHigh =
    latestHighs[1].value >
    latestHighs[0].value;

  const higherLow =
    latestLows[1].value >
    latestLows[0].value;

  if(
    higherHigh &&
    higherLow
  ){
    return {
      direction:"BUY",
      label:"Bullish structure — higher high and higher low",
      score:15,
      confidence:85
    };
  }

  if(
    !higherHigh &&
    !higherLow
  ){
    return {
      direction:"SELL",
      label:"Bearish structure — lower high and lower low",
      score:-15,
      confidence:85
    };
  }

  return {
    direction:null,
    label:"Mixed structure — swing sequence is not aligned",
    score:0,
    confidence:40
  };
}

function computeCandleMarketStructure(candles){
  const normalized =
    normalizeCandles(
      candles
    );

  if(normalized.length < 12){
    return {
      direction:null,
      label:"Not enough candle structure",
      score:0,
      confidence:0
    };
  }

  const radius =
    normalized.length > 100
      ? 3
      : 2;

  const highSwings =
    detectSwingPoints(
      normalized.map(
        candle=>
          candle.high
      ),
      radius
    ).highs;

  const lowSwings =
    detectSwingPoints(
      normalized.map(
        candle=>
          candle.low
      ),
      radius
    ).lows;

  if(
    highSwings.length < 2 ||
    lowSwings.length < 2
  ){
    return {
      direction:null,
      label:"Not enough confirmed candle swings",
      score:0,
      confidence:20
    };
  }

  const latestHighs =
    highSwings.slice(-2);

  const latestLows =
    lowSwings.slice(-2);

  const higherHigh =
    latestHighs[1].value >
    latestHighs[0].value;

  const higherLow =
    latestLows[1].value >
    latestLows[0].value;

  if(
    higherHigh &&
    higherLow
  ){
    return {
      direction:"BUY",
      label:"Bullish HH/HL structure",
      score:15,
      confidence:90
    };
  }

  if(
    !higherHigh &&
    !higherLow
  ){
    return {
      direction:"SELL",
      label:"Bearish LH/LL structure",
      score:-15,
      confidence:90
    };
  }

  return {
    direction:null,
    label:"Mixed candle structure",
    score:0,
    confidence:40
  };
}

// ════════════════════════════════════════════════════════════════
// FIBONACCI LEVELS
// ════════════════════════════════════════════════════════════════

function computeFibLevels(rows){
  const closes =
    safeArray(rows)
      .map(
        row=>
          safeNumber(
            row &&
            row.close,
            null
          )
      )
      .filter(
        value=>
          value != null
      );

  if(closes.length < 5){
    return null;
  }

  const lookback =
    Math.min(
      closes.length,
      90
    );

  const recent =
    closes.slice(
      closes.length -
      lookback
    );

  const high =
    Math.max(
      ...recent
    );

  const low =
    Math.min(
      ...recent
    );

  if(high === low){
    return null;
  }

  const difference =
    high -
    low;

  return {
    high,
    low,
    lookback,

    levels:[
      {
        label:"23.6%",
        value:
          high -
          difference *
          0.236
      },

      {
        label:"38.2%",
        value:
          high -
          difference *
          0.382
      },

      {
        label:"50.0%",
        value:
          high -
          difference *
          0.5
      },

      {
        label:"61.8%",
        value:
          high -
          difference *
          0.618
      },

      {
        label:"78.6%",
        value:
          high -
          difference *
          0.786
      }
    ]
  };
}

// ════════════════════════════════════════════════════════════════
// CANDLE-PATTERN DETECTION
// ════════════════════════════════════════════════════════════════

function candleBodySize(candle){
  return Math.abs(
    candle.close -
    candle.open
  );
}

function candleRange(candle){
  return Math.max(
    0,
    candle.high -
    candle.low
  );
}

function candleBodyRatio(candle){
  const range =
    candleRange(
      candle
    );

  return range > 0
    ? candleBodySize(
        candle
      ) /
      range
    : 0;
}

function detectCandleVote(candles){
  const normalized =
    normalizeCandles(
      candles
    );

  if(normalized.length < 2){
    return {
      vote:null,
      pattern:null,
      strength:0,
      detail:"Not enough candle history"
    };
  }

  const latest =
    normalized[
      normalized.length -
      1
    ];

  const previous =
    normalized[
      normalized.length -
      2
    ];

  const latestRange =
    candleRange(
      latest
    );

  const latestBody =
    candleBodySize(
      latest
    );

  const latestBodyRatio =
    candleBodyRatio(
      latest
    );

  const upperWick =
    latest.high -
    Math.max(
      latest.open,
      latest.close
    );

  const lowerWick =
    Math.min(
      latest.open,
      latest.close
    ) -
    latest.low;

  const bullishEngulfing =
    previous.close <
      previous.open &&
    latest.close >
      latest.open &&
    latest.open <=
      previous.close &&
    latest.close >=
      previous.open;

  const bearishEngulfing =
    previous.close >
      previous.open &&
    latest.close <
      latest.open &&
    latest.open >=
      previous.close &&
    latest.close <=
      previous.open;

  if(bullishEngulfing){
    return {
      vote:"BUY",
      pattern:"Bullish engulfing",
      strength:90,
      detail:"Latest candle fully engulfed the previous bearish body"
    };
  }

  if(bearishEngulfing){
    return {
      vote:"SELL",
      pattern:"Bearish engulfing",
      strength:90,
      detail:"Latest candle fully engulfed the previous bullish body"
    };
  }

  const hammer =
    latestRange > 0 &&
    lowerWick >=
      latestBody *
      2 &&
    upperWick <=
      latestBody &&
    latest.close >
      latest.low +
      latestRange *
      0.55;

  if(hammer){
    return {
      vote:"BUY",
      pattern:"Hammer rejection",
      strength:75,
      detail:"Long lower wick shows rejection of lower prices"
    };
  }

  const shootingStar =
    latestRange > 0 &&
    upperWick >=
      latestBody *
      2 &&
    lowerWick <=
      latestBody &&
    latest.close <
      latest.low +
      latestRange *
      0.45;

  if(shootingStar){
    return {
      vote:"SELL",
      pattern:"Shooting-star rejection",
      strength:75,
      detail:"Long upper wick shows rejection of higher prices"
    };
  }

  if(
    latest.close >
      latest.open &&
    latestBodyRatio >=
      0.65
  ){
    return {
      vote:"BUY",
      pattern:"Strong bullish candle",
      strength:
        Math.round(
          latestBodyRatio *
          100
        ),
      detail:
        `Bullish body is ${(latestBodyRatio * 100).toFixed(0)}% of the candle range`
    };
  }

  if(
    latest.close <
      latest.open &&
    latestBodyRatio >=
      0.65
  ){
    return {
      vote:"SELL",
      pattern:"Strong bearish candle",
      strength:
        Math.round(
          latestBodyRatio *
          100
        ),
      detail:
        `Bearish body is ${(latestBodyRatio * 100).toFixed(0)}% of the candle range`
    };
  }

  return {
    vote:null,
    pattern:null,
    strength:0,
    detail:"Latest candle has no decisive directional pattern"
  };
}

// ════════════════════════════════════════════════════════════════
// TREND DIRECTION
// ════════════════════════════════════════════════════════════════

function adaptiveEMAPeriods(
  rowCount
){
  const cap =
    Math.max(
      2,
      rowCount -
      1
    );

  const period200 =
    Math.min(
      200,
      cap
    );

  const period100 =
    Math.min(
      100,
      Math.max(
        4,
        Math.floor(
          period200 *
          0.5
        )
      )
    );

  const period50 =
    Math.min(
      50,
      Math.max(
        3,
        Math.floor(
          period100 *
          0.6
        )
      )
    );

  const period20 =
    Math.min(
      20,
      Math.max(
        2,
        Math.floor(
          period50 *
          0.5
        )
      )
    );

  return {
    period20,
    period50,
    period100,
    period200,
    fullStack:
      cap >= 200
  };
}

function computeTrendState(rows){
  const closes =
    safeArray(rows)
      .map(
        row=>
          safeNumber(
            row &&
            row.close,
            null
          )
      )
      .filter(
        value=>
          value != null
      );

  if(closes.length < 6){
    return {
      direction:null,
      label:"Building history — not enough sessions",
      strength:0,
      periods:null,
      values:null
    };
  }

  const periods =
    adaptiveEMAPeriods(
      closes.length
    );

  const ema20 =
    emaSeries(
      closes,
      periods.period20
    );

  const ema50 =
    emaSeries(
      closes,
      periods.period50
    );

  const ema100 =
    emaSeries(
      closes,
      periods.period100
    );

  const ema200 =
    emaSeries(
      closes,
      periods.period200
    );

  const lastIndex =
    closes.length -
    1;

  const currentPrice =
    closes[
      lastIndex
    ];

  const value20 =
    ema20[
      lastIndex
    ];

  const value50 =
    ema50[
      lastIndex
    ];

  const value100 =
    ema100[
      lastIndex
    ];

  const value200 =
    ema200[
      lastIndex
    ];

  const values = {
    ema20:value20,
    ema50:value50,
    ema100:value100,
    ema200:value200,
    close:currentPrice
  };

  if(
    value20 == null ||
    value50 == null ||
    value100 == null ||
    value200 == null
  ){
    return {
      direction:null,
      label:"EMA stack is still building",
      strength:0,
      periods,
      values
    };
  }

  const bullishChecks = [
    value20 >
      value50,

    value50 >
      value100,

    value100 >
      value200,

    currentPrice >
      value20
  ];

  const bearishChecks = [
    value20 <
      value50,

    value50 <
      value100,

    value100 <
      value200,

    currentPrice <
      value20
  ];

  const bullishCount =
    bullishChecks.filter(Boolean)
      .length;

  const bearishCount =
    bearishChecks.filter(Boolean)
      .length;

  const periodLabel =
    `${periods.period20}/${periods.period50}/${periods.period100}/${periods.period200}`;

  const adaptiveNote =
    periods.fullStack
      ? ""
      : " · adaptive periods until full EMA200 history is available";

  if(bullishCount === 4){
    return {
      direction:"BUY",
      label:
        `Bullish full EMA stack (${periodLabel})${adaptiveNote}`,
      strength:100,
      periods,
      values
    };
  }

  if(bearishCount === 4){
    return {
      direction:"SELL",
      label:
        `Bearish full EMA stack (${periodLabel})${adaptiveNote}`,
      strength:100,
      periods,
      values
    };
  }

  if(bullishCount >= 3){
    return {
      direction:null,
      lean:"BUY",
      label:
        `Partial bullish alignment (${bullishCount}/4)${adaptiveNote}`,
      strength:
        bullishCount *
        25,
      periods,
      values
    };
  }

  if(bearishCount >= 3){
    return {
      direction:null,
      lean:"SELL",
      label:
        `Partial bearish alignment (${bearishCount}/4)${adaptiveNote}`,
      strength:
        bearishCount *
        25,
      periods,
      values
    };
  }

  return {
    direction:null,
    lean:null,
    label:
      `Mixed EMA alignment (${periodLabel})${adaptiveNote}`,
    strength:
      Math.max(
        bullishCount,
        bearishCount
      ) *
      25,
    periods,
    values
  };
}

function trendDirectionOf(rows){
  return computeTrendState(
    rows
  ).direction;
}

// ════════════════════════════════════════════════════════════════
// NEWS CONFLICT CHECK
// ════════════════════════════════════════════════════════════════

function evaluateNewsConflict(
  pairLabel,
  direction
){
  if(
    direction !== "BUY" &&
    direction !== "SELL"
  ){
    return {
      pass:false,
      conflicting:null,
      score:0,
      detail:"No direction is available for news comparison"
    };
  }

  const relevantNews =
    newsItemsFor(
      pairLabel
    );

  const conflicting =
    relevantNews.find(
      item=>
        item.impact === "high" &&
        (
          (
            direction === "BUY" &&
            item.sentiment <= -10
          ) ||
          (
            direction === "SELL" &&
            item.sentiment >= 10
          )
        )
    );

  const aggregateScore =
    relevantNews.reduce(
      (sum, item)=>
        sum +
        safeNumber(
          item.sentiment,
          0
        ),
      0
    );

  if(conflicting){
    return {
      pass:false,
      conflicting,
      score:
        aggregateScore,

      detail:
        `Conflicting high-impact headline: "${truncateText(conflicting.text,90)}" (${conflicting.source})`
    };
  }

  const highImpactCount =
    relevantNews.filter(
      item=>
        item.impact === "high"
    ).length;

  return {
    pass:true,
    conflicting:null,
    score:
      aggregateScore,

    detail:
      highImpactCount
        ? `${highImpactCount} high-impact headline${highImpactCount === 1 ? "" : "s"} tracked; none conflict with ${direction}`
        : "No conflicting high-impact news is currently flagged"
  };
}

// PROFESSIONAL DAILY / INTRADAY / SWING ANALYSIS

function analyze(

  pairLabel,

){

    normalizeCloseRows(
      inputRows
    );

  const ohlcRows =
    inputOHLCRows
      ? normalizeCandles(
          inputOHLCRows
        )
      : null;

  const pipeline =
    [];

  if(rows.length < 6){
    return {
      rows,
      lastClose:null,
      n:rows.length,
      pipeline:[
        {
          name:"Data Validation",
          status:"fail",
          detail:"Not enough valid price history for analysis"
        }
      ],
      trendLabel:"Not enough valid history",
      emaInfo:null,
      leanDirection:null,
      lastRsi:null,
      rsiP:14,
      macdOk:false,
      structure:{
        direction:null,
        label:"Not enough data",
        score:0,
        confidence:0
      },
      sr:{
        resistances:[],
        supports:[]
      },
      newsScore:0,
      confidence:null,
      signal:"HOLD",
      suppressionReason:"NO TRADE — not enough valid market history",
      tradePlan:null,
      passCount:0,
      gatedCount:0,
      votes:[]
    };
  }

  const closes =
    rows.map(
      row=>
        row.close
    );

  const lastClose =
    closes[
      closes.length -
      1
    ];

  function addStep(
    name,
    status,
    detail
  ){
    pipeline.push({
      name,
      status,
      detail
    });
  }

  addStep(
    "Data Validation",
    "pass",
    `${rows.length} valid price rows available`
  );

  // ── Trend / EMA stack ──────────────────────────────────────

  const trendState =
    computeTrendState(
      rows
    );

  const leanDirection =
    trendState.direction;

  addStep(
    "Trend",
    leanDirection
      ? "pass"
      : "fail",
    trendState.label
  );

  addStep(
    "EMA Alignment",
    leanDirection
      ? "pass"
      : "fail",
    leanDirection
      ? `Full EMA stack confirms ${leanDirection}`
      : "A complete directional EMA stack is not present"
  );

  // ── ADX ────────────────────────────────────────────────────

  const adxValue =
    ohlcRows
      ? computeADX(
          ohlcRows,
          14
        )
      : null;

  if(adxValue != null){
    addStep(
      "ADX Trend Strength",
      adxValue >= 20
        ? "pass"
        : "na",
      `ADX(14) = ${adxValue.toFixed(1)} · ${
        adxValue >= 25
          ? "strong trend"
          : adxValue >= 20
            ? "developing trend"
            : "weak/ranging conditions"
      }`
    );
  }else{
    addStep(
      "ADX Trend Strength",
      "na",
      "ADX unavailable because complete OHLC history is not loaded"
    );
  }

  // ── MACD ───────────────────────────────────────────────────

  const macd =
    computeMACD(
      closes
    );

  let macdVote =
    null;

  if(
    macd.lastMacd != null &&
    macd.lastSignal != null
  ){
    if(
      macd.lastMacd >
      macd.lastSignal
    ){
      macdVote =
        "BUY";
    }else if(
      macd.lastMacd <
      macd.lastSignal
    ){
      macdVote =
        "SELL";
    }
  }

  if(macdVote){
    addStep(
      "MACD Confirmation",
      "pass",
      `MACD ${macd.lastMacd.toFixed(5)} vs signal ${macd.lastSignal.toFixed(5)} · confirms ${macdVote}`
    );
  }else{
    addStep(
      "MACD Confirmation",
      "na",
      closes.length < 35
        ? `Needs approximately ${Math.max(0,35 - closes.length)} more rows`
        : "MACD is flat against its signal line"
    );
  }

  // ── RSI ────────────────────────────────────────────────────

  const rsiPeriod =
    Math.min(
      14,
      Math.max(
        4,
        rows.length -
        2
      )
    );

  const rsi =
    rsiSeries(
      closes,
      rsiPeriod
    );

  const lastRsi =
    rsi[
      rsi.length -
      1
    ];

  let rsiVote =
    null;

  if(lastRsi != null){
    if(lastRsi >= 55){
      rsiVote =
        "BUY";
    }else if(lastRsi <= 45){
      rsiVote =
        "SELL";
    }
  }

  if(rsiVote){
    addStep(
      "RSI Confirmation",
      "pass",
      `RSI(${rsiPeriod}) = ${lastRsi.toFixed(1)} · confirms ${rsiVote}`
    );
  }else{
    addStep(
      "RSI Confirmation",
      "na",
      lastRsi == null
        ? "Not enough history for RSI"
        : `RSI(${rsiPeriod}) = ${lastRsi.toFixed(1)} · neutral 45–55 zone`
    );
  }

  // ── Higher timeframe ───────────────────────────────────────

  let higherTimeframeDirection =
    null;

  if(
    higherTimeframeRows == null
  ){
    addStep(
      "Multi-Timeframe Confirmation",
      "na",
      "No higher timeframe is required for this view"
    );
  }else{
    const normalizedHigherTimeframe =
      normalizeCloseRows(
        higherTimeframeRows
      );

    higherTimeframeDirection =
      trendDirectionOf(
        normalizedHigherTimeframe
      );

    if(higherTimeframeDirection){
      addStep(
        "Multi-Timeframe Confirmation",
        "pass",
        `Higher timeframe independently confirms ${higherTimeframeDirection}`
      );
    }else{
      addStep(
        "Multi-Timeframe Confirmation",
        "na",
        "Higher timeframe has no complete directional EMA stack"
      );
    }
  }

  // ── Candle pattern ─────────────────────────────────────────

  let candleVote =
    null;

  let candlePattern =
    null;

  if(
    ohlcRows &&
    ohlcRows.length >= 2
  ){
    const candleResult =
      detectCandleVote(
        ohlcRows
      );

    candleVote =
      candleResult.vote;

    candlePattern =
      candleResult.pattern;

    addStep(
      "Candle Pattern",
      candleVote
        ? "pass"
        : "na",
      candleResult.detail
    );
  }else{
    addStep(
      "Candle Pattern",
      "na",
      "No complete OHLC candle history is available"
    );
  }

  // ── Structure ──────────────────────────────────────────────

  const structure =
    ohlcRows &&
    ohlcRows.length >= 12
      ? computeCandleMarketStructure(
          ohlcRows
        )
      : computeMarketStructure(
          rows
        );

  addStep(
    "Market Structure",
    structure.direction
      ? "pass"
      : "na",
    structure.label
  );

  // ── Support / resistance ───────────────────────────────────

  const supportResistance =
    ohlcRows &&
    ohlcRows.length >= 12
      ? computeCandleSR(
          ohlcRows,
          lastClose
        )
      : computeSR(
          rows,
          lastClose
        );

  const supportResistanceVote =
    detectSRVote(
      supportResistance,
      lastClose
    );

  addStep(
    "Support/Resistance",
    supportResistanceVote.vote
      ? "pass"
      : "na",
    supportResistanceVote.detail
  );

  // ── News ───────────────────────────────────────────────────

  const newsEvaluation =
    evaluateNewsConflict(
      pairLabel,
      leanDirection
    );

  addStep(
    "High-Impact News Filter",
    leanDirection
      ? (
          newsEvaluation.pass
            ? "pass"
            : "fail"
        )
      : "na",
    newsEvaluation.detail
  );

  // ── Directional voting ─────────────────────────────────────

  const votes =
    [];

  function recordVote(
    name,
    vote,
    weight
  ){
    if(
      vote !== "BUY" &&
      vote !== "SELL"
    ){
      return;
    }

    votes.push({
      name,
      vote,
      weight
    });
  }

  recordVote(
    "Trend/EMA",
    leanDirection,
    30
  );

  recordVote(
    "MACD",
    macdVote,
    15
  );

  recordVote(
    "RSI",
    rsiVote,
    10
  );

  recordVote(
    "Higher Timeframe",
    higherTimeframeDirection,
    20
  );

  recordVote(
    "Candle Pattern",
    candleVote,
    10
  );

  recordVote(
    "Market Structure",
    structure.direction,
    10
  );

  recordVote(
    "Support/Resistance",
    supportResistanceVote.vote,
    5
  );

  const buyWeight =
    votes
      .filter(
        vote=>
          vote.vote === "BUY"
      )
      .reduce(
        (sum, vote)=>
          sum +
          vote.weight,
        0
      );

  const sellWeight =
    votes
      .filter(
        vote=>
          vote.vote === "SELL"
      )
      .reduce(
        (sum, vote)=>
          sum +
          vote.weight,
        0
      );

  const totalVotingWeight =
    buyWeight +
    sellWeight;

  let finalDirection =
    null;

  let consensusReason =
    null;

  const leadingWeight =
    Math.max(
      buyWeight,
      sellWeight
    );

  const opposingWeight =
    Math.min(
      buyWeight,
      sellWeight
    );

  const directionalAgreement =
    totalVotingWeight > 0
      ? leadingWeight /
        totalVotingWeight
      : 0;

  if(
    !leanDirection
  ){
    consensusReason =
      "Primary EMA trend is not fully aligned";
  }else if(
    totalVotingWeight === 0
  ){
    consensusReason =
      "No directional evidence is available";
  }else if(
    directionalAgreement <
      0.68
  ){
    consensusReason =
      `Directional evidence is mixed — BUY weight ${buyWeight}, SELL weight ${sellWeight}`;
  }else{
    finalDirection =
      buyWeight >
        sellWeight
        ? "BUY"
        : "SELL";

    if(
      finalDirection !==
      leanDirection
    ){
      consensusReason =
        `Secondary indicators oppose the primary ${leanDirection} trend`;

      finalDirection =
        null;
    }
  }

  if(
    finalDirection &&
    !newsEvaluation.pass
  ){
    consensusReason =
      newsEvaluation.detail;

    finalDirection =
      null;
  }

  addStep(
    "Weighted Consensus",
    finalDirection
      ? "pass"
      : "fail",
    finalDirection
      ? `${finalDirection} consensus · BUY weight ${buyWeight}, SELL weight ${sellWeight}`
      : consensusReason
  );

  // ── ATR / volatility stop basis ────────────────────────────

  const atrValue =
    ohlcRows
      ? computeATR(
          ohlcRows,
          14
        )
      : null;

  const volatility =
    computeVolatility(
      rows
    );

  const fallbackBuffer =
    Math.max(
      volatility *
      0.5,
      0.0004
    ) *
    lastClose;

  const stopBuffer =
    atrValue != null &&
    atrValue > 0
      ? atrValue *
        1.25
      : fallbackBuffer;

  addStep(
    "ATR Stop Basis",
    "info",
    atrValue != null
      ? `ATR(14) = ${safeFixed(atrValue,lastClose > 100 ? 3 : 5)} · stop buffer uses 1.25 ATR`
      : `Close-based volatility fallback = ${safeFixed(stopBuffer,lastClose > 100 ? 3 : 5)}`
  );

  // ── Trade plan ─────────────────────────────────────────────

  let tradePlan =
    null;

  if(finalDirection){
    const nearestSupport =
      supportResistance.supports[0] ??
      null;

    const nearestResistance =
      supportResistance.resistances[0] ??
      null;

    let stop =
      null;

    let target1 =
      null;

    let target2 =
      null;

    let target3 =
      null;

    if(finalDirection === "BUY"){
      stop =
        nearestSupport != null &&
        nearestSupport <
          lastClose
          ? nearestSupport -
            stopBuffer *
            0.25
          : lastClose -
            stopBuffer;

      const risk =
        lastClose -
        stop;

      if(
        risk > 0 &&
        Number.isFinite(risk)
      ){
        const structuralTarget =
          nearestResistance != null &&
          nearestResistance >
            lastClose
            ? nearestResistance
            : null;

        target1 =
          structuralTarget != null &&
          (
            structuralTarget -
            lastClose
          ) >=
          risk *
          2
            ? structuralTarget
            : lastClose +
              risk *
              2;

        target2 =
          Math.max(
            target1,
            lastClose +
            risk *
            3
          );

        target3 =
          Math.max(
            target2,
            lastClose +
            risk *
            4
          );
      }
    }else{
      stop =
        nearestResistance != null &&
        nearestResistance >
          lastClose
          ? nearestResistance +
            stopBuffer *
            0.25
          : lastClose +
            stopBuffer;

      const risk =
        stop -
        lastClose;

      if(
        risk > 0 &&
        Number.isFinite(risk)
      ){
        const structuralTarget =
          nearestSupport != null &&
          nearestSupport <
            lastClose
            ? nearestSupport
            : null;

        target1 =
          structuralTarget != null &&
          (
            lastClose -
            structuralTarget
          ) >=
          risk *
          2
            ? structuralTarget
            : lastClose -
              risk *
              2;

        target2 =
          Math.min(
            target1,
            lastClose -
            risk *
            3
          );

        target3 =
          Math.min(
            target2,
            lastClose -
            risk *
            4
          );
      }
    }

    if(
      stop != null &&
      target1 != null
    ){
      const risk =
        Math.abs(
          lastClose -
          stop
        );

      const reward =
        Math.abs(
          target1 -
          lastClose
        );

      const riskReward =
        risk > 0
          ? reward /
            risk
          : 0;

      if(riskReward >= 2){
        tradePlan = {
          direction:
            finalDirection,

          entry:
            lastClose,

          stop,

          target1,

          target2,

          target3,

          risk,

          rr:
            riskReward,

          atr:
            atrValue,

          stopMethod:
            atrValue != null
              ? "ATR + market structure"
              : "Close volatility + market structure"
        };

        addStep(
          "Risk:Reward ≥ 1:2",
          "pass",
          `Risk:Reward to TP1 = 1:${riskReward.toFixed(2)}`
        );
      }else{
        addStep(
          "Risk:Reward ≥ 1:2",
          "fail",
          `Risk:Reward to TP1 = 1:${riskReward.toFixed(2)} · below required 1:2`
        );
      }
    }else{
      addStep(
        "Risk:Reward ≥ 1:2",
        "fail",
        "A valid stop and target could not be constructed"
      );
    }
  }else{
    addStep(
      "Risk:Reward ≥ 1:2",
      "skip",
      consensusReason ||
      "No qualifying direction"
    );
  }

  // ── Confidence ─────────────────────────────────────────────

  let confidence =
    null;

  if(finalDirection){
    const sameDirectionWeight =
      finalDirection === "BUY"
        ? buyWeight
        : sellWeight;

    const maximumConfiguredWeight =
      100;

    let score =
      (
        sameDirectionWeight /
        maximumConfiguredWeight
      ) *
      70;

    if(
      structure.direction ===
      finalDirection
    ){
      score +=
        10;
    }

    if(
      higherTimeframeDirection ===
      finalDirection
    ){
      score +=
        8;
    }

    if(
      candleVote ===
      finalDirection
    ){
      score +=
        5;
    }

    if(
      adxValue != null &&
      adxValue >= 25
    ){
      score +=
        5;
    }

    if(newsEvaluation.pass){
      score +=
        2;
    }

    if(
      opposingWeight >
      20
    ){
      score -=
        10;
    }

    confidence =
      clamp(
        Math.round(
          score
        ),
        5,
        97
      );
  }

  addStep(
    "Confidence Score",
    "info",
    confidence == null
      ? "No qualified direction to score"
      : `${confidence}% · weighted trend, momentum, structure, MTF, candle, ADX and news alignment`
  );

  const signal =
    tradePlan
      ? tradePlan.direction
      : "HOLD";

  const suppressionReason =
    signal === "HOLD"
      ? (
          tradePlan == null &&
          finalDirection
            ? "NO TRADE — Risk:Reward is below the required minimum"
            : `NO TRADE — ${consensusReason || "setup requirements are incomplete"}`
        )
      : null;

  addStep(
    "Final Decision",
    signal === "HOLD"
      ? "fail"
      : "pass",
    signal === "HOLD"
      ? suppressionReason
      : `${signal} setup confirmed with ${confidence}% confidence`
  );

  const countedSteps =
    pipeline.filter(
      step=>
        [
          "Trend",
          "EMA Alignment",
          "MACD Confirmation",
          "RSI Confirmation",
          "Multi-Timeframe Confirmation",
          "Candle Pattern",
          "Market Structure",
          "Support/Resistance",
          "High-Impact News Filter",
          "Weighted Consensus",
          "Risk:Reward ≥ 1:2"
        ].includes(
          step.name
        )
    );

  const passCount =
    countedSteps.filter(
      step=>
        step.status === "pass"
    ).length;

  return {
    rows,

    lastClose,

    n:
      rows.length,

    pipeline,

    trendLabel:
      trendState.label,

    emaInfo:
      trendState,

    leanDirection,

    lastRsi,

    rsiP:
      rsiPeriod,

    macdOk:
      macd.lastMacd != null &&
      macd.lastSignal != null,

    macd,

    adx:
      adxValue,

    atr:
      atrValue,

    structure,

    sr:
      supportResistance,

    candlePattern,

    newsScore:
      clamp(
        safeNumber(
          newsEvaluation.score,
          0
        ),
        -100,
        100
      ),

    confidence,

    signal,

    suppressionReason,

    tradePlan,

    passCount,

    gatedCount:
      countedSteps.length,

    votes,

    buyWeight,

    sellWeight,

    higherTimeframeDirection
  };
}
